# The job user of the js-agent .deb, installed as /usr/lib/sysusers.d/js-agent.conf and made by
# the package's postinst (`systemd-sysusers js-agent.conf`). js-agent-crun.service runs every
# `crun` as this account (`--job-user jsjob`), and the agent's start check refuses a host that
# has no such user in /etc/passwd or gives it uid or gid 0.
#
# A system account with a group of the same name, a uid and gid systemd-sysusers picks from the
# system range, no home (/nonexistent) and no login shell: the account of the setup script's
# `useradd --system --user-group --no-create-home --home-dir /nonexistent --shell
# /usr/sbin/nologin jsjob`. An account that already exists, as one the setup script or an
# operator made, is kept as it is. Nothing removes the account when the package is removed.
#
# Its subordinate uid and gid ranges are not made here: see "What the host provides" in
# packaging/js-agent/deb/README.md.
u jsjob - "jobscheduler job user" /nonexistent /usr/sbin/nologin
