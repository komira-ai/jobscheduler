# The directories of the js-agent package, installed as /usr/lib/tmpfiles.d/js-agent.conf and
# made by systemd-tmpfiles: at boot, by the unit before every start, and by hand after the
# install (`systemd-tmpfiles --create /usr/lib/tmpfiles.d/js-agent.conf`, see the unit's
# header). All are root's and closed to group and others: the join token (/etc/js-agent/token),
# the host credential (/var/lib/js-agent/state/host-credential) and the job directories are the
# agent's alone. No maintainer script makes them. The age field is `-` on every line: no
# cleaning pass ever deletes anything in them.
d /etc/js-agent 0700 root root -
d /var/lib/js-agent 0700 root root -
d /var/lib/js-agent/state 0700 root root -
d /var/lib/js-agent/scratch 0700 root root -
