# The directories of the js-agent package, installed as /usr/lib/tmpfiles.d/js-agent.conf and
# made by systemd-tmpfiles (at boot, or `systemd-tmpfiles --create js-agent.conf`). All are
# root's and closed to group and others: the join token (/etc/js-agent/token), the host
# credential (/var/lib/js-agent/state/host-credential) and the job directories are the
# agent's alone. No maintainer script makes them.
d /etc/js-agent 0700 root root -
d /var/lib/js-agent 0700 root root -
d /var/lib/js-agent/state 0700 root root -
d /var/lib/js-agent/scratch 0700 root root -
