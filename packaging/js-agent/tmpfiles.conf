# The directories of the engine unit of the js-agent package (js-agent.service), installed as
# /usr/share/js-agent/tmpfiles.conf and made by systemd-tmpfiles: by the unit before every start,
# and by hand after the install (`systemd-tmpfiles --create /usr/share/js-agent/tmpfiles.conf`,
# see the unit's header). It is not in a tmpfiles.d directory, so boot does not apply it: the
# package's one tmpfiles.d file is the crun unit's (deb/tmpfiles.conf), which declares
# /var/lib/js-agent and the scratch root 0711, and systemd-tmpfiles applies only the first of two
# lines for one path. All are root's and closed to group and others: the join token (/etc/js-agent/token),
# the host credential (/var/lib/js-agent/state/host-credential) and the job directories are the
# agent's alone. No maintainer script makes them. The age field is `-` on every line: no
# cleaning pass ever deletes anything in them.
d /etc/js-agent 0700 root root -
d /var/lib/js-agent 0700 root root -
d /var/lib/js-agent/state 0700 root root -
d /var/lib/js-agent/scratch 0700 root root -
