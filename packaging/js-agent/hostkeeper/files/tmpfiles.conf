# The directories of the crun unit (js-agent-crun.service) in the hostkeeper package, linked by
# hostkeeper as /etc/tmpfiles.d/js-agent-crun.conf. It is tmpfiles-crun.conf of the setup script
# without the release layout under /opt/js-agent (the directory of releases, the directory of the
# release link and the link itself): hostkeeper keeps the releases and the link under
# /var/lib/hostkeeper/packages/js-agent. The job's ids walk down /var/lib/js-agent and the
# scratch mount to the scratch root (its runs directory), so those three are 0711 (searchable by
# others, listable and writable by no one but root). Every directory a job's id never walks
# through stays 0700: the state root holds the taint marker and the host credential and is the
# agent's alone, and /etc/js-agent holds the join token and the flags file. The age field is `-`
# on every line: no cleaning pass ever deletes anything in them.
d /etc/js-agent 0700 root root -
d /var/lib/js-agent 0711 root root -
d /var/lib/js-agent/state 0700 root root -
d /var/lib/js-agent/scratch 0711 root root -
d /var/lib/js-agent/scratch/runs 0711 root root -
