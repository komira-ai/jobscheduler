# The directories of the crun unit (js-agent-crun.service), installed as
# /etc/tmpfiles.d/js-agent-crun.conf. It differs from tmpfiles.conf in two modes: the job's ids
# walk down /var/lib/js-agent to the scratch root, so both are 0711 (searchable by others,
# listable and writable by no one but root), and every directory a job's id never walks through
# stays 0700. The state root holds the taint marker and the host credential and is the agent's
# alone; /etc/js-agent holds the join token. The age field is `-` on every line: no cleaning
# pass ever deletes anything in them. Where both files are read the first one by name wins for
# a path they share, this one; the engine unit's own ExecStartPre reads only tmpfiles.conf and
# sets the 0700 modes again, so starting that unit undoes these two.
d /etc/js-agent 0700 root root -
d /var/lib/js-agent 0711 root root -
d /var/lib/js-agent/state 0700 root root -
d /var/lib/js-agent/scratch 0711 root root -
