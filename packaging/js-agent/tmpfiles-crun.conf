# The directories of the crun unit (js-agent-crun.service), installed as
# /etc/tmpfiles.d/js-agent-crun.conf. It differs from tmpfiles.conf in two modes, one line and the
# release layout below: the job's ids walk down /var/lib/js-agent and the scratch mount to the
# scratch root (its runs directory), so the first two are 0711 (searchable by others, listable and
# writable by no one but root) and the runs directory, a line tmpfiles.conf lacks, is 0711 too.
# Every directory a job's id never walks through stays 0700. The state root holds the taint marker
# and the host credential and is the agent's alone; /etc/js-agent holds the join token. The age
# field is `-` on every line: no cleaning pass ever deletes anything in them. Where both files are
# read the first one by name wins for a path they share, this one; the engine unit's own
# ExecStartPre reads only tmpfiles.conf and sets the 0700 modes again, so starting that unit
# undoes these two.
#
# The last four lines are the release layout of the host updater's js-agent hook
# (packaging/js-agent/updater.d/js-agent.toml): the directory of the releases the updater stages,
# the directory of the release link, and the link itself, which the unit's ExecStart runs the agent
# through. `L` without `+` makes the link only when nothing is at its path, so the hook's moves
# stand; its first target is /usr/bin, the directory of the package's agent. All are root's and
# closed to writes by others: the updater refuses a root hook a write path below a directory that
# another account could swap.
d /etc/js-agent 0700 root root -
d /var/lib/js-agent 0711 root root -
d /var/lib/js-agent/state 0700 root root -
d /var/lib/js-agent/scratch 0711 root root -
d /var/lib/js-agent/scratch/runs 0711 root root -
d /opt/js-agent 0755 root root -
d /opt/js-agent/releases 0755 root root -
d /opt/js-agent/link 0755 root root -
L /opt/js-agent/link/current - - - - /usr/bin
