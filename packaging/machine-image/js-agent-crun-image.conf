# A drop-in of js-agent-crun.service on a jobscheduler machine image, installed by the image build
# as /etc/systemd/system/js-agent-crun.service.d/10-image.conf (docs/runbooks/machine-images.md).
# The agent starts only after the user-data reader found this host's configuration and reloaded
# systemd: with no user data the reader fails its assertion, and this unit does not start.
[Unit]
Requires=js-agent-user-data.service
After=js-agent-user-data.service
