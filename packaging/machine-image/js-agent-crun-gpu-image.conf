# A drop-in of js-agent-crun-gpu.service on a jobscheduler machine image, installed by the image
# build as /etc/systemd/system/js-agent-crun-gpu.service.d/10-image.conf
# (docs/runbooks/machine-images.md). The oneshot writes the agent's GPU drop-in from the agent
# unit's ExecStart, which the user data's drop-in (50-user-data.conf) sets: it runs after the
# user-data reader, so that drop-in is there and loaded, and the GPU drop-in carries this host's
# --server and --pool.
[Unit]
After=js-agent-user-data.service
