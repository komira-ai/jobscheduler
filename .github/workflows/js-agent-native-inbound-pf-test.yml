# Builds the js-agent inbound pf test binary (`--test native_inbound_pf`) for
# aarch64-apple-darwin and uploads it, WITHOUT running it. The test
# (crates/js-agent/tests/native_inbound_pf/, the Mac part `#[ignore]`) serves the real
# `js-mac-session` helper from the test process with a range of one uid, starts a listener as
# that user through the agent's own runtime, loads the real `js-mac-provision` pf anchor for
# that uid under its own test anchor, and connects to the listener from the test process on
# the Mac's primary address (expected blocked, proven by the blocking rule's packet counter)
# and, as controls, on 127.0.0.1 and on the primary address after the anchor is removed. It
# answers whether the anchor filters inbound traffic to a listener a pool uid owns. It needs
# root, makes a user and loads pf rules: an operator runs it once on a provisioned Mac that has
# no other use, and CI never runs it.
# Download the artifact, check SHA256SUMS, copy the binary over, chmod +x it (the artifact zip
# drops the mode) and, as root, run
#   JS_NATIVE_INBOUND_ROOT=<a new root-owned 0755 directory every user can search down to> \
#     JS_NATIVE_INBOUND_UID=<a uid from 500 to 60000 nothing uses> \
#     ./native_inbound_pf --ignored --test-threads=1 --nocapture
# (libtest flags come first.)
#
# Manual runs only. It publishes nothing: the binary is a workflow artifact for seven days.
name: js-agent-native-inbound-pf-test

on:
  # No inputs: it builds exactly the commit it is dispatched on.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TARGET: aarch64-apple-darwin
  # The oldest macOS the binaries must run on; a newer image must not raise it.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: rustup target add "$TARGET"
      - name: Build the test binary without running it
        run: |
          set -euo pipefail
          cargo test -p js-agent --test native_inbound_pf --no-run --locked --target "$TARGET" --message-format=json > build.json
      - name: Pick the binary and check what it is
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          short="${commit:0:12}"
          # The test executable of the `native_inbound_pf` integration test: a compiler-artifact
          # message with profile.test and that target's name and kind, never a guess by file name.
          exe="$(jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .target.name == "native_inbound_pf" and (.target.kind | index("test")) != null and .executable != null) | .executable' build.json)"
          if [ "$(printf '%s\n' "$exe" | grep -c .)" != 1 ]; then
            echo "::error::expected exactly one native_inbound_pf test executable, got: $exe"
            exit 1
          fi
          mkdir dist
          cp "$exe" dist/native_inbound_pf
          description="$(file dist/native_inbound_pf)"
          echo "$description"
          case "$description" in
            *"Mach-O 64-bit executable arm64"*) ;;
            *)
              echo "::error::dist/native_inbound_pf is not an arm64 Mach-O executable"
              exit 1
              ;;
          esac
          (cd dist && shasum -a 256 native_inbound_pf > SHA256SUMS)
          sha="$(cut -d ' ' -f 1 dist/SHA256SUMS)"
          {
            echo "### js-agent native inbound pf test binary"
            echo
            echo "- commit: \`$commit\`"
            echo "- target: \`$TARGET\`"
            echo "- sha256: \`$sha\`"
            echo "- file: $description"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SHORT=$short" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-agent-native-inbound-pf-test-${{ env.SHORT }}
          path: |
            dist/native_inbound_pf
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
