# Builds the js-agent inbound pf test binary (`--test native_inbound_pf`) for
# aarch64-apple-darwin and uploads it, WITHOUT running it. The test
# (crates/js-agent/tests/native_inbound_pf/, the Mac part `#[ignore]`) opens the agent's account
# pool with one slot, starts a listener as its account through the agent's own runtime and
# supervisor (the js-agent binary shipped beside the test binary), loads the real `js-mac-provision` pf anchor for
# that uid under its own test anchor, and connects to the listener from the test process on
# the Mac's primary address (expected blocked, proven by the blocking rule's packet counter)
# and, as controls, on 127.0.0.1 and on the primary address after the anchor is removed. It
# answers whether the anchor filters inbound traffic to a listener a pool uid owns. It needs
# root, makes a user and loads pf rules: an operator runs it once on a provisioned Mac that has
# no other use, and CI never runs it.
# Download the artifact, check SHA256SUMS, copy both binaries into one directory, chmod +x them
# (the artifact zip drops the mode) and, as root, run
#   JS_NATIVE_INBOUND_ROOT=<a new root-owned 0755 directory every user can search down to> \
#     JS_NATIVE_INBOUND_UID=<a uid from 501 to 60000, outside 600-799, nothing uses> \
#     ./native_inbound_pf --ignored --test-threads=1 --nocapture
# (libtest flags come first.)
#
# Manual runs only. It publishes nothing: the binary is a workflow artifact for seven days.
name: js-agent-native-inbound-pf-test

on:
  # No inputs: it builds exactly the commit it is dispatched on.
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TARGET: aarch64-apple-darwin
  # The oldest macOS the binaries must run on; a newer image must not raise it.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: rustup target add "$TARGET"
      - name: Build the test binary without running it
        run: cargo test -p js-agent --test native_inbound_pf --no-run --locked --target "$TARGET" --message-format=json > build.json
      - name: Stage the test binary and the js-agent it starts, with their sums
        run: cargo xtask mac-test-artifact --test native_inbound_pf --target "$TARGET" --build-json build.json --out dist --commit "$GITHUB_SHA" --summary "$GITHUB_STEP_SUMMARY" --github-env "$GITHUB_ENV"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-agent-native-inbound-pf-test-${{ env.SHORT }}
          path: |
            dist/native_inbound_pf
            dist/js-agent
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
