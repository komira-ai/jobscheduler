# The beta stage of the release for the platforms other than Linux x86_64: the workspace's tests
# on Apple silicon (the job `macos`). release.yml calls this file (`workflow_call`) in a run of a
# push to main, in parallel with `artifacts`, and holds back only the promotion of the macOS
# assets to the release (release.yml's `promote-macos`); nothing of Linux x86_64 waits for it.
# No pull request runs it: a pull request's checks are Linux x86_64 alone
# (crates/xtask/tests/pr_linux_only holds every workflow to that). A manual run, on any branch,
# runs the same job (`gh workflow run beta.yml --ref <branch>`), so a change whose macOS tests
# matter can be seen green here before it merges; only main's run saves the Cargo cache.
# A pull request compiles what this job tests, though: ci.yml's `lint` job runs clippy for
# aarch64-apple-darwin on Linux over the same crates and features (crates/xtask/tests/
# macos_clippy holds the two lists together), so code that does not compile for macOS fails its
# pull request rather than this job.
#
# The workspace builds and passes its tests on Apple silicon but for the three crates that are
# Linux code and are not built for macOS: js-contain (the crun runtime, cgroups), js-host-step
# (the Linux host steps) and js-mdm (which applies its rendering to a Linux host through
# js-host-step; the rendering, js-mdm-core, is tested here). Tests that need Linux (pidfds,
# /proc, crun) are cfg-gated, not removed; the coverage and the Postgres tests stay on Linux.
# js-mac-pool's Seatbelt profile builder also runs its generated profile under the real
# `sandbox-exec` here (tests/runner.rs), and xtask's macOS package tests build a package with
# Apple's pkgbuild. The release's own macOS build (artifacts.yml, `build` for
# aarch64-apple-darwin) makes the release binaries of that leg.
name: beta

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: 0

jobs:
  macos:
    runs-on: macos-15
    # The workspace's tests take about an hour on the hosted runner (the first full run: the
    # build 10 minutes, the tests 47 minutes before one test hung).
    timeout-minutes: 120
    env:
      # The oldest macOS the binaries must run on; a newer image must not raise it
      # (the step after the build reads each binary's minos and fails above this).
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      # The tests' host, prepared as the Linux jobs prepare theirs. A second loopback address:
      # Linux routes all of 127.0.0.0/8 to the loopback interface, macOS answers on 127.0.0.1
      # alone, and the lease server's tests put a second listener on 127.0.0.2. And a Postgres
      # server for the tests that need one (macOS runners have no service containers), from
      # Homebrew as the Linux jobs take theirs from the distribution: a data directory of this
      # job, local connections trusted and the socket in the job's temporary directory, as the
      # `test` job's service container; its URL is the one that job sets. A test that needs
      # the server fails, and does not skip, when it is not there.
      - name: Add the loopback address 127.0.0.2
        run: sudo ifconfig lo0 alias 127.0.0.2 up
      - name: Install Postgres from Homebrew
        run: brew install --quiet postgresql@17
      # crates/xtask/src/postgres_for_tests.rs: initdb, start and wait, then the URL in
      # GITHUB_ENV for the steps after this one.
      - name: Start a Postgres server for the tests that need one
        run: cargo xtask postgres-for-tests --bin-dir /opt/homebrew/opt/postgresql@17/bin --data-dir "$RUNNER_TEMP/pg" --socket-dir "$RUNNER_TEMP" --github-env "$GITHUB_ENV"
      - run: cargo build --workspace --locked --exclude js-contain --exclude js-host-step --exclude js-mac-first-install --exclude js-mdm
      - name: Check the minimum macOS of the built binaries
        run: |
          set -euo pipefail
          checked=0
          for f in target/debug/*; do
            [ -f "$f" ] && [ -x "$f" ] || continue
            file "$f" | grep -q 'Mach-O 64-bit executable arm64' || continue
            minos="$(otool -l "$f" | awk '/LC_BUILD_VERSION/ {b=1} b && $1 == "minos" {print $2; exit}')"
            echo "$f minos $minos"
            if [ "$(printf '%s\n%s\n' "$minos" "$MACOSX_DEPLOYMENT_TARGET" | sort -V | tail -n 1)" != "$MACOSX_DEPLOYMENT_TARGET" ]; then
              echo "::error::$f needs macOS $minos, above the pinned $MACOSX_DEPLOYMENT_TARGET"
              exit 1
            fi
            checked=$((checked + 1))
          done
          [ "$checked" -gt 0 ] || { echo "::error::no Mach-O binary found to check"; exit 1; }
      # --no-fail-fast: a red run names every failing test, as in the Linux `test` job, but with js-sim-cell's feature `slow-families` on, which that job leaves off.
      - run: cargo test --workspace --locked --no-fail-fast --features js-sim-cell/slow-families --exclude js-contain --exclude js-host-step --exclude js-mac-first-install --exclude js-mdm
      # The account module's privileged calls run for real, as root (crates/js-agent/src/mac_accounts/macos/root_tests.rs):
      # a directory record made and deleted, every process of a uid killed, a program run as an account.
      # The run above skips them by name (#[ignore], with the reason); this step runs exactly them.
      # It runs whatever the workspace step above ended with: its result is its own.
      - name: Run the account module's root tests
        if: ${{ !cancelled() }}
        run: sudo -E env "PATH=$PATH" "HOME=$HOME" cargo test -p js-agent --lib --locked -- --ignored --test-threads=1 mac_accounts::macos::root_tests
      # The put ingest's hand-over runs for real, as root (crates/js-agent/src/mac_put/root_tests.rs):
      # the key's folders given to another user, the job's directory to its group, the owners and modes read back,
      # and a link in the job directory's place not followed.
      # The run above skips them by name (#[ignore], with the reason); this step runs exactly them, as one command.
      - name: Run the put ingest's root tests
        if: ${{ !cancelled() }}
        run: sudo -E env "PATH=$PATH" "HOME=$HOME" cargo test -p js-agent --lib --locked -- --ignored --test-threads=1 mac_put::root_tests
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      # The supervisor's privileged calls (crates/js-agent/tests/mac_supervisor_root.rs, every
      # test `#[ignore]`, so the step above lists them as ignored and runs none): the real audit
      # session, drop to the slot user and limits, each read back from the system, as root.
      # It runs after the cache is saved, so no file root writes into `target` is cached, and
      # also when a test of the step above failed, so a red run still says how these went.
      - name: Run the supervisor's root tests as root
        if: ${{ !cancelled() }}
        run: sudo -E env "PATH=$PATH" "HOME=$HOME" cargo test -p js-agent --test mac_supervisor_root --locked -- --ignored --nocapture --test-threads=1
      # The native runtime's root tests (crates/js-agent/tests/native_privileged.rs, each
      # `#[ignore]` by name in the run above): a real account pool over the Mac's directory and
      # processes, the real supervisor, the run directories given to the slot account, a stop
      # signalling the job's group, the account retired. They run after the cache is saved, as
      # they leave root-owned files in target. They make their own directory below /private/var.
      # The VM test needs a signed js-vmm and a base image.
      - name: Run the native runtime's root tests as root
        if: ${{ !cancelled() }}
        run: sudo -E env "PATH=$PATH" "HOME=$HOME" cargo test -p js-agent --test native_privileged --locked -- --ignored --nocapture --test-threads=1 --skip a_command_runs_in_a_fresh_vm
