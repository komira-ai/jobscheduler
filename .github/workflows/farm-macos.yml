# A macOS step like the `macos` job of beta.yml, run on a farm Mac through `actions/run`
# (docs/ci-runner.md) from a GitHub-hosted Linux runner: the tests of three crates that need no
# sandbox of their own, and a build of `js` for Apple silicon, which comes back as the artifact
# `farm-macos-js`. It is not part of the release's beta stage (release.yml does not call it).
# Run by hand only: no pull request and no push runs it. The `js` release whose
# `ci run` the action calls is an input, with its SHA-256, so a run names what it trusts.
name: farm-macos

on:
  workflow_dispatch:
    inputs:
      js_version:
        description: The jobscheduler release whose js runs the step, such as 0.1.400.
        required: true
        type: string
      js_sha256:
        description: The SHA-256 of that release's js-<version>-x86_64-unknown-linux-musl.tar.gz.
        required: true
        type: string
      image:
        description: The macOS bundle the job is named by, NAME@sha256:HEX.
        required: true
        type: string

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/run
        with:
          os: macos
          image: ${{ inputs.image }}
          run: rustup toolchain install && cargo test --locked -p js-types -p js-sizing -p js-client && cargo build --locked -p js-cli
          outputs: target/debug/js
          artifact-name: farm-macos-js
          wall-limit: 1h
          js-version: ${{ inputs.js_version }}
          js-sha256: ${{ inputs.js_sha256 }}
          server: ${{ vars.JS_CI_SERVER }}
          ca-cert: ${{ vars.JS_CI_CA_CERT }}
          token: ${{ secrets.JS_CI_TOKEN }}
          tailnet-client-id: ${{ vars.JS_CI_TAILNET_CLIENT_ID }}
          tailnet-audience: ${{ vars.JS_CI_TAILNET_AUDIENCE }}
          tailnet-ping: ${{ vars.JS_CI_TAILNET_PING }}
