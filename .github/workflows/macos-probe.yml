# What a native (sandbox-exec) runtime relies on, probed on a hosted macOS runner.
# crates/js-mac-probe prints a JSON report and exits non-zero when a probe with an
# expected outcome is wrong; probes whose answer is unknown only report. The report runs as
# the runner's own user, and its launchd probe in that user's domain; the trace file is
# uploaded with the report. One step runs as root through sudo, which the runner allows
# without a password: the launchd probe in the system domain (`launchd-system`), which
# bootstraps and boots out LaunchDaemons and drops a child to the uid and gid of `nobody`
# (-2); its report is in the step's log and the uploaded files. Each report fails its step
# on its own asserted probes. The image
# is pinned to macos-15 (macos-14 retires on 2026-11-02). It runs in the beta stage of the
# release (release.yml's `beta-macos-probe` calls this file on a push to main) and by hand; no
# pull request runs it.
name: macos-probe

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: 0
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo clippy -p js-mac-probe --all-targets --locked -- -D warnings
      - run: cargo test -p js-mac-probe --locked
      - name: Probe
        run: |
          mkdir -p "$RUNNER_TEMP/report"
          cargo run -q -p js-mac-probe --locked -- report --work "$RUNNER_TEMP" --home "$HOME" --out "$RUNNER_TEMP/report/report.json" --trace-out "$RUNNER_TEMP/report/trace.sb"
      # /private/var/tmp: a directory every uid may traverse, which the dropped child needs.
      - name: Probe launchd as root
        if: ${{ !cancelled() }}
        run: sudo -n "$GITHUB_WORKSPACE/target/debug/js-mac-probe" launchd-system --work /private/var/tmp --drop 4294967294:4294967294 --out "$RUNNER_TEMP/report/launchd-system.json"
      - name: Report
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$RUNNER_TEMP/report/report.json" ]; then
            { echo '```json'; cat "$RUNNER_TEMP/report/report.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: macos-probe-report
          path: |
            ${{ runner.temp }}/report/report.json
            ${{ runner.temp }}/report/launchd-system.json
            ${{ runner.temp }}/report/trace.sb
          if-no-files-found: ignore
