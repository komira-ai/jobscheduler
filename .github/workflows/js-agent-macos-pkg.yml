# The js-agent installer package for macOS (packaging/js-agent-macos): built on a hosted
# Apple silicon runner from the release build of js-agent, js-mac-session and js-mac-provision,
# with pkgbuild and productbuild, and read back by the xtask `pkg check-macos` verb, which
# refuses anything but the files, modes and owners the package is meant to have, and any
# script. It is a hostkeeper `macos-pkg` package (docs/design/mac-hostkeeper-package.md): the
# file is `js-agent-<version>-macos-arm64.pkg`, it carries no preinstall or postinstall script,
# and hostkeeper's coordinator orders it onto the Macs of a host group. It publishes nothing
# itself: release.yml's `pkg-upload` job puts the signed package in the package repository.
#
# `build`, `sign-code`, `package` and `sign` are the chain that makes the package that is
# released; `build-update` and `first-install` are for the first-install test. `build` runs in the
# beta stage of the release (release.yml's `beta-macos-pkg` calls this file on a push to main) and
# by hand; no pull request runs it. It builds, checks and sums the package unsigned (the steps are
# the local action .github/actions/js-agent-macos-pkg), sums the three programs it built and
# uploads both, and no secret is named anywhere in it, so no code of a branch (a build script, a
# macro, xtask) can see one.
#
# `build-update` builds a second package, of the next patch version, with the same action, beside
# `build`: the first install updates the agent to it. It is uploaded as its own artifact and no
# job signs it or releases it.
#
# `first-install` runs on a manual run alone, on any branch: it calls
# js-agent-macos-first-install.yml, which installs the unsigned package `build` made the way
# hostkeeper does, runs the update hook as root, rolls a config package over the agent and
# updates it to the package `build-update` made, so a branch's package can be tried before it
# merges (`gh workflow run js-agent-macos-pkg.yml --ref <branch> -f version=X`). The release's
# call (a push) skips it, since release.yml's `beta-macos-first-install` runs it in its own job
# and `pkg-upload` waits for `beta-macos-pkg`, which it would lengthen.
#
# `sign-code`, `package` and `sign` run only on main: by hand, or in the release's call (`sign:
# true`, on a push, with `secrets: inherit`, without which a called workflow reads every secret as
# empty). Between them the programs are signed first and the package is made of the signed
# programs, so the package's own signature covers programs that carry theirs:
#
# - `sign-code` runs in the environment `pkg-signing`, which a repository administrator creates
#   with its secrets and a rule that only main may deploy to it. It takes the three programs from
#   `build`, checks them against the sums `build` wrote, and signs each with `codesign` under the
#   Developer ID Application identity of the team, a fixed identifier, the hardened runtime and a
#   secure timestamp (the identifiers and the identity are the table of
#   crates/xtask/src/release/mac_programs.rs). The identity is found in a temporary keychain by
#   its name; Apple's Developer ID intermediate is fetched over HTTPS and held to its SHA-256
#   before it is imported; the job fails when the identity expires within 30 days. Nothing built
#   from the repository runs in it: no checkout, no cargo, and the system tools it calls are called
#   by absolute path. It fails, naming the secret, when a signing secret is not set.
# - `package` holds no secret and has no environment. It checks the repository out, builds the
#   package with the local action from the signed programs instead of building them (the action
#   checks each staged program with `cargo xtask release check-code-signature`, so the package's
#   cdhash pin of js-agent is read from the signed binary), and uploads the package.
# - `sign` runs in the environment `pkg-signing`. It does not build: it takes the checked package
#   from `package` and the checker from `build`, checks that the package is the one `package`
#   summed, signs it with `productsign --timestamp` (no notarization: hostkeeper reads the
#   signature and the signer's certificate, which each Mac lists, and does not need Apple's
#   ticket), then checks the signed package with the checker and sums it. Nothing built from the
#   repository runs before the signing step, and the system tools it calls are called by absolute
#   path. It runs no cargo. A secret is named only in the environment of the step that needs it.
#   When the environment or the secrets of the installer certificate are not set up, `sign` says
#   so in a notice, skips every step after the first and the run succeeds.
#
# No command expands an expression: a script reads its environment. The version, which goes
# into file names, is checked as MAJOR.MINOR.PATCH before anything uses it.
#
# The release's call builds the release's version; a manual run builds the version typed.
# crates/xtask/tests/macos_pkg_workflow/ and macos_code_signing.rs pin these rules.
name: js-agent-macos-pkg

on:
  workflow_call:
    inputs:
      version:
        description: The package version, MAJOR.MINOR.PATCH
        required: false
        type: string
        default: 0.0.0
      sign:
        description: Sign the package (on main, for a push)
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: The package version, MAJOR.MINOR.PATCH
        required: true
        type: string

permissions: {}

# A manual run of one version on one ref waits for the one before it.
concurrency:
  group: js-agent-macos-pkg-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  VERSION: ${{ inputs.version || '0.0.0' }}
  # The oldest macOS the programs must run on, as in the release build.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    # The check's name (`build` alone is also a job of js-agent-deb.yml).
    name: js-agent-macos-pkg
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check the version
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::the version must be MAJOR.MINOR.PATCH"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Build, check and sum the unsigned package
        uses: ./.github/actions/js-agent-macos-pkg
        with:
          version: ${{ env.VERSION }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-agent-macos-pkg-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Sum the programs
        run: |
          set -euo pipefail
          cd target/release
          shasum -a 256 js-agent js-mac-session js-mac-provision > PROGRAMS.SHA256SUMS
          shasum -a 256 --check PROGRAMS.SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-agent-macos-programs-unsigned
          path: |
            target/release/js-agent
            target/release/js-mac-session
            target/release/js-mac-provision
            target/release/PROGRAMS.SHA256SUMS
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-agent-macos-checker
          path: target/debug/xtask
          if-no-files-found: error
          retention-days: 1

  # The package the first install updates the agent to: the next patch version of the same
  # programs, built by the same action in a job of its own so that it runs beside `build` and
  # lengthens nothing. It is not signed and no release takes it.
  build-update:
    name: js-agent-macos-pkg-update
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Name the next version
        id: next
        uses: ./.github/actions/js-agent-next-version
        with:
          version: ${{ env.VERSION }}
      - name: Build, check and sum the unsigned update package
        uses: ./.github/actions/js-agent-macos-pkg
        with:
          version: ${{ steps.next.outputs.version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-agent-macos-pkg-update-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 1

  sign-code:
    needs: [build]
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (inputs.sign && github.ref == 'refs/heads/main' && github.event_name == 'push') }}
    environment: pkg-signing
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check the signing secrets
        env:
          MACOS_APPLICATION_P12: ${{ secrets.MACOS_APPLICATION_P12 }}
          MACOS_APPLICATION_P12_PASSWORD: ${{ secrets.MACOS_APPLICATION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          missing=false
          for name in MACOS_APPLICATION_P12 MACOS_APPLICATION_P12_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::the secret $name is not set in the pkg-signing environment"
              missing=true
            fi
          done
          if [ "$missing" = true ]; then
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: js-agent-macos-programs-unsigned
          path: programs
      - name: The downloaded programs are the ones that were summed
        run: |
          set -euo pipefail
          cd programs
          /usr/bin/shasum -a 256 --check PROGRAMS.SHA256SUMS
      - name: Sign the programs
        env:
          MACOS_APPLICATION_P12: ${{ secrets.MACOS_APPLICATION_P12 }}
          MACOS_APPLICATION_P12_PASSWORD: ${{ secrets.MACOS_APPLICATION_P12_PASSWORD }}
          IDENTITY: "Developer ID Application: Komira AI, Inc. (U7RTX4XD3X)"
          # Apple's Developer ID G2 intermediate, https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          INTERMEDIATE_SHA256: f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/js-agent-code-signing.keychain-db"
          password="$(/usr/bin/uuidgen)"
          cleanup() {
            /usr/bin/security delete-keychain "$keychain" || true
            rm -f "$RUNNER_TEMP/application.p12" "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          }
          trap cleanup EXIT
          /usr/bin/security create-keychain -p "$password" "$keychain"
          /usr/bin/security set-keychain-settings -lut 3600 "$keychain"
          /usr/bin/security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_APPLICATION_P12" | /usr/bin/base64 --decode > "$RUNNER_TEMP/application.p12"
          /usr/bin/security import "$RUNNER_TEMP/application.p12" -P "$MACOS_APPLICATION_P12_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$keychain"
          /usr/bin/security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          /usr/bin/curl --fail --silent --show-error --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "$INTERMEDIATE_SHA256  $RUNNER_TEMP/DeveloperIDG2CA.cer" | /usr/bin/shasum -a 256 --check
          /usr/bin/security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -t cert -f x509 -k "$keychain"
          # The identity is the one valid Developer ID Application identity of the temporary
          # keychain that carries the team's name, found by its SHA-1.
          identity="$(/usr/bin/security find-identity -v -p codesigning "$keychain" | /usr/bin/awk -v name="$IDENTITY" 'index($0, "\"" name "\"") { print $2 }')"
          if ! [[ "$identity" =~ ^[0-9A-F]{40}$ ]]; then
            echo "::error::the keychain does not hold exactly one valid $IDENTITY identity"
            exit 1
          fi
          if ! /usr/bin/security find-certificate -c "$IDENTITY" -p "$keychain" | /usr/bin/openssl x509 -noout -checkend 2592000; then
            echo "::error::the $IDENTITY certificate expires within 30 days: renew it"
            exit 1
          fi
          while read -r program identifier; do
            /usr/bin/codesign --force --sign "$identity" --keychain "$keychain" --identifier "$identifier" --options runtime --timestamp "programs/$program"
          done <<'TABLE'
          js-agent com.komira.js-agent
          js-mac-session com.komira.js-agent.session
          js-mac-provision com.komira.js-agent.provision
          TABLE
      - name: The signed programs verify
        run: |
          set -euo pipefail
          for program in js-agent js-mac-session js-mac-provision; do
            /usr/bin/codesign --verify --strict --verbose=2 "programs/$program"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-agent-macos-programs-signed
          path: |
            programs/js-agent
            programs/js-mac-session
            programs/js-mac-provision
          if-no-files-found: error
          retention-days: 1

  package:
    needs: [build, sign-code]
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (inputs.sign && github.ref == 'refs/heads/main' && github.event_name == 'push') }}
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check the version
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::the version must be MAJOR.MINOR.PATCH"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: js-agent-macos-programs-signed
          path: signed-programs
      - name: Build, check and sum the package of the signed programs
        uses: ./.github/actions/js-agent-macos-pkg
        with:
          version: ${{ env.VERSION }}
          programs: signed-programs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-agent-macos-pkg-codesigned
          path: dist/
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: [build, package]
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (inputs.sign && github.ref == 'refs/heads/main' && github.event_name == 'push') }}
    environment: pkg-signing
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check the signing secrets
        id: signing
        env:
          MACOS_INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          MACOS_INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
        run: |
          set -euo pipefail
          present=true
          for name in MACOS_INSTALLER_P12 MACOS_INSTALLER_P12_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              present=false
            fi
          done
          if [ "$present" = true ]; then
            echo "state=present" >> "$GITHUB_OUTPUT"
          else
            echo "state=absent" >> "$GITHUB_OUTPUT"
            echo "::notice::signing is skipped: the pkg-signing environment or its secrets are not set up"
          fi
      - name: Check the version
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::the version must be MAJOR.MINOR.PATCH"
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.signing.outputs.state == 'present' }}
        with:
          name: js-agent-macos-pkg-codesigned
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.signing.outputs.state == 'present' }}
        with:
          name: js-agent-macos-checker
          path: tools
      - name: The downloaded package is the one that was summed
        if: ${{ steps.signing.outputs.state == 'present' }}
        run: |
          set -euo pipefail
          cd dist
          /usr/bin/shasum -a 256 --check SHA256SUMS
      - name: Sign the package
        if: ${{ steps.signing.outputs.state == 'present' }}
        env:
          MACOS_INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          MACOS_INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/js-agent-signing.keychain-db"
          password="$(/usr/bin/uuidgen)"
          cleanup() {
            /usr/bin/security delete-keychain "$keychain" || true
            rm -f "$RUNNER_TEMP/installer.p12"
          }
          trap cleanup EXIT
          /usr/bin/security create-keychain -p "$password" "$keychain"
          /usr/bin/security set-keychain-settings -lut 3600 "$keychain"
          /usr/bin/security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_INSTALLER_P12" | /usr/bin/base64 --decode > "$RUNNER_TEMP/installer.p12"
          /usr/bin/security import "$RUNNER_TEMP/installer.p12" -P "$MACOS_INSTALLER_P12_PASSWORD" -T /usr/bin/productsign -t cert -f pkcs12 -k "$keychain"
          /usr/bin/security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          # The identity is the one "Developer ID Installer" certificate of the temporary keychain,
          # found by its SHA-1; no name or team id is written here.
          identity="$(/usr/bin/security find-identity -v -p basic "$keychain" | /usr/bin/awk '/Developer ID Installer/ { print $2 }')"
          if ! [[ "$identity" =~ ^[0-9A-F]{40}$ ]]; then
            echo "::error::the keychain does not hold exactly one Developer ID Installer identity"
            exit 1
          fi
          pkg="dist/js-agent-$VERSION-macos-arm64.pkg"
          /usr/bin/productsign --timestamp --sign "$identity" --keychain "$keychain" "$pkg" "$pkg.signed"
          mv "$pkg.signed" "$pkg"
          /usr/sbin/pkgutil --check-signature "$pkg"
      - name: The signed package is the package
        if: ${{ steps.signing.outputs.state == 'present' }}
        run: |
          set -euo pipefail
          chmod +x tools/xtask
          tools/xtask pkg check-macos --pkg "dist/js-agent-$VERSION-macos-arm64.pkg" --version "$VERSION"
      - name: Sum the signed package
        if: ${{ steps.signing.outputs.state == 'present' }}
        run: |
          set -euo pipefail
          cd dist
          /usr/bin/shasum -a 256 "js-agent-$VERSION-macos-arm64.pkg" > SHA256SUMS
          /usr/bin/shasum -a 256 --check SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.signing.outputs.state == 'present' }}
        with:
          name: js-agent-macos-pkg-signed
          path: dist/
          if-no-files-found: error
          retention-days: 7

  first-install:
    needs: [build, build-update]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    uses: ./.github/workflows/js-agent-macos-first-install.yml
    with:
      version: ${{ inputs.version }}
