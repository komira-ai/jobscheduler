# The js-agent installer package for macOS (packaging/js-agent-macos): built on a hosted
# Apple silicon runner from the release build of js-agent, js-mac-session and js-mac-provision,
# with pkgbuild and productbuild, and read back by the xtask `pkg check-macos` verb, which
# refuses anything but the files, modes and owners the package is meant to have, and any
# script. It is a hostkeeper `macos-pkg` package (docs/design/mac-hostkeeper-package.md): the
# file is `js-agent-<version>-macos-arm64.pkg`, it carries no preinstall or postinstall script,
# and hostkeeper's coordinator orders it onto the Macs of a host group. It publishes nothing
# itself: release.yml's `pkg-upload` job puts the signed package in the package repository.
#
# Two jobs. `build` runs in the beta stage of the release (release.yml's `beta-macos-pkg` calls
# this file on a push to main) and by hand; no pull request runs it. It builds, checks and sums
# the package unsigned, and no secret is named anywhere in it, so no code of a branch (a build
# script, a macro, xtask) can see one. The root helper's plist names the agent by the cdhash of
# the `js-agent` binary of this same package, which `build` reads from the binary on the macOS
# runner (the linker signs an arm64 binary ad hoc), so the helper needs no flags file.
#
# `sign` runs only on main: by hand, or in the release's call (`sign: true`, on a push, with
# `secrets: inherit`, without which a called workflow reads every secret as empty). It runs
# in the environment `pkg-signing`, which a repository administrator creates with its secrets
# and a rule that only main may deploy to it. It does not build: it takes the checked unsigned
# package and the checker from `build`, checks that the package is the one `build` summed,
# signs it with `productsign --timestamp` (no notarization: hostkeeper reads the signature and
# the signer's certificate, which each Mac lists, and does not need Apple's ticket), then checks
# the signed package with the checker and sums it. Nothing built from the repository runs before
# the signing step, and the system tools it calls are called by absolute path. It runs no cargo.
# A secret is named only in the environment of the step that needs it. When the environment or
# the secrets are not set up, `sign` says so in a notice, skips every step after the first and
# the run succeeds.
#
# No command expands an expression: a script reads its environment. The version, which goes
# into file names, is checked as MAJOR.MINOR.PATCH before anything uses it.
#
# The release's call builds the release's version; a manual run builds the version typed.
# crates/xtask/tests/macos_pkg_workflow.rs pins these rules.
name: js-agent-macos-pkg

on:
  workflow_call:
    inputs:
      version:
        description: The package version, MAJOR.MINOR.PATCH
        required: false
        type: string
        default: 0.0.0
      sign:
        description: Sign the package (on main, for a push)
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: The package version, MAJOR.MINOR.PATCH
        required: true
        type: string

permissions: {}

# A manual run of one version on one ref waits for the one before it.
concurrency:
  group: js-agent-macos-pkg-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  VERSION: ${{ inputs.version || '0.0.0' }}
  # The oldest macOS the programs must run on, as in the release build.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    # The check's name (`build` alone is also a job of js-agent-deb.yml).
    name: js-agent-macos-pkg
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check the version
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::the version must be MAJOR.MINOR.PATCH"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Stamp the version
        run: cargo xtask release stamp --to "$VERSION"
      - name: Build the programs
        run: |
          set -euo pipefail
          cargo build --locked --release -p js-agent --bin js-agent
          cargo build --locked --release -p js-mac-session --bin js-mac-session
          cargo build --locked --release -p js-mac-provision --bin js-mac-provision
      - name: The programs print the version
        run: |
          set -euo pipefail
          for bin in js-agent js-mac-session js-mac-provision; do
            printed="$(target/release/$bin --version | sed -n 1p)"
            echo "$printed"
            case "$printed" in
              *" $VERSION") ;;
              *)
                echo "::error::$bin prints '$printed', not $VERSION"
                exit 1
                ;;
            esac
          done
      - name: Stage the payload
        run: |
          set -euo pipefail
          mkdir inputs
          # The root helper admits the agent of this package alone: the cdhash of its binary, which
          # the linker's ad hoc signature gives and a copy keeps.
          cdhash="$(/usr/bin/codesign --display --verbose=4 target/release/js-agent 2>&1 | /usr/bin/sed -n 's/^CDHash=//p')"
          if ! [[ "$cdhash" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::the cdhash of js-agent is '$cdhash', not 40 hex digits"
            exit 1
          fi
          target/release/js-mac-provision agent-plist > inputs/agent.plist
          target/release/js-mac-provision session-plist --daemon-requirement "cdhash H\"$cdhash\"" > inputs/session.plist
          target/release/js-mac-provision pf-pool-plist > inputs/pf-pool.plist
          plutil -lint inputs/agent.plist inputs/session.plist inputs/pf-pool.plist
          cargo xtask pkg stage-macos --version "$VERSION" --bin-dir target/release --license LICENSE --agent-plist inputs/agent.plist --session-plist inputs/session.plist --pf-pool-plist inputs/pf-pool.plist --out stage
          staged="$(/usr/bin/codesign --display --verbose=4 "stage/root/Library/Application Support/js-agent/bin/js-agent" 2>&1 | /usr/bin/sed -n 's/^CDHash=//p')"
          if [ "$staged" != "$cdhash" ]; then
            echo "::error::the staged js-agent has the cdhash '$staged', not '$cdhash'"
            exit 1
          fi
      - name: Build the package
        run: |
          set -euo pipefail
          mkdir dist
          pkgbuild --root stage/root --identifier com.komira.js-agent --version "$VERSION" --install-location / --ownership recommended stage/component.pkg
          productbuild --package stage/component.pkg --version "$VERSION" "dist/js-agent-$VERSION-macos-arm64.pkg"
      - name: The unsigned package is the package
        run: cargo xtask pkg check-macos --pkg "dist/js-agent-$VERSION-macos-arm64.pkg" --version "$VERSION"
      - name: Sum the unsigned package
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 "js-agent-$VERSION-macos-arm64.pkg" > SHA256SUMS
          shasum -a 256 --check SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-agent-macos-pkg-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-agent-macos-checker
          path: target/debug/xtask
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: [build]
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (inputs.sign && github.ref == 'refs/heads/main' && github.event_name == 'push') }}
    environment: pkg-signing
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check the signing secrets
        id: signing
        env:
          MACOS_INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          MACOS_INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
        run: |
          set -euo pipefail
          present=true
          for name in MACOS_INSTALLER_P12 MACOS_INSTALLER_P12_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              present=false
            fi
          done
          if [ "$present" = true ]; then
            echo "state=present" >> "$GITHUB_OUTPUT"
          else
            echo "state=absent" >> "$GITHUB_OUTPUT"
            echo "::notice::signing is skipped: the pkg-signing environment or its secrets are not set up"
          fi
      - name: Check the version
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::the version must be MAJOR.MINOR.PATCH"
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.signing.outputs.state == 'present' }}
        with:
          name: js-agent-macos-pkg-unsigned
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.signing.outputs.state == 'present' }}
        with:
          name: js-agent-macos-checker
          path: tools
      - name: The downloaded package is the one that was summed
        if: ${{ steps.signing.outputs.state == 'present' }}
        run: |
          set -euo pipefail
          cd dist
          /usr/bin/shasum -a 256 --check SHA256SUMS
      - name: Sign the package
        if: ${{ steps.signing.outputs.state == 'present' }}
        env:
          MACOS_INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12 }}
          MACOS_INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_INSTALLER_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/js-agent-signing.keychain-db"
          password="$(/usr/bin/uuidgen)"
          cleanup() {
            /usr/bin/security delete-keychain "$keychain" || true
            rm -f "$RUNNER_TEMP/installer.p12"
          }
          trap cleanup EXIT
          /usr/bin/security create-keychain -p "$password" "$keychain"
          /usr/bin/security set-keychain-settings -lut 3600 "$keychain"
          /usr/bin/security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_INSTALLER_P12" | /usr/bin/base64 --decode > "$RUNNER_TEMP/installer.p12"
          /usr/bin/security import "$RUNNER_TEMP/installer.p12" -P "$MACOS_INSTALLER_P12_PASSWORD" -T /usr/bin/productsign -t cert -f pkcs12 -k "$keychain"
          /usr/bin/security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          # The identity is the one "Developer ID Installer" certificate of the temporary keychain,
          # found by its SHA-1; no name or team id is written here.
          identity="$(/usr/bin/security find-identity -v -p basic "$keychain" | /usr/bin/awk '/Developer ID Installer/ { print $2 }')"
          if ! [[ "$identity" =~ ^[0-9A-F]{40}$ ]]; then
            echo "::error::the keychain does not hold exactly one Developer ID Installer identity"
            exit 1
          fi
          pkg="dist/js-agent-$VERSION-macos-arm64.pkg"
          /usr/bin/productsign --timestamp --sign "$identity" --keychain "$keychain" "$pkg" "$pkg.signed"
          mv "$pkg.signed" "$pkg"
          /usr/sbin/pkgutil --check-signature "$pkg"
      - name: The signed package is the package
        if: ${{ steps.signing.outputs.state == 'present' }}
        run: |
          set -euo pipefail
          chmod +x tools/xtask
          tools/xtask pkg check-macos --pkg "dist/js-agent-$VERSION-macos-arm64.pkg" --version "$VERSION"
      - name: Sum the signed package
        if: ${{ steps.signing.outputs.state == 'present' }}
        run: |
          set -euo pipefail
          cd dist
          /usr/bin/shasum -a 256 "js-agent-$VERSION-macos-arm64.pkg" > SHA256SUMS
          /usr/bin/shasum -a 256 --check SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.signing.outputs.state == 'present' }}
        with:
          name: js-agent-macos-pkg-signed
          path: dist/
          if-no-files-found: error
          retention-days: 7
