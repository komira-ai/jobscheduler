# The js-agent installer package for macOS (packaging/js-agent-macos): built on a hosted
# Apple silicon runner from the release build of js-agent, js-mac-session and js-mac-provision,
# with pkgbuild and productbuild, and read back by the xtask `pkg check-macos` verb, which
# refuses anything but the files, modes, owners and script the package is meant to have. It
# publishes nothing: the packages and their SHA256SUMS are workflow artifacts for seven days.
#
# Two jobs. `build` runs on pull requests and by hand: it builds, checks and sums the package
# unsigned, and no secret is named anywhere in it, so no code of a branch (a build script, a
# macro, xtask) can see one. `sign` runs only by hand from main, in the environment
# `macos-signing`, which a repository administrator creates with its secrets and a rule that
# only main may deploy to it. It does not build: it takes the checked unsigned package and the
# checker from `build`, checks the package again, signs and notarizes it, checks it again and
# sums it. It runs no cargo. A secret is named only in the environment of the step that needs
# it. When the environment or the secrets are not set up, `sign` says so in a notice, skips
# every step after the first and the run succeeds.
#
# No command expands an expression: a script reads its environment. The version, which goes
# into file names, is checked as MAJOR.MINOR.PATCH before anything uses it.
#
# A pull request that changes the package, its checker, a crate or the toolchain builds it as
# version 0.0.0. A manual run builds the version typed. crates/xtask/tests/macos_pkg_workflow.rs
# pins these rules.
name: js-agent-macos-pkg

on:
  pull_request:
    paths:
      - '.github/workflows/js-agent-macos-pkg.yml'
      - 'packaging/js-agent-macos/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      version:
        description: The package version, MAJOR.MINOR.PATCH
        required: true
        type: string

permissions: {}

concurrency:
  group: js-agent-macos-pkg-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  VERSION: ${{ inputs.version || '0.0.0' }}
  # The oldest macOS the programs must run on, as in the release build.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check the version
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::the version must be MAJOR.MINOR.PATCH"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Stamp the version
        run: cargo xtask release stamp --to "$VERSION"
      - name: Build the programs
        run: |
          set -euo pipefail
          cargo build --locked --release -p js-agent --bin js-agent
          cargo build --locked --release -p js-mac-session --bin js-mac-session
          cargo build --locked --release -p js-mac-provision --bin js-mac-provision
      - name: The programs print the version
        run: |
          set -euo pipefail
          for bin in js-agent js-mac-session js-mac-provision; do
            printed="$(target/release/$bin --version | sed -n 1p)"
            echo "$printed"
            case "$printed" in
              *" $VERSION") ;;
              *)
                echo "::error::$bin prints '$printed', not $VERSION"
                exit 1
                ;;
            esac
          done
      - name: Stage the payload and the scripts
        run: |
          set -euo pipefail
          mkdir inputs
          target/release/js-mac-provision agent-plist --server SET-THE-SERVER --pool default > inputs/agent.plist
          target/release/js-mac-provision session-plist --daemon-requirement SET-THE-DAEMON-REQUIREMENT --socket-group SET-THE-SOCKET-GROUP > inputs/session.plist
          plutil -lint inputs/agent.plist inputs/session.plist
          cargo xtask pkg stage-macos --version "$VERSION" --bin-dir target/release --license LICENSE --agent-plist inputs/agent.plist --session-plist inputs/session.plist --declaration packaging/js-agent-macos/updater.toml --out stage
      - name: Build the package
        run: |
          set -euo pipefail
          mkdir dist
          pkgbuild --root stage/root --scripts stage/scripts --identifier com.komira.js-agent --version "$VERSION" --install-location / --ownership recommended stage/component.pkg
          productbuild --package stage/component.pkg --version "$VERSION" "dist/js-agent-$VERSION-aarch64-apple-darwin.pkg"
      - name: The unsigned package is the package
        run: cargo xtask pkg check-macos --pkg "dist/js-agent-$VERSION-aarch64-apple-darwin.pkg" --version "$VERSION"
      - name: Sum the unsigned package
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 "js-agent-$VERSION-aarch64-apple-darwin.pkg" > SHA256SUMS
          shasum -a 256 --check SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-agent-macos-pkg-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-agent-macos-checker
          path: target/debug/xtask
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: [build]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    environment: macos-signing
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check the signing secrets
        id: signing
        env:
          MACOS_INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          present=true
          for name in MACOS_INSTALLER_CERT_P12 MACOS_INSTALLER_CERT_PASSWORD MACOS_INSTALLER_IDENTITY MACOS_NOTARY_KEY_P8 MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID; do
            if [ -z "${!name:-}" ]; then
              present=false
            fi
          done
          if [ "$present" = true ]; then
            echo "state=present" >> "$GITHUB_OUTPUT"
          else
            echo "state=absent" >> "$GITHUB_OUTPUT"
            echo "::notice::signing is skipped: the macos-signing environment or its secrets are not set up"
          fi
      - name: Check the version
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::the version must be MAJOR.MINOR.PATCH"
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.signing.outputs.state == 'present' }}
        with:
          name: js-agent-macos-pkg-unsigned
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.signing.outputs.state == 'present' }}
        with:
          name: js-agent-macos-checker
          path: tools
      - name: The unsigned package is the one that was checked
        if: ${{ steps.signing.outputs.state == 'present' }}
        run: |
          set -euo pipefail
          chmod +x tools/xtask
          (cd dist && shasum -a 256 --check SHA256SUMS)
          tools/xtask pkg check-macos --pkg "dist/js-agent-$VERSION-aarch64-apple-darwin.pkg" --version "$VERSION"
      - name: Sign the package
        if: ${{ steps.signing.outputs.state == 'present' }}
        env:
          MACOS_INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          MACOS_INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERT_PASSWORD }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/js-agent-signing.keychain-db"
          password="$(uuidgen)"
          cleanup() {
            security delete-keychain "$keychain" || true
            rm -f "$RUNNER_TEMP/installer.p12"
          }
          trap cleanup EXIT
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_INSTALLER_CERT_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/installer.p12" -P "$MACOS_INSTALLER_CERT_PASSWORD" -T /usr/bin/productsign -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          pkg="dist/js-agent-$VERSION-aarch64-apple-darwin.pkg"
          productsign --sign "$MACOS_INSTALLER_IDENTITY" --keychain "$keychain" "$pkg" "$pkg.signed"
          mv "$pkg.signed" "$pkg"
          pkgutil --check-signature "$pkg"
      - name: Notarize the package
        if: ${{ steps.signing.outputs.state == 'present' }}
        env:
          MACOS_NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$MACOS_NOTARY_KEY_P8" > "$key"
          pkg="dist/js-agent-$VERSION-aarch64-apple-darwin.pkg"
          xcrun notarytool submit "$pkg" --key "$key" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "$pkg"
          xcrun stapler validate "$pkg"
      - name: The final package is the package
        if: ${{ steps.signing.outputs.state == 'present' }}
        run: tools/xtask pkg check-macos --pkg "dist/js-agent-$VERSION-aarch64-apple-darwin.pkg" --version "$VERSION"
      - name: Sum the final package
        if: ${{ steps.signing.outputs.state == 'present' }}
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 "js-agent-$VERSION-aarch64-apple-darwin.pkg" > SHA256SUMS
          shasum -a 256 --check SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.signing.outputs.state == 'present' }}
        with:
          name: js-agent-macos-pkg
          path: dist/
          if-no-files-found: error
          retention-days: 7
