# The black-box tests of the released js-agent and js-server (J1 and J6: the agent's session and
# the server's readiness, each with a job), on a GitHub-hosted Linux x86_64 runner, a whole
# machine with root. The program `released` of crates/js-blackbox (no libtest harness) runs its
# wrapper, `released rig`, as root: it installs the js-agent .deb of the release from the apt
# suite `testing`, loads the js-server image of the release (from the GitHub release, checked
# against its SHA256SUMS) into Docker, starts the fakes of their neighbours (a registry on the
# loopback with the job image, and a mount provider on tierstore's socket: the program
# js-fake-mount-provider of this repository, built here; the server's store is its own SQLite
# store), and runs the test itself, `released scenarios`, which starts the server as
# the control host starts it and the agent under systemd with flags of the farm's shape, and runs
# jobs through them: the agent's session and a job (J1), the server's readiness and a job (J6),
# the server's name not found for 60 s, the server unreachable for 60 s, the server restarted and
# the agent updated from the previous release while a job runs; and J5, the agent beside a mount
# provider at a placement limit of 2 that stalls, restarts and answers unavailable, with 20 starts
# at once (the provider's calls counted, the jobs' ends judged). It takes the published bytes and
# nothing from the project's own hosts, and installs no other service's package.
#
# The release is the one input, given to the wrapper as its --version.
#
# It is called, never started by an event of its own but a manual run: by release.yml's
# `blackbox` on a push to main, after `check-apt` passed (the release is then published and in
# `testing`), and by hand (`workflow_dispatch`, the version of a release in `testing`), so a
# branch's test can be run against a release before it merges. Nothing waits for it: no job of
# the release needs `blackbox`, so a red test holds back no deploy yet.
#
# One job, no secret, no environment, `contents: read` alone. The test is built as the runner's
# user, then run as root through cargo's target runner, so nothing is built as root. Every step
# is one command, and no command expands an expression: a command reads its environment.
# crates/xtask/tests/blackbox_workflow.rs pins these rules.
name: js-blackbox

on:
  workflow_call:
    inputs:
      version:
        description: The release to test, MAJOR.MINOR.PATCH
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: The release to test, MAJOR.MINOR.PATCH (published, and in the apt suite testing)
        required: true
        type: string

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  VERSION: ${{ inputs.version }}

jobs:
  blackbox:
    name: js-blackbox
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Build the test as the runner's user
        run: cargo test --locked -p js-blackbox --test released --no-run
      - name: Build the fake mount provider as the runner's user
        run: cargo build --locked -p js-fake-mount-provider
      - name: Install, start and drive the released agent and server, as root
        # cargo's own runner setting: the built test binary runs under sudo; nothing the program reads.
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo
        run: cargo test --locked -p js-blackbox --test released -- rig --version "$VERSION" --fake-provider "$GITHUB_WORKSPACE/target/debug/js-fake-mount-provider"
