    timeout-minutes: 15
    environment: apt-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
