  # public to the hosts). check-apt: a clean Ubuntu container, pinned by digest, on a hosted
  # runner of each architecture, adds packages.komira.ai with the published keyring (deb822,
  # Signed-By) and the suite `testing`, installs js-agent=<version>, and holds the installed
  # system to what the package promises (tool/xtask channels check-apt). The xtask binary built
  # on the runner is mounted into the container, which has nothing else of this repository. It
  # runs only when a write of testing landed.
  check-apt:
    needs: [plan, testing-apt-write, testing-apt-write-2, testing-apt-write-3]
    if: ${{ !cancelled() && !failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' && (needs.testing-apt-write.outputs.conflict == 'false' || needs.testing-apt-write-2.outputs.conflict == 'false' || needs.testing-apt-write-3.outputs.conflict == 'false') }}
