# Continuous release: every push to main that passed `ci` and changed code that ships is
# released as the next version, with no step by hand (docs/release.md). GitHub-hosted
# runners only, actions pinned to commit SHAs.
#
# What starts it. The completion of a `ci` run (`workflow_run`), and only one that
# succeeded for a push to main of this repository: every job below tests the conclusion,
# the event, the branch and the head repository of the run that started it, and works on
# `workflow_run.head_sha`, the commit that passed `ci`. A pull request that changes this
# file builds the same assets as a dry run (`plan` is told so with --dry-run) and never
# attests, tags or publishes. No tag and no manual run starts a release.
#
# Which commit. A run started by `workflow_run` is at the tip of main (`github.sha`), and
# that is the commit an attestation records. `plan` therefore releases the commit only
# while main is still at it, read from the API when the job runs (a re-run keeps the
# commit and `github.sha` of the run it repeats; a re-run of only the failed jobs keeps
# the `plan` that succeeded and does not read main again, so `publish` and `verify`
# check the tag and the attestations); if main has moved on, the newer push
# releases its change too, since a release covers everything since the latest tag. The
# one gap: a run skipped because main moved is not made up if the newer push then fails
# `ci`; the next push that passes releases it.
#
# The decision and the version are `cargo xtask release plan` (crates/xtask): a release
# only when a file that ships changed since the latest `v*` tag, as the next patch
# version, or the workspace version when that is above the tag. `cargo xtask release
# stamp` puts the version into the build's checkout, so `--version` prints it; nothing is
# committed.
#
# Order: plan, build, sums, attest, verify, publish, then gamma. The tag is made last: `publish` makes
# a draft release, uploads the files built, attested and verified, and publishes it in
# one call, which creates the tag. A failed run leaves no tag. A re-run of a failed run
# continues the same draft and adds what is missing; a published release is never changed,
# a draft that is stale or differs is replaced (see `publish`).
#
# gamma, the last step, sets the release as the desired version of the services js-server
# and then js-agent on the update coordinator and waits for each to converge. It is off
# (a notice, and the job passes) until the repository variable JS_COORDINATOR_URL is set
# (docs/release.md, "The gamma step").
#
# Permissions are per job. Only `attest` and `gamma` hold id-token write, `attest` also
# attestations write, and only `publish` holds contents write; none of the three runs
# repository code: `attest` and `publish` run only pinned actions, `sha256sum`, `cmp` and
# `gh`, and `gamma` runs the `xtask` binary that the permissionless `deploy-tool` job built
# (so no build script ever sees the token service's address and key), after the pinned
# actions. A test (crates/xtask/tests/release_workflow.rs) pins these rules.
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  pull_request:
    paths: ['.github/workflows/release.yml']

permissions: {}

# One release at a time, none cancelled: a second waits for the first (GitHub keeps one
# waiting run per group, and the newer replaces the older; the replaced push is released
# by the newer one). Only a run that will release shares the group (the same test as the
# jobs': a successful `ci` run of a push to main of this repository); any other (a `ci` run
# that failed or was cancelled, a pull request, a fork's branch named `main`) takes a group
# of its own so it cannot replace the waiting one.
concurrency:
  group: release-${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && 'main' || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The commit that passed `ci` (not `github.sha`, which for `workflow_run` is the tip of
  # main); for a pull request, its merge commit.
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # Whether to release, and as which version (crates/xtask, `release plan`).
  plan:
    # The run that started this one succeeded, for a push to main of this repository; or a
    # pull request (a dry run).
    if: ${{ github.event_name == 'pull_request' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      tag_exists: ${{ steps.plan.outputs.tag_exists }}
    steps:
      # The whole history and every tag: the files changed since the latest tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - id: plan
        name: Plan the release
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$EVENT" = pull_request ]; then
            flags+=(--dry-run)
            tip="$COMMIT"
          else
            # Main's tip now, from the API: a re-run keeps the commit and GITHUB_SHA of the
            # run it repeats, which may be long past.
            tip="$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)"
          fi
          cargo xtask release plan --head "$COMMIT" --tip "$tip" --output "$GITHUB_OUTPUT" "${flags[@]}" | tee "$GITHUB_STEP_SUMMARY"

  build:
    needs: [plan]
    if: ${{ needs.plan.outputs.release == 'true' }}
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # js does not build for macOS yet: js-cli draws its run label with rustix getrandom,
        # which exists only on Linux. Add aarch64-apple-darwin here once it does.
        include:
          # Static musl binaries: they run on gcr.io/distroless/cc-debian12 and on any
          # Linux host, whatever its libc. rustls links ring, which compiles C, hence
          # musl-tools.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            builds: js-lease-server:js-lease-server js-cli:js js-agent:js-agent
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - name: Install musl tools
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - run: rustup toolchain install
      - run: rustup target add "$TARGET"
      # The release version goes into this checkout only (Cargo.toml and Cargo.lock), so
      # the binaries print it; the repository keeps its own version.
      - name: Stamp the release version
        run: cargo xtask release stamp --to "$VERSION"
      - name: Build and package
        env:
          BUILDS: ${{ matrix.builds }}
        run: |
          set -euo pipefail
          mkdir dist
          # Archives that depend only on the commit and the binaries: sorted names, the
          # commit's time as the modification time, numeric owner 0/0, no name or time in
          # the gzip header. A full re-run then makes the same files as the first run.
          mtime="$(git log -1 --format=%ct "$COMMIT")"
          for entry in $BUILDS; do
            package="${entry%%:*}"
            bin="${entry##*:}"
            cargo build --locked --release --target "$TARGET" -p "$package" --bin "$bin"
            name="$bin-$VERSION-$TARGET"
            mkdir "stage-$bin"
            mkdir "stage-$bin/$name"
            cp "target/$TARGET/release/$bin" LICENSE "stage-$bin/$name/"
            tar -C "stage-$bin" --sort=name --mtime="@$mtime" --owner=0 --group=0 --numeric-owner -cf - "$name" | gzip -n > "dist/$name.tar.gz"
          done
          ls -l dist
      - name: Check the binaries
        run: |
          set -euo pipefail
          for entry in $BUILDS; do
            bin="${entry##*:}"
            file "target/$TARGET/release/$bin"
          done
          case "$TARGET" in
            *-linux-musl)
              for entry in $BUILDS; do
                bin="${entry##*:}"
                # A static binary has no dynamic loader and no shared libraries.
                if readelf -d "target/$TARGET/release/$bin" | grep -q NEEDED; then
                  echo "::error::$bin links shared libraries"
                  exit 1
                fi
              done
              ;;
          esac
          # Every binary runs on the build host and prints the release version.
          for entry in $BUILDS; do
            bin="${entry##*:}"
            printed="$("target/$TARGET/release/$bin" --version)"
            echo "$printed"
            case "$printed" in
              *" $VERSION") ;;
              *)
                echo "::error::$bin prints '$printed', not the release version $VERSION"
                exit 1
                ;;
            esac
          done
        env:
          BUILDS: ${{ matrix.builds }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # One SHA256SUMS over every asset, checked before anything is attested or published.
  sums:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Write and check SHA256SUMS
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          expected="js-$VERSION-x86_64-unknown-linux-musl.tar.gz js-agent-$VERSION-x86_64-unknown-linux-musl.tar.gz js-lease-server-$VERSION-x86_64-unknown-linux-musl.tar.gz"
          actual="$(ls | LC_ALL=C sort | tr '\n' ' ' | sed 's/ $//')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::unexpected assets: '$actual' (expected '$expected')"
            exit 1
          fi
          sha256sum -- *.tar.gz > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          echo "assets:"
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Build provenance for every asset, from the checksums file. No repository code runs here.
  attest:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && needs.plan.outputs.release == 'true' }}
    needs: [plan, sums]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

  # The attestations as a user checks them (docs/release.md), before anything is tagged:
  # made by this workflow, for the commit being released.
  verify:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && needs.plan.outputs.release == 'true' }}
    needs: [plan, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Verify every archive
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check --strict SHA256SUMS
          for file in ./*.tar.gz; do
            gh attestation verify "$file" --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/release.yml" \
              --source-ref refs/heads/main \
              --source-digest "$COMMIT"
          done

  # Creates the release with the attested files, then publishes it, which creates the tag.
  # Nothing is rebuilt. The release starts as a draft for this version (tag_name and
  # target_commitish the commit), every file is uploaded to it, and one last call
  # publishes it: a failed upload leaves a draft and no tag, and a re-run continues the
  # same draft. A published release is never changed: a file it has that differs from
  # this run's is an error, and a tag that exists and does not name this commit is one
  # too. A draft is unpublished and may be replaced: one that targets another commit, or
  # holds a file that differs from this run's, is deleted and made again (else a failed
  # publish of an older commit would block the version for good), and a file whose upload
  # did not finish is deleted before it is uploaded again. The tag is read again right
  # before the publishing call; one that names another commit stops the run.
  #
  # This shell is not in xtask on purpose: the job holds contents write and runs no
  # repository code (see the top of this file), so its decisions stay in the few lines
  # below. Nothing here is covered by a test; the dry run checks the file parses.
  publish:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && needs.plan.outputs.release == 'true' }}
    needs: [plan, sums, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Draft the release, add the files it lacks, publish it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG_EXISTS: ${{ needs.plan.outputs.tag_exists }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check --strict SHA256SUMS
          api="repos/$REPO"
          # The commit the tag names: nothing when there is no tag, a failure on any
          # other error (a failed read is not "no tag").
          tag_commit() {
            local out
            if out="$(gh api "$api/git/ref/tags/$TAG" --jq .object.sha 2>&1)"; then
              echo "$out"
            elif ! grep -q 'HTTP 404' <<< "$out"; then
              echo "$out" >&2
              return 1
            fi
          }
          # A draft for this version at this commit (tag_name and target_commitish).
          new_draft() {
            gh api "$api/releases" -f tag_name="$TAG" -f target_commitish="$COMMIT" -f name="jobscheduler $VERSION" \
              -f body="js-lease-server, js and js-agent $VERSION. Verify the files with SHA256SUMS and gh attestation verify; see docs/release.md." \
              -F draft=true -F generate_release_notes=true --jq .id
          }
          # `plan` found no tag for this version: one that exists now was made since, and
          # publishing would attach the release to it.
          if [ "$TAG_EXISTS" != true ] && [ -n "$(tag_commit)" ]; then
            echo "::error::the tag $TAG exists now, which the plan did not see"
            exit 1
          fi
          # The release of this version, draft or published (the list shows drafts; a
          # lookup by tag does not).
          ids="$(gh api --paginate "$api/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id")"
          if [ -z "$ids" ]; then
            id="$(new_draft)"
          elif [ "$(wc -l <<< "$ids")" -eq 1 ]; then
            id="$ids"
          else
            echo "::error::more than one release is named $TAG: $ids"
            exit 1
          fi
          draft="$(gh api "$api/releases/$id" --jq .draft)"
          target="$(gh api "$api/releases/$id" --jq .target_commitish)"
          # A file the release has must be this run's, byte for byte, or the files of two
          # builds would be mixed. A file whose upload did not finish is not compared.
          replace=""
          differing=""
          if [ "$draft" = true ] && [ "$target" != "$COMMIT" ]; then
            replace="it targets $target, not $COMMIT"
          fi
          mkdir ../existing
          assets="$(gh api "$api/releases/$id" --jq '.assets[] | "\(.id) \(.state) \(.name)"')"
          while read -r asset_id state name; do
            [ "$state" = uploaded ] || continue
            gh api -H "Accept: application/octet-stream" "$api/releases/assets/$asset_id" > "../existing/$asset_id"
            cmp -s -- "$name" "../existing/$asset_id" || differing="$name"
          done <<< "$assets"
          if [ -n "$differing" ]; then
            if [ "$draft" != true ]; then
              echo "::error::the published release $TAG holds a $differing that differs from this run's; a published release is never changed (docs/release.md)"
              exit 1
            fi
            replace="$differing differs from this run's"
          fi
          if [ -n "$replace" ]; then
            # A draft is unpublished and has no tag: delete it and start again.
            echo "::notice::replacing the draft of $TAG: $replace"
            gh api --method DELETE "$api/releases/$id" --silent
            id="$(new_draft)"
          elif [ "$draft" = true ]; then
            while read -r asset_id state name; do
              if [ -n "$asset_id" ] && [ "$state" != uploaded ]; then
                echo "::notice::deleting $name, an upload that did not finish"
                gh api --method DELETE "$api/releases/assets/$asset_id" --silent
              fi
            done <<< "$assets"
          fi
          # Add the files the release lacks.
          present="$(gh api "$api/releases/$id" --jq '.assets[] | select(.state == "uploaded") | .name')"
          for file in ./*.tar.gz SHA256SUMS; do
            name="${file#./}"
            if grep -Fxq -- "$name" <<< "$present"; then
              echo "$name is on the release already: kept"
            else
              gh api --method POST -H "Content-Type: application/octet-stream" "https://uploads.github.com/$api/releases/$id/assets?name=$name" --input "$file" --silent
            fi
          done
          # Publishing creates the tag, at the commit, when the release is a draft. A tag
          # made since the check above would be published against; read it once more.
          if [ "$(gh api "$api/releases/$id" --jq .draft)" = true ]; then
            now="$(tag_commit)"
            if [ -n "$now" ] && [ "$now" != "$COMMIT" ]; then
              echo "::error::the tag $TAG appeared and names $now, not $COMMIT; nothing was published (docs/release.md)"
              exit 1
            fi
            gh api --method PATCH "$api/releases/$id" -f tag_name="$TAG" -f target_commitish="$COMMIT" -F draft=false --silent
          fi
          at="$(gh api "$api/commits/$TAG" --jq .sha)"
          if [ "$at" != "$COMMIT" ]; then
            echo "::error::$TAG names $at, not $COMMIT"
            exit 1
          fi

  # Builds the gamma step's client. A job of its own so that the build, whose scripts run
  # code from the locked dependency set, is not in the job that holds id-token write.
  deploy-tool:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && needs.plan.outputs.release == 'true' }}
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo build -p xtask --locked --release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-tool
          path: target/release/xtask
          if-no-files-found: error
          retention-days: 1

  # The gamma step, the last of a release: tell the update coordinator "desired = this
  # release" for the service js-server (the lease server), wait until its hosts run it, and
  # only then do the same for js-agent: servers upgrade before agents. Off (a notice, and the
  # job passes) while the repository variable JS_COORDINATOR_URL is empty: a fork, or a
  # repository whose operator has not turned the step on. Each call carries a fresh OIDC token
  # of this job whose audience is the coordinator; the coordinator's allow-list names this
  # repository, this workflow on main and the two services, and refuses anything else.
  #
  # The version is the release's `X.Y.Z` (plan's `version`, not the tag): the text the
  # services report in their heartbeats, because `--version` of each binary prints it
  # (docs/release.md, "The gamma step").
  gamma:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && needs.plan.outputs.release == 'true' }}
    needs: [plan, publish, deploy-tool]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-tool
          path: tool
      # When the coordinator is reachable only on a Tailscale network: join it as an ephemeral
      # node, using this run's OIDC token (workload identity federation), so the job holds no
      # secret. The client id and the audience are the variables TS_CLIENT_ID and TS_AUDIENCE.
      # With either that or JS_COORDINATOR_URL unset the step is skipped.
      - name: Join the coordinator's Tailscale network
        if: ${{ vars.TS_CLIENT_ID != '' && vars.JS_COORDINATOR_URL != '' }}
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
      - name: Set this release as the desired version of js-server, then js-agent, and wait for each
        env:
          COORDINATOR_URL: ${{ vars.JS_COORDINATOR_URL }}
          # The CA certificate (public) the coordinator's certificate chains to.
          COORDINATOR_CA: ${{ vars.JS_COORDINATOR_CA }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x tool/xtask
          tool/xtask deploy --url "$COORDINATOR_URL" --ca-pem "$COORDINATOR_CA" --version "$VERSION" --service js-server --service js-agent
