# Continuous release: every push to main that passed `ci` and changed code that ships is
# released as the next version, with no step by hand (docs/release.md). GitHub-hosted
# runners only, actions pinned to commit SHAs.
#
# What starts it. A push to main (`on: push`), and nothing else releases: the wait and
# every job that attests, publishes or deploys test that the event is a push and the ref is
# main, and no tag and no manual run starts a release. A pull request that changes this file
# builds the same assets as a dry run (`plan` is told so with --dry-run, and artifacts.yml
# builds and sums) and never waits for `ci`, attests, tags or publishes. A pull request that
# changes only artifacts.yml starts no dry run.
#
# Which commit. The one pushed: `github.sha` of a push run is the pushed commit, and an
# attestation records `github.sha` and `github.ref` (the certificate's source digest and
# ref), so the run has to be at the commit it releases; that is why the release is not
# started by the completion of `ci` (`workflow_run`), whose runs are at main's tip, not at
# the commit that passed. The first job, `ci-passed`, waits for the jobs of the `ci` run of
# that commit (a push run; it polls every 120 s, up to four hours) except the `macos` job,
# which queues for hours on the hosted runners (main's macOS run is the backstop; the
# release's own macOS build still runs below), and fails the release, with the run's URL
# and the jobs that did not succeed, if any other job failed, was cancelled or timed out.
# Every other job needs it. It holds `actions: read` only and checks out nothing; ten reads of the runs in a row that fail
# (about twenty minutes) fail it too. A re-run keeps the commit and `github.sha`
# of the run it repeats; a re-run of only the failed jobs keeps the `plan` that succeeded,
# so `publish` and artifacts.yml's `verify` check the tag and the attestations.
#
# Two tag views differ on purpose. `plan` counts only the `v*` tags merged into the commit;
# `publish` compares against the highest `vX.Y.Z` tag of the whole repository and refuses
# unless it is a proper ancestor of the commit, so it fails closed: a `v` tag that is not on
# main blocks releases until it is removed (docs/release.md, Recovery).
#
# Main may move on while a run waits or builds. The run still releases its own commit,
# since the commit passed `ci`; `plan` refuses it only when a `v*` tag is at a descendant
# (a later release covers it, which keeps the version monotonic), and `publish` checks
# again right before the publishing call that the latest `v*` tag is a proper ancestor of
# the commit, so two runs that finish out of order never put a tag on an older commit. The
# one gap: a run replaced while it waits for the group (below) is made up by the newer
# push's release, and if that push then fails `ci` the next push that passes releases it.
#
# The decision and the version are `cargo xtask release plan` (crates/xtask): a release
# only when a file that ships changed since the latest `v*` tag, as the next patch
# version, or the workspace version when that is above the tag. `cargo xtask release
# stamp` puts the version into the build's checkout, so `--version` prints it; nothing is
# committed.
#
# The assets, built and signed by artifacts.yml, which the `artifacts` job calls: the archives of
# the binaries (`*.tar.gz`); the Debian package of js-agent for amd64 and arm64
# (`js-agent_<version>_<arch>.deb`); and the container image of js-lease-server for each of the
# two Linux targets (`js-lease-server-<version>-<target>.oci.tar`), each package and image with
# the bundle of its own provenance beside it (`<file>.sigstore.json`). SHA256SUMS lists all of them
# but the bundles. This file attests nothing: every attestation is signed by artifacts.yml, the
# one signer farm hosts trust (see the top of that file).
#
# Order: ci-passed, plan, artifacts (build, sums, attest, verify), publish, then the apt
# repository, gamma and the control-plane deploy. The tag is made first of those: `publish`
# makes a draft release, uploads the files built, attested and verified, and publishes it in one
# call, which creates the tag. A failed run leaves no tag. A re-run of a failed run continues the
# same draft and adds what is missing; a published release is never changed, a draft that is
# stale or differs is replaced (see `publish`).
#
# The apt repository, https://packages.komira.ai/apt (docs/release.md), after `publish`: the two
# .debs go into the suite `testing` (the jobs `testing-apt-*`: read, index and write, in up to
# three attempts when another product's release wins the race for the shared index), then
# `check-apt` installs the release from `testing` in a clean Ubuntu container on amd64 and on
# arm64, and only when it succeeded the same bytes are promoted into the suite `stable` (the jobs
# `stable-apt-*`, which write the index alone, `--no-pool`). Hosts install from `stable`:
# hostkeeper's apt installer is told to by hostkeeper-desired.yml, which runs after this
# workflow. No job holds both the signing key and the cloud role: the `*-apt-read` and
# `*-apt-write` jobs (environment `apt-publish`) assume the publish role through OIDC and hold no
# key; the `*-apt-index` jobs (environment `apt-signing`) hold the key and `contents: read`
# alone. None of them checks out the repository or compiles anything: each downloads the `xtask`
# binary that `deploy-tool` built (a job with neither token nor secret) and runs its verbs.
# The index and write jobs check the files they take from `dist` against SHA256SUMS and each
# .deb against its bundle (one step per architecture) before using them. Every apt job starts
# with `channels gate`, so without the settings of the two environments it ends green and writes
# nothing; and each runs only for a push to main, so a pull request's dry run never publishes.
#
# gamma sets the release as the desired version of the service js-server (the lease server, which
# the kbf host updater runs; js-agent is a hostkeeper service whose desired version
# hostkeeper-desired.yml sets) on the update coordinator and waits for it to converge. It is off
# (a notice, and the job passes) until the repository variable JS_COORDINATOR_URL is set
# (docs/release.md, "The gamma step").
#
# The control-plane deploy (`cp-deploy-digest`, then `cp-deploy`) deploys the release's
# linux-x86_64 image of js-lease-server to the Docker Swarm service js-server by calling
# docker-swarm-updater's reusable deploy workflow. It is off (both jobs skipped) until the
# repository variable CP_DEPLOY_ENDPOINT is set (docs/release.md, "The control-plane deploy").
#
# Permissions are per job. Only `artifacts`, `gamma`, `cp-deploy` and the apt read and write jobs
# hold id-token write here, and `artifacts` also attestations write, only because a called workflow
# can hold no more than its calling job grants: in artifacts.yml only `attest` holds them. Only
# `publish` holds contents write. No job that holds a token or the signing key checks out or
# compiles this repository's code (the one job that compiles any is docker-swarm-updater's deploy
# job, which `cp-deploy` calls: it builds the updater's own client from the commit it is pinned
# at): `attest` and `publish` run only pinned actions, `sha256sum`, `cmp`, `cp` and
# `gh`; `gamma`, `cp-deploy-digest` and the apt read, index and write jobs run the `xtask` binary
# that the permissionless `deploy-tool` job built (so no build script ever sees a token, the token
# service's address or the key), after the pinned actions. The apt read and write jobs hold no
# key, and the index jobs no token. A test
# (crates/xtask/tests/release_workflow) pins these rules for both files, and another
# (crates/xtask/tests/apt_workflow) the apt jobs and hostkeeper-desired.yml.
name: release

on:
  push:
    branches: [main]
  pull_request:
    paths: ['.github/workflows/release.yml']

permissions: {}

# One release at a time, none cancelled: a second waits for the first (GitHub keeps one
# waiting run per group, and the newer replaces the older; the replaced push is released
# by the newer one). Only a run that will release shares the group (the same test as the
# jobs': a push to main); a pull request takes a group of its own so it cannot replace the
# waiting one. The wait for `ci` is inside the group, so the run that is releasing is never
# replaced.
concurrency:
  group: release-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The commit the run is at: the pushed commit; for a pull request, its merge commit.
  COMMIT: ${{ github.sha }}

jobs:
  # Waits for the jobs of the `ci` run of this commit other than `macos`, and passes only
  # when they all succeeded or were skipped. It holds `actions: read` and nothing else,
  # checks out nothing and runs no repository code. On a pull request it is skipped.
  ci-passed:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      actions: read
    steps:
      - name: Wait for ci on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          failed=0
          while true; do
            # The newest run of `ci` for this commit's push (a re-run of it is the same run),
            # and the jobs of its latest attempt other than `macos`, as three fields: how many,
            # how many have not finished, and the finished ones that did not succeed or skip
            # (name=conclusion, comma-separated). Both reads count towards the failed reads.
            run=""
            if run="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$COMMIT&event=push&per_page=100" \
              --jq '.workflow_runs | sort_by(.created_at) | last // empty | "\(.id) \(.status) \(.conclusion // "none") \(.html_url)"')" &&
              { [ -z "$run" ] || { read -r id _ <<< "$run" &&
                ci_jobs="$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100&filter=latest" \
                  --jq '[.jobs[] | select(.name != "macos")] | "\(length) \([.[] | select(.status != "completed")] | length) \([.[] | select(.status == "completed" and .conclusion != "success" and .conclusion != "skipped") | "\(.name)=\(.conclusion)"] | join(","))"')"; }; }; then
              failed=0
            else
              failed=$((failed + 1))
              if [ "$failed" -ge 10 ]; then
                echo "::error::reading the ci runs of $COMMIT failed $failed times in a row; nothing is released"
                exit 1
              fi
              echo "::warning::reading the ci runs failed ($failed in a row); trying again"
              run=""
            fi
            if [ -z "$run" ]; then
              echo "no ci run for $COMMIT yet"
            else
              read -r id status conclusion url <<< "$run"
              read -r total pending bad <<< "$ci_jobs"
              # The macOS job is not waited for: it queues for hours on the hosted runners, and
              # main's own macOS run is the backstop. Any other job that failed, was cancelled
              # or timed out fails the release at once, even while the others still run.
              if [ -n "$bad" ]; then
                echo "::error::ci did not pass for $COMMIT: $bad, $url; nothing is released"
                exit 1
              fi
              if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
                echo "ci passed (all jobs but macos): $url"
                exit 0
              fi
              if [ "$status" = completed ]; then
                echo "::error::ci did not pass for $COMMIT: no job besides macos in the run, $url; nothing is released"
                exit 1
              fi
              echo "ci is $status: $url ($pending of $total jobs but macos still to finish)"
            fi
            sleep 120
          done

  # Whether to release, and as which version (crates/xtask, `release plan`).
  plan:
    # The wait passed, for a push to main; or a pull request (a dry run, which skips the
    # wait).
    needs: [ci-passed]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || (needs.ci-passed.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      tag_exists: ${{ steps.plan.outputs.tag_exists }}
    steps:
      # The whole history and every tag: the files changed since the latest tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - id: plan
        name: Plan the release
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$EVENT" = pull_request ]; then
            flags+=(--dry-run)
          fi
          cargo xtask release plan --head "$COMMIT" --output "$GITHUB_OUTPUT" "${flags[@]}" | tee "$GITHUB_STEP_SUMMARY"

  # The files of the release, built and signed by artifacts.yml (see the top of that file): the
  # signer of every attestation is that file, the one farm hosts trust, not this one. Its jobs run
  # in this run, at this commit, under this event: `build` and `sums` on a pull request too (the
  # dry run), `attest` and `verify` only for a push to main. A called workflow gets no more
  # permission than its calling job grants, so this job grants what `attest` needs; each job of
  # artifacts.yml then holds only its own (only `attest` holds the two writes).
  artifacts:
    needs: [plan]
    # `!cancelled()`: on a pull request the wait before `plan` is skipped, and a skipped job
    # upstream would otherwise skip this one.
    if: ${{ !cancelled() && needs.plan.outputs.release == 'true' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/artifacts.yml
    with:
      version: ${{ needs.plan.outputs.version }}

  # Creates the release with the files artifacts.yml built, attested and verified, then
  # publishes it, which creates the tag.
  # Nothing is rebuilt. The release starts as a draft for this version (tag_name and
  # target_commitish the commit), every file is uploaded to it, and one last call
  # publishes it: a failed upload leaves a draft and no tag, and a re-run continues the
  # same draft. A published release is never changed: a file it has that differs from
  # this run's is an error, and a tag that exists and does not name this commit is one
  # too. A draft is unpublished and may be replaced: one that targets another commit, or
  # holds a file that differs from this run's, is deleted and made again (else a failed
  # publish of an older commit would block the version for good), and a file whose upload
  # did not finish is deleted before it is uploaded again. The tag is read again right
  # before the publishing call; one that names another commit stops the run, and so does a
# latest `v*` tag that is not a proper ancestor of this commit (a newer release finished first).
  #
  # This shell is not in xtask on purpose: the job holds contents write and runs no
  # repository code (see the top of this file), so its decisions stay in the few lines
  # below. Nothing here is covered by a test; the dry run checks the file parses.
  publish:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' }}
    needs: [plan, artifacts]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      # The bundle of each .deb's and each image's provenance, `<file>.sigstore.json`, made by
      # artifacts.yml's `attest` and checked by its `verify`. SHA256SUMS does not list them.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles
          path: dist
      - name: Draft the release, add the files it lacks, publish it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG_EXISTS: ${{ needs.plan.outputs.tag_exists }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check --strict SHA256SUMS
          # Every .deb and every image has its bundle beside it: the apt jobs verify each package
          # from it, and a deployer verifies an image from it.
          for package in ./*.deb ./*.oci.tar; do
            if [ ! -f "$package.sigstore.json" ]; then
              echo "::error::$package has no bundle ($package.sigstore.json); nothing is released"
              exit 1
            fi
          done
          api="repos/$REPO"
          # The commit the tag names: nothing when there is no tag, a failure on any
          # other error (a failed read is not "no tag").
          tag_commit() {
            local out
            if out="$(gh api "$api/git/ref/tags/$TAG" --jq .object.sha 2>&1)"; then
              echo "$out"
            elif ! grep -q 'HTTP 404' <<< "$out"; then
              echo "$out" >&2
              return 1
            fi
          }
          # A draft for this version at this commit (tag_name and target_commitish).
          new_draft() {
            gh api "$api/releases" -f tag_name="$TAG" -f target_commitish="$COMMIT" -f name="jobscheduler $VERSION" \
              -f body="js-lease-server, js, js-agent, js-bundle, js-mdm and the Mac host tools $VERSION, the js-agent .deb packages for amd64 and arm64, and the js-lease-server container images (.oci.tar) for amd64 and arm64, with the bundle of each one's provenance. Verify the files with SHA256SUMS and gh attestation verify; see docs/release.md." \
              -F draft=true -F generate_release_notes=true --jq .id
          }
          # `plan` found no tag for this version: one that exists now was made since, and
          # publishing would attach the release to it.
          if [ "$TAG_EXISTS" != true ] && [ -n "$(tag_commit)" ]; then
            echo "::error::the tag $TAG exists now, which the plan did not see"
            exit 1
          fi
          # The release of this version, draft or published (the list shows drafts; a
          # lookup by tag does not).
          ids="$(gh api --paginate "$api/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id")"
          if [ -z "$ids" ]; then
            id="$(new_draft)"
          elif [ "$(wc -l <<< "$ids")" -eq 1 ]; then
            id="$ids"
          else
            echo "::error::more than one release is named $TAG: $ids"
            exit 1
          fi
          draft="$(gh api "$api/releases/$id" --jq .draft)"
          target="$(gh api "$api/releases/$id" --jq .target_commitish)"
          # A file the release has must be this run's, byte for byte, or the files of two
          # builds would be mixed. A file whose upload did not finish is not compared, and
          # neither is a bundle: each signing makes new bytes for the same file, which is
          # compared itself, so an earlier run's bundle of an equal file is kept.
          replace=""
          differing=""
          if [ "$draft" = true ] && [ "$target" != "$COMMIT" ]; then
            replace="it targets $target, not $COMMIT"
          fi
          mkdir ../existing
          assets="$(gh api "$api/releases/$id" --jq '.assets[] | "\(.id) \(.state) \(.name)"')"
          while read -r asset_id state name; do
            [ "$state" = uploaded ] || continue
            case "$name" in
              *.sigstore.json) continue ;;
            esac
            gh api -H "Accept: application/octet-stream" "$api/releases/assets/$asset_id" > "../existing/$asset_id"
            cmp -s -- "$name" "../existing/$asset_id" || differing="$name"
          done <<< "$assets"
          if [ -n "$differing" ]; then
            if [ "$draft" != true ]; then
              echo "::error::the published release $TAG holds a $differing that differs from this run's; a published release is never changed (docs/release.md)"
              exit 1
            fi
            replace="$differing differs from this run's"
          fi
          if [ -n "$replace" ]; then
            # A draft is unpublished and has no tag: delete it and start again.
            echo "::notice::replacing the draft of $TAG: $replace"
            gh api --method DELETE "$api/releases/$id" --silent
            id="$(new_draft)"
          elif [ "$draft" = true ]; then
            while read -r asset_id state name; do
              if [ -n "$asset_id" ] && [ "$state" != uploaded ]; then
                echo "::notice::deleting $name, an upload that did not finish"
                gh api --method DELETE "$api/releases/assets/$asset_id" --silent
              fi
            done <<< "$assets"
          fi
          # Add the files the release lacks.
          present="$(gh api "$api/releases/$id" --jq '.assets[] | select(.state == "uploaded") | .name')"
          for file in ./*.tar.gz ./*.deb ./*.deb.sigstore.json ./*.oci.tar ./*.oci.tar.sigstore.json SHA256SUMS; do
            name="${file#./}"
            if grep -Fxq -- "$name" <<< "$present"; then
              echo "$name is on the release already: kept"
            else
              gh api --method POST -H "Content-Type: application/octet-stream" "https://uploads.github.com/$api/releases/$id/assets?name=$name" --input "$file" --silent
            fi
          done
          # Publishing creates the tag, at the commit, when the release is a draft. A tag
          # made since the check above would be published against; read it once more.
          if [ "$(gh api "$api/releases/$id" --jq .draft)" = true ]; then
            now="$(tag_commit)"
            if [ -n "$now" ] && [ "$now" != "$COMMIT" ]; then
              echo "::error::the tag $TAG appeared and names $now, not $COMMIT; nothing was published (docs/release.md)"
              exit 1
            fi
            # The latest release tag, by version, must be a proper ancestor of this commit
            # (GitHub says "ahead"): a run for an older commit that finished after a newer
            # release would otherwise tag the older commit. No tag yet is the first release.
            latest="$(gh api --paginate "$api/tags" --jq '.[] | select(.name | test("^v[0-9]+[.][0-9]+[.][0-9]+$")) | "\(.name) \(.commit.sha)"' | sort -V | tail -n 1)"
            if [ -n "$latest" ]; then
              read -r latest_tag latest_sha <<< "$latest"
              relation="$(gh api "$api/compare/$latest_sha...$COMMIT" --jq .status)"
              if [ "$relation" != ahead ]; then
                echo "::error::the latest release tag $latest_tag ($latest_sha) is not a proper ancestor of $COMMIT (compare says $relation); nothing was published (docs/release.md)"
                exit 1
              fi
            fi
            gh api --method PATCH "$api/releases/$id" -f tag_name="$TAG" -f target_commitish="$COMMIT" -F draft=false --silent
          fi
          at="$(gh api "$api/commits/$TAG" --jq .sha)"
          if [ "$at" != "$COMMIT" ]; then
            echo "::error::$TAG names $at, not $COMMIT"
            exit 1
          fi

  # Builds the `xtask` binary that gamma, cp-deploy-digest and every apt read, index and write job
  # run. A job of its own so that the build, whose scripts run code from the locked dependency
  # set, is in no job that holds id-token write or the signing key.
  deploy-tool:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' }}
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo build -p xtask --locked --release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-tool
          path: target/release/xtask
          if-no-files-found: error
          retention-days: 1

  # The gamma step: tell the update coordinator "desired = this release" for the service
  # js-server (the lease server) and wait until its hosts run it. js-agent is not set here: it is
  # a hostkeeper service, whose desired version hostkeeper-desired.yml sets after this
  # workflow. Off (a notice, and the job passes) while the repository variable
  # JS_COORDINATOR_URL is empty: a fork, or a repository whose operator has not turned the step
  # on. The call carries a fresh OIDC token of this job whose audience is the coordinator; the
  # coordinator's allow-list names this repository, this workflow on main and the service, and
  # refuses anything else.
  #
  # The version is the release's `X.Y.Z` (plan's `version`, not the tag): the text the
  # service reports in its heartbeats, because `--version` of the binary prints it
  # (docs/release.md, "The gamma step").
  gamma:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' }}
    needs: [plan, publish, deploy-tool]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-tool
          path: tool
      # When the coordinator is reachable only on a Tailscale network: join it as an ephemeral
      # node, using this run's OIDC token (workload identity federation), so the job holds no
      # secret. The client id and the audience are the variables TS_CLIENT_ID and TS_AUDIENCE.
      # With either that or JS_COORDINATOR_URL unset the step is skipped.
      - name: Join the coordinator's Tailscale network
        if: ${{ vars.TS_CLIENT_ID != '' && vars.JS_COORDINATOR_URL != '' }}
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
      - name: Set this release as the desired version of js-server and wait for it
        env:
          COORDINATOR_URL: ${{ vars.JS_COORDINATOR_URL }}
          # The CA certificate (public) the coordinator's certificate chains to.
          COORDINATOR_CA: ${{ vars.JS_COORDINATOR_CA }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x tool/xtask
          tool/xtask deploy --url "$COORDINATOR_URL" --ca-pem "$COORDINATOR_CA" --version "$VERSION" --service js-server

  # The control-plane deploy: the release's linux-x86_64 image of js-lease-server to the Docker
  # Swarm service js-server (docs/release.md, "The control-plane deploy"). Both jobs run only while
  # the repository variable CP_DEPLOY_ENDPOINT is not empty: with it unset or empty both are
  # skipped and the release ends as it did without them. The lint
  # (crates/xtask/tests/apt_workflow, `cp_deploy.rs`) holds the two jobs to this shape.
  #
  # cp-deploy-digest  holds no permission. It downloads the files `publish` uploaded (the same
  #          artifacts, so the same bytes) and the `xtask` that `deploy-tool` built, and runs
  #          `release image-digest`: the image held to SHA256SUMS, its bundle present, and the
  #          manifest digest its index.json names, with the release's download addresses of the
  #          image and the bundle.
  # cp-deploy  calls the reusable workflow deploy.yml of komira-ai/docker-swarm-updater, pinned by
  #          the full commit the updater's allow-list names, with `id-token: write` alone: the
  #          called workflow asks GitHub for an OIDC token for every request and runs in this
  #          repository's environment `controlplane` (docs/release.md says how the project owner
  #          sets it up). It sends
  #          the service `js-server`, the release version, that digest and those addresses, and
  #          joins the updater's Tailscale network with the CP_DEPLOY_TAILSCALE_* variables; the
  #          signer is the default, this repository's artifacts.yml on refs/heads/main, which
  #          the updater holds the image's bundle to before it updates the service by digest. The
  #          job ends once the deploy is reported converged and fails
  #          otherwise, after waiting up to 60 minutes. The release stays published whatever it
  #          says, and "Re-run failed jobs" repeats it.
  cp-deploy-digest:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' && vars.CP_DEPLOY_ENDPOINT != '' }}
    needs: [plan, publish, deploy-tool]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      image-url: ${{ steps.image.outputs.image-url }}
      bundle-url: ${{ steps.image.outputs.bundle-url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-tool
          path: tool
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles
          path: dist
      - run: chmod +x tool/xtask
      - name: The image's manifest digest and the release's addresses of it and its bundle
        id: image
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: tool/xtask release image-digest --dist dist --repo "$GITHUB_REPOSITORY" --version "$VERSION" --output "$GITHUB_OUTPUT"

  cp-deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' && vars.CP_DEPLOY_ENDPOINT != '' }}
    needs: [plan, cp-deploy-digest]
    permissions:
      id-token: write
    uses: komira-ai/docker-swarm-updater/.github/workflows/deploy.yml@c1fcc47610e2886d4d9e561be3c0c76f0452d1f6 # v0.1.3
    with:
      service: js-server
      version: ${{ needs.plan.outputs.version }}
      image-digest: ${{ needs.cp-deploy-digest.outputs.digest }}
      image-url: ${{ needs.cp-deploy-digest.outputs.image-url }}
      bundle-url: ${{ needs.cp-deploy-digest.outputs.bundle-url }}
      endpoint: ${{ vars.CP_DEPLOY_ENDPOINT }}
      audience: ${{ vars.CP_DEPLOY_AUDIENCE }}
      environment: controlplane
      wait-minutes: 60
      tailscale-oauth-client-id: ${{ vars.CP_DEPLOY_TAILSCALE_CLIENT_ID }}
      tailscale-audience: ${{ vars.CP_DEPLOY_TAILSCALE_AUDIENCE }}
      tailscale-tags: ${{ vars.CP_DEPLOY_TAILSCALE_TAGS }}

  # PUBLICATION, the apt repository of the organisation's products (packages.komira.ai/apt), suite
  # `testing`: the release's two .debs, signed into the pool apt/pool/jobscheduler/ and the index
  # of the suite. The same three jobs, and up to three attempts, for each suite, and no job holds
  # both the signing key and the cloud role. No job checks out the repository or compiles: each
  # downloads the `xtask` that `deploy-tool` built, in a job with no token and no secret, and runs
  # `tool/xtask channels ...`:
  #   testing-apt-read   (environment apt-publish: the role, no key) reads the index of the suite
  #                      with the ETag of each object, from S3, never through the CDN;
  #   testing-apt-index  (environment apt-signing: the key, no role) checks the files against
  #                      SHA256SUMS and each .deb against its bundle, merges the .debs into the
  #                      index that was read (every other product's entries are kept) and signs
  #                      Release;
  #   testing-apt-write  (environment apt-publish) checks the files again, uploads each .deb once,
  #                      then writes the signed index with If-Match on the ETags that were read.
  # A write that finds the index changed in between (another product's release) reports
  # conflict=true and ends green; attempt 2 (the jobs with the suffix -2), and then 3, read, merge
  # and sign again, and the last one fails instead of asking for a fourth. A job without its
  # settings ends green with a notice and writes nothing.
  testing-apt-read:
    needs: [plan, publish, deploy-tool]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apt-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-tool
          path: tool
      - name: Make the tool executable
        run: chmod +x tool/xtask
      - name: Gate on the settings of the apt repository (a job without them does nothing and ends green)
        id: gate
        env:
          APT_PUBLISH_ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: tool/xtask channels gate --label testing-apt-read --output "$GITHUB_OUTPUT" --setting "APT_PUBLISH_ROLE_ARN=${APT_PUBLISH_ROLE_ARN:+set}" --setting "APT_BUCKET=${APT_BUCKET:+set}" --setting "APT_DISTRIBUTION_ID=${APT_DISTRIBUTION_ID:+set}" --setting "APT_HOSTNAME=${APT_HOSTNAME:+set}"
      - name: Assume the apt publish role through OIDC
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
        run: tool/xtask channels assume --role-arn "$ROLE_ARN" --session-name "jobscheduler-testing-apt-read-$GITHUB_RUN_ID" --region us-east-1 --env-file "$GITHUB_ENV"
      - name: Read the current index and the ETag of each object from S3 (never through the CDN, which caches the index)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_BUCKET: ${{ vars.APT_BUCKET }}
        run: tool/xtask channels apt read --suite testing --bucket "$APT_BUCKET" --out "$RUNNER_TEMP/apt-current"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: apt-current
          path: ${{ runner.temp }}/apt-current
          if-no-files-found: error
          retention-days: 1

  testing-apt-index:
    needs: [plan, testing-apt-read, deploy-tool]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apt-signing
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      signed: ${{ steps.sign.outputs.signed }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-tool
          path: tool
      - name: Make the tool executable
        run: chmod +x tool/xtask
      - name: Gate on the signing key and on the read (a job without them does nothing and ends green)
        id: gate
        env:
          READ_ENABLED: ${{ needs.testing-apt-read.outputs.enabled }}
          APT_GPG_FINGERPRINT: ${{ vars.APT_GPG_FINGERPRINT }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: tool/xtask channels gate --label testing-apt-index --output "$GITHUB_OUTPUT" --require "READ_ENABLED=$READ_ENABLED" --setting "APT_GPG_FINGERPRINT=${APT_GPG_FINGERPRINT:+set}" --setting "APT_GPG_PRIVATE_KEY=${APT_GPG_PRIVATE_KEY:+set}" --setting "APT_GPG_PASSPHRASE=${APT_GPG_PASSPHRASE:+set}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: apt-current
          path: ${{ runner.temp }}/apt-current
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: release-assets
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: bundles
          path: dist
      - name: The files are exactly the assets of this run, and match SHA256SUMS
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: The amd64 .deb is the one artifacts.yml attested, from main at this commit (from its bundle)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh attestation verify "dist/js-agent_${VERSION}_amd64.deb" --bundle "dist/js-agent_${VERSION}_amd64.deb.sigstore.json" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/artifacts.yml" --source-ref refs/heads/main --source-digest "$COMMIT" --deny-self-hosted-runners
      - name: The arm64 .deb is the one artifacts.yml attested, from main at this commit (from its bundle)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh attestation verify "dist/js-agent_${VERSION}_arm64.deb" --bundle "dist/js-agent_${VERSION}_arm64.deb.sigstore.json" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/artifacts.yml" --source-ref refs/heads/main --source-digest "$COMMIT" --deny-self-hosted-runners
      - name: Merge the .debs into the index that was read (the entries of every other product are kept)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          OWNER: ${{ github.repository_owner }}
        run: tool/xtask channels apt index --suite testing --current "$RUNNER_TEMP/apt-current" --out "$RUNNER_TEMP/apt-next" --debs dist --version "$VERSION" --origin "$OWNER" --label "$OWNER" --description "$OWNER packages" --date "$(date +%s)"
      - name: Sign Release with the signing subkey (InRelease and Release.gpg), then remove the key
        id: sign
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_GPG_FINGERPRINT: ${{ vars.APT_GPG_FINGERPRINT }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: tool/xtask channels apt sign --dir "$RUNNER_TEMP/apt-next/dists/testing" --work "$RUNNER_TEMP/apt-sign" --fingerprint "$APT_GPG_FINGERPRINT" --key-env APT_GPG_PRIVATE_KEY --passphrase-env APT_GPG_PASSPHRASE --output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: apt-next
          path: |
            ${{ runner.temp }}/apt-next/dists
            ${{ runner.temp }}/apt-next/etags.txt
          if-no-files-found: error
          retention-days: 1

  testing-apt-write:
    needs: [plan, testing-apt-read, testing-apt-index, deploy-tool]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apt-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      conflict: ${{ steps.put.outputs.conflict }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-tool
          path: tool
      - name: Make the tool executable
        run: chmod +x tool/xtask
      - name: Gate on the settings of the apt repository and on the signed index (a job without them does nothing and ends green)
        id: gate
        env:
          READ_ENABLED: ${{ needs.testing-apt-read.outputs.enabled }}
          INDEX_SIGNED: ${{ needs.testing-apt-index.outputs.signed }}
          APT_PUBLISH_ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: tool/xtask channels gate --label testing-apt-write --output "$GITHUB_OUTPUT" --require "READ_ENABLED=$READ_ENABLED" --require "INDEX_SIGNED=$INDEX_SIGNED" --setting "APT_PUBLISH_ROLE_ARN=${APT_PUBLISH_ROLE_ARN:+set}" --setting "APT_BUCKET=${APT_BUCKET:+set}" --setting "APT_DISTRIBUTION_ID=${APT_DISTRIBUTION_ID:+set}" --setting "APT_HOSTNAME=${APT_HOSTNAME:+set}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: apt-next
          path: ${{ runner.temp }}/apt-next
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: release-assets
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: bundles
          path: dist
      - name: The files are exactly the assets of this run, and match SHA256SUMS
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: The amd64 .deb is the one artifacts.yml attested, from main at this commit (from its bundle)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh attestation verify "dist/js-agent_${VERSION}_amd64.deb" --bundle "dist/js-agent_${VERSION}_amd64.deb.sigstore.json" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/artifacts.yml" --source-ref refs/heads/main --source-digest "$COMMIT" --deny-self-hosted-runners
      - name: The arm64 .deb is the one artifacts.yml attested, from main at this commit (from its bundle)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh attestation verify "dist/js-agent_${VERSION}_arm64.deb" --bundle "dist/js-agent_${VERSION}_arm64.deb.sigstore.json" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/artifacts.yml" --source-ref refs/heads/main --source-digest "$COMMIT" --deny-self-hosted-runners
      - name: Assume the apt publish role through OIDC
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
        run: tool/xtask channels assume --role-arn "$ROLE_ARN" --session-name "jobscheduler-testing-apt-write-$GITHUB_RUN_ID" --region us-east-1 --env-file "$GITHUB_ENV"
      - name: Upload the .debs once each, then write the signed index with If-Match on the ETags that were read, then invalidate /apt/dists/*
        id: put
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: tool/xtask channels apt write --suite testing --bucket "$APT_BUCKET" --distribution-id "$APT_DISTRIBUTION_ID" --hostname "$APT_HOSTNAME" --next "$RUNNER_TEMP/apt-next" --debs dist --version "$VERSION" --output "$GITHUB_OUTPUT"
  # Attempt 2: the write of attempt 1 lost the race for the index.

  testing-apt-read-2:
    needs: [plan, testing-apt-write, deploy-tool]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' && needs.testing-apt-write.outputs.conflict == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apt-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-tool
          path: tool
      - name: Make the tool executable
        run: chmod +x tool/xtask
      - name: Gate on the settings of the apt repository (a job without them does nothing and ends green)
        id: gate
        env:
          APT_PUBLISH_ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: tool/xtask channels gate --label testing-apt-read-2 --output "$GITHUB_OUTPUT" --setting "APT_PUBLISH_ROLE_ARN=${APT_PUBLISH_ROLE_ARN:+set}" --setting "APT_BUCKET=${APT_BUCKET:+set}" --setting "APT_DISTRIBUTION_ID=${APT_DISTRIBUTION_ID:+set}" --setting "APT_HOSTNAME=${APT_HOSTNAME:+set}"
      - name: Assume the apt publish role through OIDC
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
        run: tool/xtask channels assume --role-arn "$ROLE_ARN" --session-name "jobscheduler-testing-apt-read-2-$GITHUB_RUN_ID" --region us-east-1 --env-file "$GITHUB_ENV"
      - name: Read the current index and the ETag of each object from S3 (never through the CDN, which caches the index)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_BUCKET: ${{ vars.APT_BUCKET }}
        run: tool/xtask channels apt read --suite testing --bucket "$APT_BUCKET" --out "$RUNNER_TEMP/apt-current"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: apt-current-2
          path: ${{ runner.temp }}/apt-current
          if-no-files-found: error
          retention-days: 1

  testing-apt-index-2:
    needs: [plan, testing-apt-read-2, deploy-tool]
    if: ${{ !cancelled() && !failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' && needs.testing-apt-read-2.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apt-signing
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      signed: ${{ steps.sign.outputs.signed }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-tool
          path: tool
      - name: Make the tool executable
        run: chmod +x tool/xtask
      - name: Gate on the signing key and on the read (a job without them does nothing and ends green)
        id: gate
        env:
          READ_ENABLED: ${{ needs.testing-apt-read-2.outputs.enabled }}
          APT_GPG_FINGERPRINT: ${{ vars.APT_GPG_FINGERPRINT }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: tool/xtask channels gate --label testing-apt-index-2 --output "$GITHUB_OUTPUT" --require "READ_ENABLED=$READ_ENABLED" --setting "APT_GPG_FINGERPRINT=${APT_GPG_FINGERPRINT:+set}" --setting "APT_GPG_PRIVATE_KEY=${APT_GPG_PRIVATE_KEY:+set}" --setting "APT_GPG_PASSPHRASE=${APT_GPG_PASSPHRASE:+set}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: apt-current-2
          path: ${{ runner.temp }}/apt-current
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: release-assets
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: bundles
          path: dist
      - name: The files are exactly the assets of this run, and match SHA256SUMS
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: The amd64 .deb is the one artifacts.yml attested, from main at this commit (from its bundle)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh attestation verify "dist/js-agent_${VERSION}_amd64.deb" --bundle "dist/js-agent_${VERSION}_amd64.deb.sigstore.json" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/artifacts.yml" --source-ref refs/heads/main --source-digest "$COMMIT" --deny-self-hosted-runners
      - name: The arm64 .deb is the one artifacts.yml attested, from main at this commit (from its bundle)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
