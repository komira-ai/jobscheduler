          name: bundles
          path: dist
      - name: The files are exactly the assets of this run, and match SHA256SUMS
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: The amd64 .deb is the one artifacts.yml attested, from main at this commit (from its bundle)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh attestation verify "dist/js-agent_${VERSION}_amd64.deb" --bundle "dist/js-agent_${VERSION}_amd64.deb.sigstore.json" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/artifacts.yml" --source-ref refs/heads/main --source-digest "$COMMIT" --deny-self-hosted-runners
      - name: The arm64 .deb is the one artifacts.yml attested, from main at this commit (from its bundle)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh attestation verify "dist/js-agent_${VERSION}_arm64.deb" --bundle "dist/js-agent_${VERSION}_arm64.deb.sigstore.json" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/artifacts.yml" --source-ref refs/heads/main --source-digest "$COMMIT" --deny-self-hosted-runners
      - name: Promote the entries of this release that testing lists into the index of stable (held to the digests of SHA256SUMS; the entries of every other product are kept)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          OWNER: ${{ github.repository_owner }}
        run: tool/xtask channels apt promote --testing "$RUNNER_TEMP/apt-read/testing" --stable "$RUNNER_TEMP/apt-read/stable" --out "$RUNNER_TEMP/apt-next" --version "$VERSION" --sums dist/SHA256SUMS --origin "$OWNER" --label "$OWNER" --description "$OWNER packages" --date "$(date +%s)"
      - name: Sign Release with the signing subkey (InRelease and Release.gpg), then remove the key
        id: sign
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_GPG_FINGERPRINT: ${{ vars.APT_GPG_FINGERPRINT }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: tool/xtask channels apt sign --dir "$RUNNER_TEMP/apt-next/dists/stable" --work "$RUNNER_TEMP/apt-sign" --fingerprint "$APT_GPG_FINGERPRINT" --key-env APT_GPG_PRIVATE_KEY --passphrase-env APT_GPG_PASSPHRASE --output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: apt-promoted-3
          path: |
            ${{ runner.temp }}/apt-next/dists
            ${{ runner.temp }}/apt-next/etags.txt
          if-no-files-found: error
          retention-days: 1

  stable-apt-write-3:
    needs: [plan, stable-apt-read-3, stable-apt-index-3, deploy-tool]
    if: ${{ !cancelled() && !failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' && needs.stable-apt-read-3.result == 'success' && needs.stable-apt-index-3.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apt-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      conflict: ${{ steps.put.outputs.conflict }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-tool
          path: tool
      - name: Make the tool executable
        run: chmod +x tool/xtask
      - name: Gate on the settings of the apt repository and on the signed index (a job without them does nothing and ends green)
        id: gate
        env:
          READ_ENABLED: ${{ needs.stable-apt-read-3.outputs.enabled }}
          INDEX_SIGNED: ${{ needs.stable-apt-index-3.outputs.signed }}
          APT_PUBLISH_ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: tool/xtask channels gate --label stable-apt-write-3 --output "$GITHUB_OUTPUT" --require "READ_ENABLED=$READ_ENABLED" --require "INDEX_SIGNED=$INDEX_SIGNED" --setting "APT_PUBLISH_ROLE_ARN=${APT_PUBLISH_ROLE_ARN:+set}" --setting "APT_BUCKET=${APT_BUCKET:+set}" --setting "APT_DISTRIBUTION_ID=${APT_DISTRIBUTION_ID:+set}" --setting "APT_HOSTNAME=${APT_HOSTNAME:+set}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: apt-promoted-3
          path: ${{ runner.temp }}/apt-next
      - name: Assume the apt publish role through OIDC
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
        run: tool/xtask channels assume --role-arn "$ROLE_ARN" --session-name "jobscheduler-stable-apt-write-3-$GITHUB_RUN_ID" --region us-east-1 --env-file "$GITHUB_ENV"
      - name: Write the signed index of stable with If-Match on the ETags that were read (the packages are in the pool already), then invalidate /apt/dists/*
        id: put
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: tool/xtask channels apt write --suite stable --bucket "$APT_BUCKET" --distribution-id "$APT_DISTRIBUTION_ID" --hostname "$APT_HOSTNAME" --next "$RUNNER_TEMP/apt-next" --no-pool --last --output "$GITHUB_OUTPUT"

  # Starts hostkeeper-desired.yml for this release, which sets it as hostkeeper's desired version
  # of js-agent (its `workflow_dispatch` with `version`: the coordinator's allow-list admits that
  # event; a call from this run would carry the event `push`, which it does not). Only once the
  # suite `stable` lists the release (one of the stable writes reported no conflict, which also
  # means the apt jobs are on), after `pkg-upload` has ended (its package is in the targets the
  # first set fixes), when `turn` gave this run the turn, and while JS_AGENT_SETS_DESIRED is
  # `true` (hostkeeper-desired.yml is off otherwise). It does not wait for that workflow, which
  # takes about two minutes; a newer run starts its own after this one, in turn. It first checks
  # that the release is still the newest published one: a re-run of the failed jobs of an older
  # run keeps that run's `turn` (and its `go=true`), and must not move the farm back to an older
  # version, so when a newer release exists it starts nothing and says so. It holds
  # `actions: write`, to start the workflow, and `contents: read`, to list the releases, and runs
  # `gh` only.
  desired:
    needs: [plan, turn, pkg-upload, stable-apt-write, stable-apt-write-2, stable-apt-write-3]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' && needs.turn.outputs.go == 'true' && vars.JS_AGENT_SETS_DESIRED == 'true' && (needs.stable-apt-write.outputs.conflict == 'false' || needs.stable-apt-write-2.outputs.conflict == 'false' || needs.stable-apt-write-3.outputs.conflict == 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Check that this release is the newest published one
        id: newest
        run: |
          set -euo pipefail
          newest="$(gh api --paginate "repos/$REPO/releases" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name | select(test("^v[0-9]+[.][0-9]+[.][0-9]+$"))' | sort -V | tail -n 1)"
          if [ "$newest" = "v$VERSION" ]; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$newest is published, newer than v$VERSION: hostkeeper-desired.yml is not started for v$VERSION"
            echo "newest=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Start hostkeeper-desired.yml for this release
        if: ${{ steps.newest.outputs.newest == 'true' }}
        run: gh workflow run hostkeeper-desired.yml --repo "$REPO" --ref main -f version="$VERSION"

  # The end of this run's publish and deploy jobs, whatever their results: `turn` of a newer run
  # waits for this job of every older run that holds the turn. `always()`, so it ends when they
  # failed, were skipped or the run was cancelled. It holds nothing and does nothing else.
  deployed:
    needs: [turn, publish, gamma, cp-deploy, pkg-upload, desired, stable-apt-write, stable-apt-write-2, stable-apt-write-3]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: echo "the publish and deploy jobs of this run have ended"

  # A job of this run on main failed: the deploy path or the beta stage (`failure()` looks at
  # every job these need, and every job those need).
  # Opens an issue titled `RELEASE-RED: jobscheduler <first failing job> failed on main at <commit>`
  # with the label `main-red`, whose body has a `Run:`, a `Head:` and up to five `Failing:` lines,
  # or comments the same lines on the RELEASE-RED issue that is open. It holds `issues: write`
  # and `actions: read` and runs `gh` only.
  release-red:
    needs: [unit-tests, deployed, beta-macos, beta-macos-first-install, beta-macos-probe, beta-macos-isolation, promote-macos, smoke-bundle-check]
    if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open a RELEASE-RED issue, or comment on the one that is open
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          failing="$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=100" --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | .name')"
          first="$(head -n 1 <<< "$failing")"
          {
            echo "Run: $RUN_URL"
            echo "Head: $COMMIT"
            head -n 5 <<< "$failing" | sed 's/^/Failing: /'
          } > "$RUNNER_TEMP/body.md"
          gh label create main-red --repo "$REPO" --color b60205 --description "A run on main is red" --force
          open="$(gh issue list --repo "$REPO" --label main-red --state open --json number,title --jq '[.[] | select(.title | startswith("RELEASE-RED: jobscheduler"))] | first | .number // empty')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$REPO" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --repo "$REPO" --label main-red --title "RELEASE-RED: jobscheduler ${first:-a job} failed on main at ${COMMIT:0:12}" --body-file "$RUNNER_TEMP/body.md"
          fi

  # A run that released (plan said so) in which no job failed or was cancelled: every suite that
  # ran on this commit passed. When the commit is still the tip of main, the RELEASE-RED issues
  # that are open are closed, each with a comment naming the commit and the run; when main has
  # moved on, a newer run may have opened them, so nothing is closed (the newer run's own green
  # closes them). Same permissions as `release-red`, `gh` only.
  release-green:
    needs: [plan, unit-tests, deployed, beta-macos, beta-macos-first-install, beta-macos-probe, beta-macos-isolation, promote-macos, smoke-bundle-check]
    if: ${{ !cancelled() && !failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Close the RELEASE-RED issues that are open
        run: |
          set -euo pipefail
          tip="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          if [ "$tip" != "$COMMIT" ]; then
            echo "::notice::main is at $tip, past $COMMIT: the RELEASE-RED issues are left to the run of the newer commit"
            exit 0
          fi
          open="$(gh issue list --repo "$REPO" --label main-red --state open --json number,title --jq '.[] | select(.title | startswith("RELEASE-RED: jobscheduler")) | .number')"
          for number in $open; do
            gh issue close "$number" --repo "$REPO" --comment "Fixed: every job of the release run at $COMMIT passed or was skipped ($RUN_URL)."
          done
