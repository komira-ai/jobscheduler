# Release: a pushed version tag builds js-lease-server and js, attests them and publishes
# them as the assets of the GitHub release for that tag. GitHub-hosted runners only,
# actions pinned to commit SHAs.
#
# A pull request that changes this file, and a manual run, build the same assets and
# write SHA256SUMS but never attest or publish: those jobs run only for a tag push.
# Publishing needs no extra step: the owner pushes vX.Y.Z, which must equal the
# workspace version.
#
# Permissions are per job. Only `attest` holds id-token and attestations write, and only
# `publish` holds contents write; neither runs repository code, only pinned actions,
# `sha256sum` and `gh`.
name: release

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Reads the workspace version and, for a tag push, fails unless the tag is v<version>
  # and its commit is on main.
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: A tag must point at a commit on main
        if: ${{ github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tagged commit $GITHUB_SHA is not on main"
            exit 1
          fi
      - run: rustup toolchain install
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Every crate takes the workspace version; the two released crates must agree.
          meta="$(cargo metadata --locked --no-deps --format-version 1)"
          version="$(jq -r '[.packages[] | select(.name == "js-cli" or .name == "js-lease-server") | .version] | unique | if length == 1 then .[0] else "mismatch" end' <<<"$meta")"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::js-cli and js-lease-server must share one X.Y.Z version, got '$version'"
            exit 1
          fi
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::tag '$REF_NAME' does not match the workspace version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "workspace version $version"

  build:
    needs: [version]
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # js does not build for macOS yet: js-cli draws its run label with rustix getrandom,
        # which exists only on Linux. Add aarch64-apple-darwin here once it does.
        include:
          # Static musl binaries: they run on gcr.io/distroless/cc-debian12 and on any
          # Linux host, whatever its libc. rustls links ring, which compiles C, hence
          # musl-tools.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            builds: js-lease-server:js-lease-server js-cli:js
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install musl tools
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - run: rustup toolchain install
      - run: rustup target add "$TARGET"
      - name: Build and package
        env:
          BUILDS: ${{ matrix.builds }}
        run: |
          set -euo pipefail
          mkdir dist
          for entry in $BUILDS; do
            package="${entry%%:*}"
            bin="${entry##*:}"
            cargo build --locked --release --target "$TARGET" -p "$package" --bin "$bin"
            name="$bin-$VERSION-$TARGET"
            mkdir "stage-$bin"
            mkdir "stage-$bin/$name"
            cp "target/$TARGET/release/$bin" LICENSE "stage-$bin/$name/"
            tar -C "stage-$bin" -czf "dist/$name.tar.gz" "$name"
          done
          ls -l dist
      - name: Check the binaries
        run: |
          set -euo pipefail
          for entry in $BUILDS; do
            bin="${entry##*:}"
            file "target/$TARGET/release/$bin"
          done
          case "$TARGET" in
            *-linux-musl)
              for entry in $BUILDS; do
                bin="${entry##*:}"
                # A static binary has no dynamic loader and no shared libraries.
                if readelf -d "target/$TARGET/release/$bin" | grep -q NEEDED; then
                  echo "::error::$bin links shared libraries"
                  exit 1
                fi
              done
              ;;
          esac
          # Both binaries run on the build host and answer --version.
          for entry in $BUILDS; do
            bin="${entry##*:}"
            "target/$TARGET/release/$bin" --version
          done
        env:
          BUILDS: ${{ matrix.builds }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # One SHA256SUMS over every asset, checked before anything is attested or published.
  sums:
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Write and check SHA256SUMS
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          expected="js-$VERSION-x86_64-unknown-linux-musl.tar.gz js-lease-server-$VERSION-x86_64-unknown-linux-musl.tar.gz"
          actual="$(ls | LC_ALL=C sort | tr '\n' ' ' | sed 's/ $//')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::unexpected assets: '$actual' (expected '$expected')"
            exit 1
          fi
          sha256sum -- *.tar.gz > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          echo "assets:"
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Build provenance for every asset, from the checksums file. No repository code runs here.
  attest:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: [sums]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

  # Creates the release for the tag with the attested files. Nothing is rebuilt.
  publish:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: [version, sums, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Check, then create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check --strict SHA256SUMS
          gh release create "$TAG" --repo "$REPO" --verify-tag \
            --title "jobscheduler $VERSION" \
            --notes "js-lease-server and js $VERSION. Verify the files with SHA256SUMS and gh attestation verify; see docs/release.md." \
            ./*.tar.gz SHA256SUMS
