        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_BUCKET: ${{ vars.APT_BUCKET }}
        run: tool/xtask channels apt read --suite stable --bucket "$APT_BUCKET" --out "$RUNNER_TEMP/apt-read/stable"
