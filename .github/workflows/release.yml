        run: tool/xtask channels apt write --suite testing --bucket "$APT_BUCKET" --distribution-id "$APT_DISTRIBUTION_ID" --hostname "$APT_HOSTNAME" --next "$RUNNER_TEMP/apt-next" --debs dist --version "$VERSION" --last --output "$GITHUB_OUTPUT"
  # INSTALL CHECK (release time only; a failure stops the promotion before anything is made
  # public to the hosts). check-apt: a clean Ubuntu container, pinned by digest, on a hosted
  # runner of each architecture, adds packages.komira.ai with the published keyring (deb822,
  # Signed-By) and the suite `testing`, installs js-agent=<version>, and holds the installed
  # system to what the package promises (tool/xtask channels check-apt). The xtask binary built
  # on the runner is mounted into the container, which has nothing else of this repository. It
  # runs only when a write of testing landed.
  check-apt:
    needs: [plan, testing-apt-write, testing-apt-write-2, testing-apt-write-3]
    if: ${{ !cancelled() && !failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' && (needs.testing-apt-write.outputs.conflict == 'false' || needs.testing-apt-write-2.outputs.conflict == 'false' || needs.testing-apt-write-3.outputs.conflict == 'false') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Compile xtask
        run: cargo xtask --help
      - name: Install js-agent from the suite testing in a clean Ubuntu container
        env:
          ARCH: ${{ matrix.arch }}
        run: docker run --rm --volume "$PWD/target/debug/xtask:/usr/local/bin/xtask:ro" ubuntu@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852 xtask channels check-apt --arch "$ARCH" --version "$VERSION"

  # PROMOTION, the apt repository: the same three jobs for the suite `stable`, after `check-apt`
  # succeeded (a failed or skipped check promotes nothing). The read job reads the index of
  # testing and of stable; the index job lists the entries of this release that testing holds in
  # the index of stable (`channels apt promote`: held to the digests of SHA256SUMS,
  # every other product's entries kept, an older version or other bytes at the same version
  # refused); the write job writes the index with If-Match (apt write --no-pool: the packages are
  # in the pool already, none is uploaded). They run only when testing-apt-read had its settings.

  stable-apt-read:
    needs: [plan, check-apt, testing-apt-read, deploy-tool]
    if: ${{ !cancelled() && !failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' && needs.check-apt.result == 'success' }}
