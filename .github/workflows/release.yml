          path: tool
      - name: Make the tool executable
        run: chmod +x tool/xtask
      - name: Gate on the settings of the apt repository (a job without them does nothing and ends green)
        id: gate
        env:
          TESTING_ENABLED: ${{ needs.testing-apt-read.outputs.enabled }}
          APT_PUBLISH_ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: tool/xtask channels gate --label stable-apt-read --output "$GITHUB_OUTPUT" --require "TESTING_ENABLED=$TESTING_ENABLED" --setting "APT_PUBLISH_ROLE_ARN=${APT_PUBLISH_ROLE_ARN:+set}" --setting "APT_BUCKET=${APT_BUCKET:+set}" --setting "APT_DISTRIBUTION_ID=${APT_DISTRIBUTION_ID:+set}" --setting "APT_HOSTNAME=${APT_HOSTNAME:+set}"
      - name: Assume the apt publish role through OIDC
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
        run: tool/xtask channels assume --role-arn "$ROLE_ARN" --session-name "jobscheduler-stable-apt-read-$GITHUB_RUN_ID" --region us-east-1 --env-file "$GITHUB_ENV"
