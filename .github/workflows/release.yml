# Continuous release: every push to main that changed code that ships is released as the next
# version and deployed, with no step by hand, once it built and its unit tests passed
# (docs/release.md). GitHub-hosted
# runners only, actions pinned to commit SHAs.
#
# What starts it. A push to main (`on: push`), and nothing else releases: every job that
# attests, publishes or deploys tests that the event is a push and the ref is main, and no tag and no manual run starts a release. A pull request that changes this file
# runs `plan` as a dry run (told so with --dry-run, on Linux x86_64 like every check of a pull
# request) and never waits for `ci`, builds, attests, tags or publishes. A pull request that
# changes only artifacts.yml starts no dry run. Pull requests run Linux x86_64 and nothing else:
# macOS and arm64 are the beta stage below.
#
# Which commit. The one pushed: `github.sha` of a push run is the pushed commit, and an
# attestation records `github.sha` and `github.ref` (the certificate's source digest and
# ref), so the run has to be at the commit it releases; that is why the release is not
# started by the completion of `ci` (`workflow_run`), whose runs are at main's tip, not at
# the commit that passed.
#
# The deploy path, and what is not on it. A merge reaches the farm through `plan`, `artifacts`
# (build, sums, attest, verify) and `unit-tests` (the workspace's tests, the ones `ci`'s `test`
# job runs but its `--ignored` live steps, in four shards beside the build), then `turn`,
# `publish`, the apt repository (with `check-apt`, its install check), the control-plane deploy
# and `desired`, which starts hostkeeper-desired.yml for the release. Nothing else gates it:
# `ci` (lint, deny, coverage, the privileged and live jobs) and the beta stage (the macOS tests
# and probe) run beside it or after it. Nothing in this file waits for `ci` or reports its result;
# a failing `ci` run on a commit is that run's own red check, and the fix is the next merge.
#
# A failure of any job of the run on main (the deploy path or the beta stage) runs
# `release-red`, which opens an issue titled `RELEASE-RED: jobscheduler ...` with the label
# `main-red`, the label the project's red-main alert watches, or comments on the one that is
# open; a run in which every job passed or was skipped runs `release-green`, which closes it. A
# re-run of only the failed jobs keeps the `plan` that succeeded, so `publish` and artifacts.yml's
# `verify` check the tag and the attestations.
#
# Two tag views differ on purpose. `plan` counts only the `v*` tags merged into the commit;
# `publish` compares against the highest `vX.Y.Z` tag of the whole repository and refuses
# unless it is a proper ancestor of the commit, so it fails closed: a `v` tag that is not on
# main blocks releases until it is removed (docs/release.md, Recovery).
#
# Several merges at once. There is no concurrency group: every push starts its run at once and
# none is cancelled or replaced. The runs build and test side by side (each its own version, see
# `plan`) and take turns at publishing and deploying: `turn` (`cargo xtask release turn`) waits
# while an older run holds the turn, from its `turn` until its job `deployed`, the last of its
# publish and deploy jobs, has ended; and when a newer run has reached its turn, or a newer
# release is published, it says so and `publish` and everything after it are skipped, so of
# several runs waiting only the newest deploys, and the superseded ones end green. An older run
# never waits for a newer one. `publish` checks again right before the publishing call that the
# latest `v*` tag is a proper ancestor of the commit, so no tag is ever put on an older commit.
#
# The decision and the version are `cargo xtask release plan` (crates/xtask): a release
# only when a file that ships changed since the latest `v*` tag, as that tag with its patch
# raised by the number of first-parent commits from it to the commit (so runs that build at
# once never take the same version), or the workspace version when that is above the tag. `cargo xtask release
# stamp` puts the version into the build's checkout, so `--version` prints it; nothing is
# committed.
#
# The assets, built and signed by artifacts.yml, which the `artifacts` job calls: the archives of
# the binaries (`*.tar.gz`); the Debian package of js-agent for amd64 and arm64
# (`js-agent_<version>_<arch>.deb`); and the container image of js-lease-server for each of the
# two Linux targets (`js-lease-server-<version>-<target>.oci.tar`), each package and image with
# the bundle of its own provenance beside it (`<file>.sigstore.json`). SHA256SUMS lists all of them
# but the bundles. This file attests nothing: every attestation is signed by artifacts.yml, the
# one signer farm hosts trust (see the top of that file).
#
# Order: plan, then artifacts (build, sums, attest, verify) beside unit-tests, then turn and
# publish, then the apt repository, gamma, the control-plane deploy, pkg-upload and desired, and
# last `deployed`, which marks the end of the run's publish and deploy jobs for `turn`. The beta stage, the platforms other than Linux
# x86_64, runs beside publish and the jobs after it, not before them: after `artifacts`, the
# jobs `beta-macos` (beta.yml: the workspace's tests on Apple silicon), `beta-macos-pkg`
# (js-agent-macos-pkg.yml: the installer package of js-agent, built and signed),
# `beta-macos-first-install` (js-agent-macos-first-install.yml: the first install of that
# package through hostkeeper's installer and the update hook, as root, after `beta-macos-pkg`),
# `beta-macos-probe` (macos-probe.yml) and `beta-macos-isolation`
# (js-agent-native-isolation.yml: the two-run isolation test of the Mac slot accounts, as root, on
# a hosted Mac of its own) run on the hosted macOS runners (the build of the Apple
# silicon archives in `artifacts` and of the package in `beta-macos-pkg` runs on the build farm's
# Macs instead when the repository variable MACOS_ON_FARM is `true`, docs/mac-farm.md), and
# `promote-macos` adds the macOS archives (`*-aarch64-apple-darwin.tar.gz`) to the published release
# when the first four and `publish` succeeded. `beta-macos-isolation` holds nothing back yet: its
# failure makes the run red and `release-red` reports it, but the macOS archives are added
# without it, since on a hosted runner the test reaches no verdict (the header of
# js-agent-native-isolation.yml says why). `pkg-upload` puts the signed package in the package
# repository (`pkg/jobscheduler/<version>/`) and maps `js-agent` to `pkg/jobscheduler` in the
# repository's descriptor (`hostkeeper-repository.json`, which a coordinator reads to find the
# package), where hostkeeper-desired.yml finds it, as soon as `beta-macos-pkg` has ended and
# `publish` succeeded: a package that failed to build or sign is left out (hosts on macOS then keep
# their version) and the deploy goes on without it, so `desired` waits for the package job's end but
# never for its success, and for no test of the beta stage. After `pkg-upload`, `blackbox-macos`
# (js-agent-macos-blackbox.yml) runs the black-box tests of that signed package on hosted Macs: its
# first install, and its update from the release before it; nothing waits for it yet. `publish` leaves the archives out, and
# nothing else waits for the beta stage: not the Linux assets, the .debs, the apt repository, gamma,
# the control-plane deploy or hostkeeper. A pull request runs none of it. The tag is made first of
# those: `publish` makes a draft release, uploads the files built, attested and verified, and
# publishes it in one call, which creates the tag. A failed run leaves no tag. A re-run of a failed
# run continues the same draft and adds what is missing; a published release is never changed, a
# draft that is stale or differs is replaced (see `publish`).
#
# The apt repository, https://packages.komira.ai/apt (docs/release.md), after `publish`: the two
# .debs go into the suite `testing` (the jobs `testing-apt-*`: read, index and write, in up to
# three attempts when another product's release wins the race for the shared index), then
# `check-apt` installs the release from `testing` in a clean Ubuntu container on amd64 and on
# arm64, and only when it succeeded the same bytes are promoted into the suite `stable` (the jobs
# `stable-apt-*`, which write the index alone, `--no-pool`). Hosts install from `stable`:
# hostkeeper's apt installer is told to by hostkeeper-desired.yml, which `desired` starts once
# `stable` lists the release. No job holds both the signing key and the cloud role: the `*-apt-read` and
# `*-apt-write` jobs (environment `apt-publish`) assume the publish role through OIDC and hold no
# key; the `*-apt-index` jobs (environment `apt-signing`) hold the key and `contents: read`
# alone. None of them checks out the repository or compiles anything: each downloads the `xtask`
# binary that `deploy-tool` built (a job with neither token nor secret) and runs its verbs.
# The index and write jobs check the files they take from `dist` against SHA256SUMS and each
# .deb against its bundle (one step per architecture) before using them. Every apt job starts
# with `channels gate`, so without the settings of the two environments it ends green and writes
# nothing; and each runs only for a push to main, so a pull request's dry run never publishes.
#
# gamma sets the release as the desired version of the service js-server (the lease server, which
# the kbf host updater runs; js-agent is a hostkeeper service whose desired version
# hostkeeper-desired.yml sets) on the update coordinator and waits for it to converge. It is off
# (a notice, and the job passes) until the repository variable JS_COORDINATOR_URL is set
# (docs/release.md, "The gamma step").
#
# The smoke bundle (`smoke-bundle-pack`, `smoke-bundle-push`, `smoke-bundle-check`, after
# `deploy-tool`): the darwin bundle of packaging/js-smoke-bundle, packed from its committed tree
# and held to the digest of its recipe, pushed to ghcr.io/komira-ai/js/smoke under its tag (the
# same digest again sends nothing; another under the tag is refused), and pulled back by digest
# anonymously and compared with the tree (docs/release.md, "The smoke bundle"). Nothing on the
# deploy path waits for it; `release-red` and `release-green` count it.
#
# The control-plane deploy (`cp-deploy-digest`, then `cp-deploy`) deploys the release's
# linux-x86_64 image of js-lease-server to the Docker Swarm service js-server by calling
# docker-swarm-updater's reusable deploy workflow. It is off (both jobs skipped) until the
# repository variables CP_DEPLOY_ENDPOINT and CP_DEPLOY_TAILSCALE_TAGS are set (docs/release.md,
# "The control-plane deploy").
#
# Permissions are per job. Only `artifacts`, `beta-macos-pkg`, `pkg-upload`, `gamma`, `cp-deploy`
# and the apt read and write jobs hold id-token write here, and `artifacts` also attestations
# write, only because a called workflow can hold no more than its calling job grants: in
# artifacts.yml only `attest` holds them to sign, and its call of macos-farm.yml holds id-token
# write for the farm's network (a token that names macos-farm.yml, not artifacts.yml, as its
# workflow). `beta-macos-pkg` grants id-token write for the same reason: js-agent-macos-pkg.yml's
# call of macos-farm.yml holds it. Only
# `publish` holds contents write. No job that holds a token or the signing key checks out or
# compiles this repository's code (the one job that compiles any is docker-swarm-updater's deploy
# job, which `cp-deploy` calls: it builds the updater's own client from the commit it is pinned
# at): `attest` and `publish` run only pinned actions, `sha256sum`, `cmp`, `cp` and
# `gh`; `gamma`, `cp-deploy-digest`, `pkg-upload`, `smoke-bundle-push` and the apt read, index and write jobs run the `xtask` binary
# that the permissionless `deploy-tool` job built (so no build script ever sees a token, the token
# service's address or the key), after the pinned actions. The apt read and write jobs hold no
# key, and the index jobs no token. Only `smoke-bundle-push` holds packages write, and nothing
# else; `smoke-bundle-pack` and `smoke-bundle-check` hold `contents: read` alone, as `deploy-tool`
# does, and check out the commit to read the bundle's tree. `turn` holds `actions: read` and `contents: read` and runs
# that same binary; `desired` holds `actions: write` alone, to start hostkeeper-desired.yml, and
# runs `gh` only; `release-red` and `release-green` hold `issues: write` and `actions: read` and
# run `gh` only. A test (crates/xtask/tests/release_workflow) pins these rules for both files,
# and another (crates/xtask/tests/apt_workflow) the apt jobs and hostkeeper-desired.yml.
name: release

on:
  push:
    branches: [main]
  pull_request:
    paths: ['.github/workflows/release.yml']

permissions: {}

# No concurrency group, on purpose: GitHub keeps one waiting run per group and cancels the
# older waiting one, so a group would drop releases. The runs order their publishing and
# deploying themselves (`turn`, above).

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The commit the run is at: the pushed commit; for a pull request, its merge commit.
  COMMIT: ${{ github.sha }}

jobs:
  # Whether to release, and as which version (crates/xtask, `release plan`).
  plan:
    # A push to main, at once (it does not wait for `ci`); or a pull request (a dry run).
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      tag_exists: ${{ steps.plan.outputs.tag_exists }}
    steps:
      # The whole history and every tag: the files changed since the latest tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - id: plan
        name: Plan the release
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$EVENT" = pull_request ]; then
            flags+=(--dry-run)
          fi
          cargo xtask release plan --head "$COMMIT" --output "$GITHUB_OUTPUT" "${flags[@]}" | tee "$GITHUB_STEP_SUMMARY"

  # The files of the release, built and signed by artifacts.yml (see the top of that file): the
  # signer of every attestation is that file, the one farm hosts trust, not this one. Its jobs run
  # in this run, at this commit, under this event: a push to main. A called workflow gets no more
  # permission than its calling job grants, so this job grants what `attest` needs and what the
  # call of macos-farm.yml needs; each job of artifacts.yml then holds only its own (only `attest`
  # holds the two writes, and `macos-farm` the token alone).
  artifacts:
    needs: [plan]
    # A push to main only: a pull request builds nothing here (its dry run is `plan`), since the
    # build legs include arm64 and macOS runners, which no pull request starts.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/artifacts.yml
    with:
      version: ${{ needs.plan.outputs.version }}

  # The unit tests of the deploy path: the workspace's tests, those `ci`'s `test` job runs with
  # `cargo nextest run --workspace`, and with them the four js-sim-cell binaries behind its
  # feature `slow-families` that `test` leaves out (not its `--ignored` live steps, and not the
  # privileged, live and coverage jobs of `ci`, which do not gate the release), under
  # cargo-nextest in four shards on four runners, beside the build. It starts at the push,
  # without waiting for `plan`, so it is
  # not after anything on the clock; `turn`, and so `publish`, needs every shard to pass. Like
  # `test` it has a Postgres service (js-state's tests fail without it). It restores no Cargo
  # cache and saves none (its one cache is the pinned nextest tarball): when `ci`'s `test` job
  # saved one, it was built with `RUSTFLAGS=-D warnings`, which this job does not set, so none
  # of it was reused (a shard's log after an exact cache hit compiled 331 of the 332 packages
  # `cargo metadata --filter-platform x86_64-unknown-linux-gnu` resolves), and the restored
  # cache (about 13 GB compressed) and the full build on top of it filled a runner's disk.
  # `ci`'s `test` job now builds the `dev` profile and keeps no Cargo cache. nextest runs no
  # doctests; `ci` does. It holds `contents: read` alone and writes nothing that ships.
  unit-tests:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      # Every shard runs to the end, so one failing test does not hide the others'.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
        env:
          POSTGRES_PASSWORD: js-ci-throwaway
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      KBF_TEST_POSTGRES_URL: postgres://postgres:js-ci-throwaway@127.0.0.1:5432/postgres
      NEXTEST_VERSION: 0.9.146
      NEXTEST_SHA256: 682c21b777c333e96fd532e114d3a5a894e0729ab88d94c0a9f20f8419695428
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: nextest-cache
        with:
          path: ${{ runner.temp }}/pinned/cargo-nextest.tar.gz
          key: pinned-cargo-nextest-${{ env.NEXTEST_VERSION }}-${{ env.NEXTEST_SHA256 }}
      - name: Install cargo-nextest (pinned version and checksum)
        run: cargo xtask fetch --url "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz" --sha256 "$NEXTEST_SHA256" --cache "$RUNNER_TEMP/pinned/cargo-nextest.tar.gz" --out "$HOME/.cargo/bin/cargo-nextest" --extract tar.gz --member cargo-nextest
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.nextest-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/pinned/cargo-nextest.tar.gz
          key: ${{ steps.nextest-cache.outputs.cache-primary-key }}
      # Every package Cargo.lock names, for every platform, before any test runs: tests such as
      # xtask's spawn_sites run `cargo tree --target all --offline`, which reads them from the
      # registry, and with the tests split over shards no earlier test in the same job fetches
      # the rest (as in `ci`'s coverage shards).
      - run: cargo fetch --locked
      - name: Run this shard's unit tests
        run: cargo nextest run --workspace --locked --no-fail-fast --features js-sim-cell/slow-families --partition "slice:${{ matrix.shard }}/${{ strategy.job-total }}"

  # Takes this run's turn at publishing and deploying (`cargo xtask release turn`,
  # crates/xtask/src/release/turn.rs): it waits while an older run of this workflow holds the
  # turn (from its `turn` until its `deployed` has ended), and answers `go=false` when a newer
  # run has reached its turn or a newer release is published, so `publish` and everything after
  # it are skipped and only the newest of several waiting runs deploys. It runs after the build
  # and the unit tests passed, so a run that fails them never holds the turn. It runs the `xtask`
  # of `deploy-tool` with `actions: read` (the runs and their jobs) and `contents: read` (the
  # releases), and no repository code it compiled.
  turn:
    needs: [plan, artifacts, unit-tests, deploy-tool]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    outputs:
      go: ${{ steps.turn.outputs.go }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-tool
          path: tool
      - run: chmod +x tool/xtask
      - name: Wait for this run's turn, or learn that a newer run takes it
        id: turn
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: tool/xtask release turn --repo "$REPO" --workflow release.yml --run-number "$GITHUB_RUN_NUMBER" --version "$VERSION" --output "$GITHUB_OUTPUT"

  # Creates the release with the files artifacts.yml built, attested and verified, then
  # publishes it, which creates the tag. Only when the unit tests passed and `turn` said
  # `go=true`; when it said `go=false` (superseded) this job and every job that needs it are
  # skipped, and the run ends green.
  # Nothing is rebuilt. The release starts as a draft for this version (tag_name and
  # target_commitish the commit), every file is uploaded to it, and one last call
  # publishes it: a failed upload leaves a draft and no tag, and a re-run continues the
  # same draft. A published release is never changed: a file it has that differs from
  # this run's is an error, and a tag that exists and does not name this commit is one
  # too. A draft is unpublished and may be replaced: one that targets another commit, or
  # holds a file that differs from this run's, is deleted and made again (else a failed
  # publish of an older commit would block the version for good), and a file whose upload
  # did not finish is deleted before it is uploaded again. The tag is read again right
  # before the publishing call; one that names another commit stops the run, and so does a
# latest `v*` tag that is not a proper ancestor of this commit (a newer release finished first).
  #
  # This shell is not in xtask on purpose: the job holds contents write and runs no
  # repository code (see the top of this file), so its decisions stay in the few lines
  # below. Nothing here is covered by a test; the dry run checks the file parses.
  publish:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' && needs.turn.outputs.go == 'true' }}
    needs: [plan, artifacts, unit-tests, turn]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      # The bundle of each .deb's and each image's provenance, `<file>.sigstore.json`, made by
      # artifacts.yml's `attest` and checked by its `verify`. SHA256SUMS does not list them.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundles
          path: dist
      - name: Draft the release, add the files it lacks, publish it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          TAG_EXISTS: ${{ needs.plan.outputs.tag_exists }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check --strict SHA256SUMS
          # Every .deb and every image has its bundle beside it: the apt jobs verify each package
          # from it, and a deployer verifies an image from it.
          for package in ./*.deb ./*.oci.tar; do
            if [ ! -f "$package.sigstore.json" ]; then
              echo "::error::$package has no bundle ($package.sigstore.json); nothing is released"
              exit 1
            fi
          done
          api="repos/$REPO"
          # The commit the tag names: nothing when there is no tag, a failure on any
          # other error (a failed read is not "no tag").
          tag_commit() {
            local out
            if out="$(gh api "$api/git/ref/tags/$TAG" --jq .object.sha 2>&1)"; then
              echo "$out"
            elif ! grep -q 'HTTP 404' <<< "$out"; then
              echo "$out" >&2
              return 1
            fi
          }
          # A draft for this version at this commit (tag_name and target_commitish).
          new_draft() {
            gh api "$api/releases" -f tag_name="$TAG" -f target_commitish="$COMMIT" -f name="jobscheduler $VERSION" \
              -f body="js-lease-server, js, js-agent, js-bundle, js-mdm and the Mac host tools $VERSION, the js-agent .deb packages for amd64 and arm64, and the js-lease-server container images (.oci.tar) for amd64 and arm64, with the bundle of each one's provenance. The macOS archives (aarch64-apple-darwin) are added when the beta stage has passed. Verify the files with SHA256SUMS (sha256sum --check --ignore-missing, until the macOS archives are added) and gh attestation verify; see docs/release.md." \
              -F draft=true -F generate_release_notes=true --jq .id
          }
          # `plan` found no tag for this version: one that exists now was made since, and
          # publishing would attach the release to it.
          if [ "$TAG_EXISTS" != true ] && [ -n "$(tag_commit)" ]; then
            echo "::error::the tag $TAG exists now, which the plan did not see"
            exit 1
          fi
          # The release of this version, draft or published (the list shows drafts; a
          # lookup by tag does not).
          ids="$(gh api --paginate "$api/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id")"
          if [ -z "$ids" ]; then
            id="$(new_draft)"
          elif [ "$(wc -l <<< "$ids")" -eq 1 ]; then
            id="$ids"
          else
            echo "::error::more than one release is named $TAG: $ids"
            exit 1
          fi
          draft="$(gh api "$api/releases/$id" --jq .draft)"
          target="$(gh api "$api/releases/$id" --jq .target_commitish)"
          # A file the release has must be this run's, byte for byte, or the files of two
          # builds would be mixed. A file whose upload did not finish is not compared, and
          # neither is a bundle: each signing makes new bytes for the same file, which is
          # compared itself, so an earlier run's bundle of an equal file is kept.
          replace=""
          differing=""
          if [ "$draft" = true ] && [ "$target" != "$COMMIT" ]; then
            replace="it targets $target, not $COMMIT"
          fi
          mkdir ../existing
          assets="$(gh api "$api/releases/$id" --jq '.assets[] | "\(.id) \(.state) \(.name)"')"
          while read -r asset_id state name; do
            [ "$state" = uploaded ] || continue
            case "$name" in
              *.sigstore.json) continue ;;
            esac
            gh api -H "Accept: application/octet-stream" "$api/releases/assets/$asset_id" > "../existing/$asset_id"
            cmp -s -- "$name" "../existing/$asset_id" || differing="$name"
          done <<< "$assets"
          if [ -n "$differing" ]; then
            if [ "$draft" != true ]; then
              echo "::error::the published release $TAG holds a $differing that differs from this run's; a published release is never changed (docs/release.md)"
              exit 1
            fi
            replace="$differing differs from this run's"
          fi
          if [ -n "$replace" ]; then
            # A draft is unpublished and has no tag: delete it and start again.
            echo "::notice::replacing the draft of $TAG: $replace"
            gh api --method DELETE "$api/releases/$id" --silent
            id="$(new_draft)"
          elif [ "$draft" = true ]; then
            while read -r asset_id state name; do
              if [ -n "$asset_id" ] && [ "$state" != uploaded ]; then
                echo "::notice::deleting $name, an upload that did not finish"
                gh api --method DELETE "$api/releases/assets/$asset_id" --silent
              fi
            done <<< "$assets"
          fi
          # Add the files the release lacks, but the macOS archives: `promote-macos` adds those
          # once the beta stage has passed, so the release of the Linux files waits for no Mac.
          present="$(gh api "$api/releases/$id" --jq '.assets[] | select(.state == "uploaded") | .name')"
          for file in ./*.tar.gz ./*.deb ./*.deb.sigstore.json ./*.oci.tar ./*.oci.tar.sigstore.json SHA256SUMS; do
            name="${file#./}"
            case "$name" in
              *-aarch64-apple-darwin.tar.gz) continue ;;
            esac
            if grep -Fxq -- "$name" <<< "$present"; then
              echo "$name is on the release already: kept"
            else
              gh api --method POST -H "Content-Type: application/octet-stream" "https://uploads.github.com/$api/releases/$id/assets?name=$name" --input "$file" --silent
            fi
          done
          # Publishing creates the tag, at the commit, when the release is a draft. A tag
          # made since the check above would be published against; read it once more.
          if [ "$(gh api "$api/releases/$id" --jq .draft)" = true ]; then
            now="$(tag_commit)"
            if [ -n "$now" ] && [ "$now" != "$COMMIT" ]; then
              echo "::error::the tag $TAG appeared and names $now, not $COMMIT; nothing was published (docs/release.md)"
              exit 1
            fi
            # The latest release tag, by version, must be a proper ancestor of this commit
            # (GitHub says "ahead"): a run for an older commit that finished after a newer
            # release would otherwise tag the older commit. No tag yet is the first release.
            latest="$(gh api --paginate "$api/tags" --jq '.[] | select(.name | test("^v[0-9]+[.][0-9]+[.][0-9]+$")) | "\(.name) \(.commit.sha)"' | sort -V | tail -n 1)"
            if [ -n "$latest" ]; then
              read -r latest_tag latest_sha <<< "$latest"
              relation="$(gh api "$api/compare/$latest_sha...$COMMIT" --jq .status)"
              if [ "$relation" != ahead ]; then
                echo "::error::the latest release tag $latest_tag ($latest_sha) is not a proper ancestor of $COMMIT (compare says $relation); nothing was published (docs/release.md)"
                exit 1
              fi
            fi
            gh api --method PATCH "$api/releases/$id" -f tag_name="$TAG" -f target_commitish="$COMMIT" -F draft=false --silent
          fi
          at="$(gh api "$api/commits/$TAG" --jq .sha)"
          if [ "$at" != "$COMMIT" ]; then
            echo "::error::$TAG names $at, not $COMMIT"
            exit 1
          fi

  # The beta stage: the platforms other than Linux x86_64, on the hosted macOS runners, after
  # `artifacts` and in parallel with `publish` and everything after it (none of those needs
  # these jobs, but `pkg-upload` and so `desired` wait for `beta-macos-pkg` to end, pass or
  # fail, since the package goes into the deploy's targets; none waits for
  # `beta-macos-first-install`, which installs the unsigned package `beta-macos-pkg` built).
  # A push to main only; a pull request runs none of them. Each job calls a workflow that holds
  # `contents: read` alone, but `beta-macos-pkg`, whose called workflow has a job that calls
  # macos-farm.yml (for the build of the package on the farm, when the repository variable
  # MACOS_ON_FARM is `true`) and so holds `id-token: write` as well.
  # Only `beta-macos-pkg` is given secrets (`secrets: inherit`), since a called workflow sees
  # none of the caller's repository or organization secrets otherwise: in
  # js-agent-macos-pkg.yml only the `sign` job, which this call asks for (`sign: true`, on a
  # push to main), names them, in the environment `pkg-signing`, and it skips itself with a
  # notice when they are not set. crates/xtask/tests/release_workflow/secrets.rs checks each
  # call against this rule.
  beta-macos:
    needs: [plan, artifacts]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/beta.yml

  beta-macos-pkg:
    needs: [plan, artifacts]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/js-agent-macos-pkg.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      sign: true
    secrets: inherit

  beta-macos-first-install:
    needs: [plan, beta-macos-pkg]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/js-agent-macos-first-install.yml
    with:
      version: ${{ needs.plan.outputs.version }}

  beta-macos-probe:
    needs: [plan, artifacts]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/macos-probe.yml

  # The two-run isolation test of the Mac slot accounts. `promote-macos` does not need it:
  # until the test can pass where it runs, its verdict is reported (`release-red` and
  # `release-green` count it) and holds no archive back.
  beta-macos-isolation:
    needs: [plan, artifacts]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/js-agent-native-isolation.yml

  # Adds the macOS archives to the release `publish` published, when the four beta jobs it
  # needs (all but `beta-macos-isolation`) passed. They are the files artifacts.yml built, attested and verified, and `publish` checked
  # against SHA256SUMS; nothing is rebuilt. An archive the release has already must equal this
  # run's, byte for byte, and is kept; a missing one is uploaded. Like `publish` it runs no
  # repository code, holds `contents: write` alone, and a release run's re-run of the failed
  # jobs continues here.
  promote-macos:
    needs: [plan, publish, beta-macos, beta-macos-pkg, beta-macos-first-install, beta-macos-probe]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Add the macOS archives to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check --strict SHA256SUMS
          api="repos/$REPO"
          id="$(gh api "$api/releases/tags/$TAG" --jq .id)"
          assets="$(gh api "$api/releases/$id" --jq '.assets[] | select(.state == "uploaded") | "\(.id) \(.name)"')"
          mkdir ../existing
          for file in ./*-aarch64-apple-darwin.tar.gz; do
            name="${file#./}"
            asset_id="$(awk -v n="$name" '$2 == n {print $1}' <<< "$assets")"
            if [ -n "$asset_id" ]; then
              gh api -H "Accept: application/octet-stream" "$api/releases/assets/$asset_id" > "../existing/$asset_id"
              if ! cmp -s -- "$name" "../existing/$asset_id"; then
                echo "::error::the release $TAG holds a $name that differs from this run's; a published release is never changed (docs/release.md)"
                exit 1
              fi
              echo "$name is on the release already: kept"
            else
              gh api --method POST -H "Content-Type: application/octet-stream" "https://uploads.github.com/$api/releases/$id/assets?name=$name" --input "$file" --silent
            fi
          done

  # Puts the signed js-agent package of macOS in the package repository, under
  # `pkg/jobscheduler/<version>/` (the one prefix the publish role may write there), once
  # `publish` passed and `beta-macos-pkg` has ended, whatever its result: it is part of the
  # deploy, which waits for no test of the beta stage. hostkeeper-desired.yml then adds the
  # package to the release's targets when its SHA256SUMS is there; the targets of a version are
  # fixed by its first set, so the package has to be there before `desired`, or hosts on macOS
  # never get the version. Like the apt jobs it runs the `xtask` of `deploy-tool` with the role of
  # the environment `apt-publish`, compiles nothing, ends green and writes nothing without the
  # settings of that environment (`channels gate`), and runs for a push to main only. A release
  # whose package was not built or not signed (the `pkg-signing` environment is not set up)
  # uploads nothing, and the release is deployed to the Linux hosts alone. After the upload a
  # last step adds the one entry this repository owns to the repository's descriptor,
  # `hostkeeper-repository.json` (`channels descriptor write`): `formats.macos-pkg.packages.js-agent`
  # is `{"dir": "jobscheduler"}`, which is how a coordinator finds a package that is not in
  # `pkg/<name>/`. Hostkeeper's release creates the descriptor, this job only adds to it with
  # `If-Match`, and every other key stays as it was; the CDN path is invalidated when the
  # variable APT_DISTRIBUTION_ID is set.
  pkg-upload:
    needs: [plan, deploy-tool, publish, beta-macos-pkg]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' && needs.publish.result == 'success' && needs.deploy-tool.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apt-publish
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-tool
          path: tool
      - name: Make the tool executable
        run: chmod +x tool/xtask
      - name: Gate on the settings of the package repository (a job without them does nothing and ends green)
        id: gate
        env:
          APT_PUBLISH_ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
          APT_BUCKET: ${{ vars.APT_BUCKET }}
        run: tool/xtask channels gate --label pkg-upload --output "$GITHUB_OUTPUT" --setting "APT_PUBLISH_ROLE_ARN=${APT_PUBLISH_ROLE_ARN:+set}" --setting "APT_BUCKET=${APT_BUCKET:+set}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: signed
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        continue-on-error: true
        with:
          name: js-agent-macos-pkg-signed
          path: pkg
      - name: Say that the package was not signed
        if: ${{ steps.gate.outputs.enabled == 'true' && steps.signed.outcome != 'success' }}
        run: echo "::notice::no signed macOS package in this run (the pkg-signing environment is not set up), so nothing is uploaded"
      - name: Assume the apt publish role through OIDC
        if: ${{ steps.gate.outputs.enabled == 'true' && steps.signed.outcome == 'success' }}
        env:
          ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
        run: tool/xtask channels assume --role-arn "$ROLE_ARN" --session-name "jobscheduler-pkg-upload-$GITHUB_RUN_ID" --region us-east-1 --env-file "$GITHUB_ENV"
      - name: Upload the package, then its SHA256SUMS (a version already there must be the same bytes)
        if: ${{ steps.gate.outputs.enabled == 'true' && steps.signed.outcome == 'success' }}
        env:
          APT_BUCKET: ${{ vars.APT_BUCKET }}
        run: tool/xtask channels pkg upload --dir pkg --version "$VERSION" --bucket "$APT_BUCKET" --work "$RUNNER_TEMP/pkg-work"
      - name: Map js-agent to pkg/jobscheduler in the repository's descriptor
        if: ${{ steps.gate.outputs.enabled == 'true' && steps.signed.outcome == 'success' }}
        env:
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
        run: tool/xtask channels descriptor write --bucket "$APT_BUCKET" --distribution-id "$APT_DISTRIBUTION_ID" --work "$RUNNER_TEMP/descriptor"

  # The black-box tests of the signed js-agent package of macOS (js-agent-macos-blackbox.yml): its
  # first install (J2), and its update from the release before it with tierstore's mount missing
  # (J4: refused at prepare, before any restart) and then served (J3), on hosted Macs, against the
  # package `pkg-upload` put in the package repository. Nothing waits for it yet: a failure is
  # this run's red job.
  blackbox-macos:
    needs: [plan, pkg-upload]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' && needs.pkg-upload.result == 'success' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/js-agent-macos-blackbox.yml
    with:
      version: ${{ needs.plan.outputs.version }}

  # Builds the `xtask` binary that gamma, cp-deploy-digest, pkg-upload and every apt read, index
  # and write job run. A job of its own so that the build, whose scripts run code from the locked dependency
  # set, is in no job that holds id-token write or the signing key.
  deploy-tool:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' }}
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo build -p xtask --locked --release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-tool
          path: target/release/xtask
          if-no-files-found: error
          retention-days: 1

  # The smoke bundle (packaging/js-smoke-bundle/README.md; docs/release.md, "The smoke bundle"):
  # a darwin bundle of one program that proves a Mac host with one job. Three jobs, so that the
  # one holding the push token checks out and builds nothing. `smoke-bundle-pack` packs the
  # committed tree with the `xtask` binary `deploy-tool` built, and fails unless it gives the
  # digest the recipe (bundle.toml) names. `smoke-bundle-push` pushes that layout to
  # ghcr.io/komira-ai/js/smoke under the recipe's tag with this job's token (`packages: write`):
  # nothing is sent when the tag names the digest already, and a tag that names another is
  # refused, never moved. `smoke-bundle-check` pulls it back by digest with no token, with the
  # agent's registry client, and compares every byte with the tree, so it also fails while the
  # package is not public. None is on the deploy path: only `release-red` and `release-green`
  # wait for them.
  smoke-bundle-pack:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' }}
    needs: [plan, deploy-tool]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-tool
          path: tool
      - run: chmod +x tool/xtask
      - name: Pack the committed tree, held to the recipe's digest
        run: tool/xtask release smoke-bundle pack --tree packaging/js-smoke-bundle/tree --out "$RUNNER_TEMP/smoke-bundle"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-bundle
          path: ${{ runner.temp }}/smoke-bundle
          if-no-files-found: error
          retention-days: 1

  smoke-bundle-push:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' }}
    needs: [plan, deploy-tool, smoke-bundle-pack]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-tool
          path: tool
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smoke-bundle
          path: layout
      - run: chmod +x tool/xtask
      - name: Push the bundle under its tag, or leave it when the tag names it already
        env:
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: tool/xtask release smoke-bundle push --layout layout --user "$ACTOR" --password-file /dev/stdin <<< "$GH_TOKEN"

  smoke-bundle-check:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' }}
    needs: [plan, deploy-tool, smoke-bundle-push]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-tool
          path: tool
      - run: chmod +x tool/xtask
      - name: Pull the published bundle by digest, anonymously, and compare it with the tree
        run: tool/xtask release smoke-bundle check --tree packaging/js-smoke-bundle/tree --scratch "$RUNNER_TEMP/smoke-pulled"

  # The gamma step: tell the update coordinator "desired = this release" for the service
  # js-server (the lease server) and wait until its hosts run it. js-agent is not set here: it is
  # a hostkeeper service, whose desired version hostkeeper-desired.yml sets after this
  # workflow. Off (a notice, and the job passes) while the repository variable
  # JS_COORDINATOR_URL is empty: a fork, or a repository whose operator has not turned the step
  # on. The call carries a fresh OIDC token of this job whose audience is the coordinator; the
  # coordinator's allow-list names this repository, this workflow on main and the service, and
  # refuses anything else.
  #
  # The version is the release's `X.Y.Z` (plan's `version`, not the tag): the text the
  # service reports in its heartbeats, because `--version` of the binary prints it
  # (docs/release.md, "The gamma step").
  gamma:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' }}
    needs: [plan, publish, deploy-tool]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-tool
          path: tool
      # When the coordinator is reachable only on a Tailscale network: join it as an ephemeral
      # node, using this run's OIDC token (workload identity federation), so the job holds no
      # secret. The client id and the audience are the variables TS_CLIENT_ID and TS_AUDIENCE.
      # With either that or JS_COORDINATOR_URL unset the step is skipped.
      - name: Join the coordinator's Tailscale network
        if: ${{ vars.TS_CLIENT_ID != '' && vars.JS_COORDINATOR_URL != '' }}
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
      - name: Set this release as the desired version of js-server and wait for it
        env:
          COORDINATOR_URL: ${{ vars.JS_COORDINATOR_URL }}
          # The CA certificate (public) the coordinator's certificate chains to.
          COORDINATOR_CA: ${{ vars.JS_COORDINATOR_CA }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x tool/xtask
          tool/xtask deploy --url "$COORDINATOR_URL" --ca-pem "$COORDINATOR_CA" --version "$VERSION" --service js-server

  # The control-plane deploy: the release's linux-x86_64 image of js-lease-server to the Docker
  # Swarm service js-server (docs/release.md, "The control-plane deploy"). Both jobs run only while
  # the repository variables CP_DEPLOY_ENDPOINT and CP_DEPLOY_TAILSCALE_TAGS are both not empty:
  # with either unset or empty both are skipped and the release ends as it did without them (the
  # Tailscale join refuses a federated client id without tags, so the call never sends none). The lint
  # (crates/xtask/tests/apt_workflow, `cp_deploy.rs`) holds the two jobs to this shape.
  #
  # cp-deploy-digest  holds no permission. It downloads the files `publish` uploaded (the same
  #          artifacts, so the same bytes) and the `xtask` that `deploy-tool` built, and runs
  #          `release image-digest`: the image held to SHA256SUMS, its bundle present, and the
  #          manifest digest its index.json names, with the release's download addresses of the
  #          image and the bundle.
  # cp-deploy  calls the reusable workflow deploy.yml of komira-ai/docker-swarm-updater, pinned by
  #          the full commit the updater's allow-list names, with `id-token: write` alone: the
  #          called workflow asks GitHub for an OIDC token for every request and runs in this
  #          repository's environment `controlplane` (docs/release.md says how the project owner
  #          sets it up). It sends
  #          the service `js-server`, the release version, that digest and those addresses, and
  #          joins the updater's Tailscale network with the CP_DEPLOY_TAILSCALE_* variables; the
  #          signer is the default, this repository's artifacts.yml on refs/heads/main, which
  #          the updater holds the image's bundle to before it updates the service by digest. The
  #          job ends once the deploy is reported converged and fails
  #          otherwise, after waiting up to 90 minutes: room for the planned hold of the update
  #          while the running server still reads its ended jobs (GET /readyz/sizes answers 503
  #          `teaching`, up to 30 minutes; docs/release.md, "The control-plane deploy") and the
  #          updater's converge timeout (40 minutes). The release stays published whatever it
  #          says, and "Re-run failed jobs" repeats it.
  cp-deploy-digest:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' && vars.CP_DEPLOY_ENDPOINT != '' && vars.CP_DEPLOY_TAILSCALE_TAGS != '' }}
    needs: [plan, publish, deploy-tool]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    outputs:
      digest: ${{ steps.image.outputs.digest }}
      image-url: ${{ steps.image.outputs.image-url }}
      bundle-url: ${{ steps.image.outputs.bundle-url }}
    steps:
