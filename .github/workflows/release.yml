        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: apt-next-3
          path: ${{ runner.temp }}/apt-next
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: release-assets
          path: dist
