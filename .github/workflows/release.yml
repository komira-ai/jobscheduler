    environment: apt-signing
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      signed: ${{ steps.sign.outputs.signed }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-tool
          path: tool
      - name: Make the tool executable
        run: chmod +x tool/xtask
      - name: Gate on the signing key and on the read (a job without them does nothing and ends green)
        id: gate
        env:
          READ_ENABLED: ${{ needs.stable-apt-read-3.outputs.enabled }}
          APT_GPG_FINGERPRINT: ${{ vars.APT_GPG_FINGERPRINT }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: tool/xtask channels gate --label stable-apt-index-3 --output "$GITHUB_OUTPUT" --require "READ_ENABLED=$READ_ENABLED" --setting "APT_GPG_FINGERPRINT=${APT_GPG_FINGERPRINT:+set}" --setting "APT_GPG_PRIVATE_KEY=${APT_GPG_PRIVATE_KEY:+set}" --setting "APT_GPG_PASSPHRASE=${APT_GPG_PASSPHRASE:+set}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: apt-read-3
          path: ${{ runner.temp }}/apt-read
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: release-assets
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: bundles
          path: dist
      - name: The files are exactly the assets of this run, and match SHA256SUMS
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: The amd64 .deb is the one artifacts.yml attested, from main at this commit (from its bundle)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh attestation verify "dist/js-agent_${VERSION}_amd64.deb" --bundle "dist/js-agent_${VERSION}_amd64.deb.sigstore.json" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/artifacts.yml" --source-ref refs/heads/main --source-digest "$COMMIT" --deny-self-hosted-runners
      - name: The arm64 .deb is the one artifacts.yml attested, from main at this commit (from its bundle)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh attestation verify "dist/js-agent_${VERSION}_arm64.deb" --bundle "dist/js-agent_${VERSION}_arm64.deb.sigstore.json" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/artifacts.yml" --source-ref refs/heads/main --source-digest "$COMMIT" --deny-self-hosted-runners
      - name: Promote the entries of this release that testing lists into the index of stable (held to the digests of SHA256SUMS; the entries of every other product are kept)
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          OWNER: ${{ github.repository_owner }}
        run: tool/xtask channels apt promote --testing "$RUNNER_TEMP/apt-read/testing" --stable "$RUNNER_TEMP/apt-read/stable" --out "$RUNNER_TEMP/apt-next" --version "$VERSION" --sums dist/SHA256SUMS --origin "$OWNER" --label "$OWNER" --description "$OWNER packages" --date "$(date +%s)"
      - name: Sign Release with the signing subkey (InRelease and Release.gpg), then remove the key
        id: sign
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_GPG_FINGERPRINT: ${{ vars.APT_GPG_FINGERPRINT }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: tool/xtask channels apt sign --dir "$RUNNER_TEMP/apt-next/dists/stable" --work "$RUNNER_TEMP/apt-sign" --fingerprint "$APT_GPG_FINGERPRINT" --key-env APT_GPG_PRIVATE_KEY --passphrase-env APT_GPG_PASSPHRASE --output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: apt-promoted-3
          path: |
            ${{ runner.temp }}/apt-next/dists
            ${{ runner.temp }}/apt-next/etags.txt
          if-no-files-found: error
          retention-days: 1

  stable-apt-write-3:
    needs: [plan, stable-apt-read-3, stable-apt-index-3, deploy-tool]
    if: ${{ !cancelled() && !failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true' && needs.stable-apt-read-3.result == 'success' && needs.stable-apt-index-3.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: apt-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      conflict: ${{ steps.put.outputs.conflict }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deploy-tool
          path: tool
      - name: Make the tool executable
        run: chmod +x tool/xtask
      - name: Gate on the settings of the apt repository and on the signed index (a job without them does nothing and ends green)
        id: gate
        env:
          READ_ENABLED: ${{ needs.stable-apt-read-3.outputs.enabled }}
          INDEX_SIGNED: ${{ needs.stable-apt-index-3.outputs.signed }}
          APT_PUBLISH_ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: tool/xtask channels gate --label stable-apt-write-3 --output "$GITHUB_OUTPUT" --require "READ_ENABLED=$READ_ENABLED" --require "INDEX_SIGNED=$INDEX_SIGNED" --setting "APT_PUBLISH_ROLE_ARN=${APT_PUBLISH_ROLE_ARN:+set}" --setting "APT_BUCKET=${APT_BUCKET:+set}" --setting "APT_DISTRIBUTION_ID=${APT_DISTRIBUTION_ID:+set}" --setting "APT_HOSTNAME=${APT_HOSTNAME:+set}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        with:
          name: apt-promoted-3
          path: ${{ runner.temp }}/apt-next
      - name: Assume the apt publish role through OIDC
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          ROLE_ARN: ${{ vars.APT_PUBLISH_ROLE_ARN }}
        run: tool/xtask channels assume --role-arn "$ROLE_ARN" --session-name "jobscheduler-stable-apt-write-3-$GITHUB_RUN_ID" --region us-east-1 --env-file "$GITHUB_ENV"
      - name: Write the signed index of stable with If-Match on the ETags that were read (the packages are in the pool already), then invalidate /apt/dists/*
        id: put
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        env:
          APT_BUCKET: ${{ vars.APT_BUCKET }}
          APT_DISTRIBUTION_ID: ${{ vars.APT_DISTRIBUTION_ID }}
          APT_HOSTNAME: ${{ vars.APT_HOSTNAME }}
        run: tool/xtask channels apt write --suite stable --bucket "$APT_BUCKET" --distribution-id "$APT_DISTRIBUTION_ID" --hostname "$APT_HOSTNAME" --next "$RUNNER_TEMP/apt-next" --no-pool --last --output "$GITHUB_OUTPUT"
