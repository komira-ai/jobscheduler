# The launch time of a `crun` job through the agent's own `CrunRuntime`, with egress mode none
# and with an allow-list wired (crates/js-agent/tests/bin/launch_measure.rs, the program
# `js-launch-measure`): N samples of each, alternating, after W discarded ones; the result
# table goes into the job summary. A measurement, not a test: it asserts no duration and gates
# nothing. Manual dispatch only; no pull request or push runs it. The measured numbers and how
# they were taken are recorded in docs/design/agent-egress.md ("Measured launch time").
#
# The runner is set up as the `agent-egress` job of ci.yml sets it up (the same packages, the
# `js-job` user and its subordinate ranges, Docker stopped and its forward policy opened), so
# the wired path is the one the egress tests exercise. The program is built with the release
# profile, as the agent ships, and run as root.
name: js-launch-measure

on:
  # TEMPORARY, removed before merge: a workflow only on a branch cannot be dispatched (the full run).
  push:
    branches: [task/js-measure-launch]
    paths: ['.github/workflows/js-launch-measure.yml']
  workflow_dispatch:
    inputs:
      ref:
        description: The commit, branch or tag to measure (empty measures the dispatching ref)
        required: false
        default: ''
        type: string
      runs:
        description: Measured samples per variant
        required: false
        default: 50
        type: number
      warmup:
        description: Samples per variant taken first and discarded
        required: false
        default: 5
        type: number

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - run: rustup toolchain install
      - name: Install crun, uidmap, busybox and the network tools, and make the job user
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends crun uidmap busybox-static apparmor nftables iproute2 util-linux
          sudo useradd --create-home --shell /usr/sbin/nologin js-job
          grep -q '^js-job:' /etc/subuid || echo 'js-job:300000:65536' | sudo tee -a /etc/subuid
          grep -q '^js-job:' /etc/subgid || echo 'js-job:300000:65536' | sudo tee -a /etc/subgid
          echo "JS_B_CRUN=$(command -v crun)" >> "$GITHUB_ENV"
          echo "JS_B_BUSYBOX=$(command -v busybox)" >> "$GITHUB_ENV"
          echo "JS_B_UID=$(id -u js-job)" >> "$GITHUB_ENV"
          echo "JS_B_GID=$(id -g js-job)" >> "$GITHUB_ENV"
      - name: Take Docker's firewall out of the way
        run: |
          sudo systemctl stop docker.socket docker.service containerd.service || true
          sudo iptables -P FORWARD ACCEPT || true
          sudo ip6tables -P FORWARD ACCEPT || true
      - name: Record the runner facts
        run: |
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          echo "nproc=$(nproc)"
          uname -r
          crun --version
      - name: Build the program as the runner user
        run: cargo build -p js-agent --bin js-launch-measure --release --locked
      # Below /tmp: the backend refuses a scratch directory with an ancestor the job user
      # cannot search, and /tmp is the directory the egress tests use for the same reason.
      - name: Measure as root
        env:
          RUNS: ${{ inputs.runs || 50 }}
          WARMUP: ${{ inputs.warmup || 5 }}
        run: sudo -E env "PATH=$PATH" target/release/js-launch-measure --runs "$RUNS" --warmup "$WARMUP" --image-name ubuntu-24.04 --crun "$JS_B_CRUN" --busybox "$JS_B_BUSYBOX" --job-user "$JS_B_UID:$JS_B_GID" --work-dir /tmp/js-launch-measure --summary-file "$GITHUB_STEP_SUMMARY"
