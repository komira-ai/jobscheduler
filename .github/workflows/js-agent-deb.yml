# The js-agent .deb as a pull request check (packaging/js-agent/deb): the musl x86_64 agent is
# built the way the release builds it (`cargo build --locked --release --target
# x86_64-unknown-linux-musl -p js-agent --bin js-agent`) and packaged with `cargo xtask release
# deb`, which refuses a binary that does not print the version and lists in the package exactly
# what packaging/js-agent/deb holds. `dpkg-deb --info` and `dpkg-deb --contents` show the control
# file and the files, and the package is kept as a workflow artifact for seven days. A change that
# breaks the musl release binary or the package is red on the pull request and not on the release
# push.
#
# A pull request that changes the package, any crate (the agent's dependency closure is most of
# the workspace: js-agent links js-contain, whose build script builds a static init for the musl
# target), the toolchain or the lock file runs it, as version 0.0.0. It publishes nothing, signs
# nothing and attests nothing: the release builds, attests and verifies the .debs in
# artifacts.yml, and release.yml puts them in the apt repository. Nothing here holds a write
# scope.
# crates/xtask/tests/js_agent_package.rs pins these rules.
name: js-agent-deb

on:
  pull_request:
    paths:
      - '.github/workflows/js-agent-deb.yml'
      - '.github/debs/musl-tools.toml'
      - 'packaging/js-agent/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'LICENSE'

permissions: {}

concurrency:
  group: js-agent-deb-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  VERSION: 0.0.0
  TARGET: x86_64-unknown-linux-musl

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # musl-tools (the musl-gcc ring's C code needs), pinned by version and SHA-256 in
      # .github/debs/musl-tools.toml: restored from the actions cache, or fetched from the
      # pinned mirrors when the cache missed, checked either way, and installed with dpkg. No
      # apt-get, so an outage of the Ubuntu archive does not stop a run whose cache hit.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: musl-debs
        with:
          path: ${{ runner.temp }}/debs/musl-tools
          key: debs-musl-tools-${{ runner.arch }}-${{ hashFiles('.github/debs/musl-tools.toml') }}
      - name: Fetch the pinned musl-tools packages
        run: cargo xtask debs --pins .github/debs/musl-tools.toml --dir "$RUNNER_TEMP/debs/musl-tools"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.musl-debs.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/debs/musl-tools
          key: ${{ steps.musl-debs.outputs.cache-primary-key }}
      - name: Install musl tools
        run: sudo dpkg --install "$RUNNER_TEMP"/debs/musl-tools/*.deb
      - run: rustup target add "$TARGET"
      # The version goes into this checkout only, so the binary prints it.
      - name: Stamp the version
        run: cargo xtask release stamp --to "$VERSION"
      - name: Build js-agent
        run: cargo build --locked --release --target "$TARGET" -p js-agent --bin js-agent
      - name: Package js-agent as a .deb
        run: cargo xtask release deb --binary "target/$TARGET/release/js-agent" --version "$VERSION" --platform linux-x86_64 --out dist
      - name: Show the control file of the .deb
        run: dpkg-deb --info "dist/js-agent_${VERSION}_amd64.deb"
      - name: List the files of the .deb
        run: dpkg-deb --contents "dist/js-agent_${VERSION}_amd64.deb"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-agent-deb
          path: dist/js-agent_${{ env.VERSION }}_amd64.deb
          if-no-files-found: error
          retention-days: 7
