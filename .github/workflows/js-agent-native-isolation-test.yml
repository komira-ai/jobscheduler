# Builds the js-agent two-run isolation test binary (`--test native_isolation`) for
# aarch64-apple-darwin and uploads it, WITHOUT running it. The test
# (crates/js-agent/tests/native_isolation/, the Mac part `#[ignore]`) opens the agent's account
# pool with one slot and runs through the agent's supervisor (the js-agent binary shipped beside
# the test binary), has run A leave things behind as its account (files, a process, a keychain item, a defaults key, a launchd
# agent, System V and POSIX shared memory (which the profile refuses), semaphores, a message queue), ends the run as the
# agent does (its account retired), and has run B, a fresh account on the same uid, look for them. It needs root, makes a user and
# changes the machine: an operator runs it once on a provisioned Mac that has no other use.
# Download the artifact, check SHA256SUMS, copy both binaries into one directory, chmod +x them
# (the artifact zip drops the mode) and, as root, run
#   JS_NATIVE_ISO_ROOT=<a new root-owned 0755 directory every user can search down to> \
#     JS_NATIVE_ISO_UID=<a uid from 501 to 60000, outside 600-799, nothing uses> \
#     ./native_isolation --ignored --test-threads=1 --nocapture
# (libtest flags come first.)
#
# Manual runs only, for an operator's own Mac: every release runs the test itself, on a hosted Mac,
# in beta.yml's job `isolation` (through `cargo xtask mac-root-tests --only native_isolation`),
# and a failure there holds back release.yml's `promote-macos`. It publishes nothing: the binary
# is a workflow artifact for seven days.
name: js-agent-native-isolation-test

on:
  # No inputs: it builds exactly the commit it is dispatched on.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TARGET: aarch64-apple-darwin
  # The oldest macOS the binaries must run on; a newer image must not raise it.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: rustup target add "$TARGET"
      - name: Build the test binary without running it
        run: cargo test -p js-agent --test native_isolation --no-run --locked --target "$TARGET" --message-format=json > build.json
      - name: Stage the test binary and the js-agent it starts, with their sums
        run: cargo xtask mac-test-artifact --test native_isolation --target "$TARGET" --build-json build.json --out dist --commit "$GITHUB_SHA" --summary "$GITHUB_STEP_SUMMARY" --github-env "$GITHUB_ENV"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-agent-native-isolation-test-${{ env.SHORT }}
          path: |
            dist/native_isolation
            dist/js-agent
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
