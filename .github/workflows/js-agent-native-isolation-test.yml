# Builds the js-agent two-run isolation test binary (`--test native_isolation`) for
# aarch64-apple-darwin and uploads it, WITHOUT running it. The test
# (crates/js-agent/tests/native_isolation/, the Mac part `#[ignore]`) serves the real
# `js-mac-session` helper from the test process with a range of one uid, has run A leave
# things behind as that user (files, a process, a keychain item, a defaults key, a launchd
# agent, System V and POSIX shared memory, semaphores, a message queue), ends the run as the
# agent does, and has run B on the same uid look for them. It needs root, makes a user and
# changes the machine: an operator runs it once on a provisioned Mac that has no other use.
# Download the artifact, check SHA256SUMS, copy the binary over, chmod +x it (the artifact zip
# drops the mode) and, as root, run
#   JS_NATIVE_ISO_ROOT=<a new root-owned 0755 directory every user can search down to> \
#     JS_NATIVE_ISO_UID=<a uid from 500 to 60000 nothing uses> \
#     ./native_isolation --ignored --test-threads=1 --nocapture
# (libtest flags come first.)
#
# Manual runs only. It publishes nothing: the binary is a workflow artifact for seven days.
name: js-agent-native-isolation-test

on:
  # No inputs: it builds exactly the commit it is dispatched on.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TARGET: aarch64-apple-darwin
  # The oldest macOS the binaries must run on; a newer image must not raise it.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: rustup target add "$TARGET"
      - name: Build the test binary without running it
        run: |
          set -euo pipefail
          cargo test -p js-agent --test native_isolation --no-run --locked --target "$TARGET" --message-format=json > build.json
      - name: Pick the binary and check what it is
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          short="${commit:0:12}"
          # The test executable of the `native_isolation` integration test: a compiler-artifact
          # message with profile.test and that target's name and kind, never a guess by file name.
          exe="$(jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .target.name == "native_isolation" and (.target.kind | index("test")) != null and .executable != null) | .executable' build.json)"
          if [ "$(printf '%s\n' "$exe" | grep -c .)" != 1 ]; then
            echo "::error::expected exactly one native_isolation test executable, got: $exe"
            exit 1
          fi
          mkdir dist
          cp "$exe" dist/native_isolation
          description="$(file dist/native_isolation)"
          echo "$description"
          case "$description" in
            *"Mach-O 64-bit executable arm64"*) ;;
            *)
              echo "::error::dist/native_isolation is not an arm64 Mach-O executable"
              exit 1
              ;;
          esac
          (cd dist && shasum -a 256 native_isolation > SHA256SUMS)
          sha="$(cut -d ' ' -f 1 dist/SHA256SUMS)"
          {
            echo "### js-agent native isolation test binary"
            echo
            echo "- commit: \`$commit\`"
            echo "- target: \`$TARGET\`"
            echo "- sha256: \`$sha\`"
            echo "- file: $description"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SHORT=$short" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-agent-native-isolation-test-${{ env.SHORT }}
          path: |
            dist/native_isolation
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
