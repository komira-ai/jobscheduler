# The first install of the js-agent installer package on a Mac, run end to end on a hosted Apple
# silicon runner: the integration test `mac_first_install` of crates/js-agent (macOS only,
# `#[ignore]`d, run as root) installs the unsigned package this run's package workflow built,
# the way hostkeeper does, through hostkeeper's own installer and step runner, and then runs the
# update hook's prepare, cutover, verify and cleanup as root with launchd loading the jobs. The
# first install of the package was never run end to end before it reached a Mac; this is that run.
#
# What it stands in for: the lease server runs in the test process, the host certificate is
# minted by a test CA, the package is unsigned and the answer to the signature check is the
# test's own.
#
# It is called, never started by itself or by a pull request: by release.yml's
# `beta-macos-first-install` on a push to main (after `beta-macos-pkg`, whose unsigned package
# it installs), and by js-agent-macos-pkg.yml's `first-install` job on a manual run, so the
# package of a branch can be built and tried before it merges. The deploy never waits for it:
# only `promote-macos`, which adds the macOS archives to the release, needs it.
#
# One job, no secret, no environment, `contents: read` alone. The test is built as the runner's
# user, then run as root through cargo's target runner, so nothing is built as root. No command
# expands an expression: a script reads its environment. The version, which goes into the file
# name, is checked as MAJOR.MINOR.PATCH before anything uses it.
# crates/xtask/tests/macos_first_install_workflow.rs pins these rules.
name: js-agent-macos-first-install

on:
  workflow_call:
    inputs:
      version:
        description: The package version, MAJOR.MINOR.PATCH
        required: false
        type: string
        default: 0.0.0

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  VERSION: ${{ inputs.version || '0.0.0' }}
  # The oldest macOS the programs must run on, as in the release build.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  first-install:
    name: js-agent-macos-first-install
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check the version
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::the version must be MAJOR.MINOR.PATCH"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: js-agent-macos-pkg-unsigned
          path: dist
      - name: The package is the one that was summed
        working-directory: dist
        run: /usr/bin/shasum -a 256 --check SHA256SUMS
      - run: rustup toolchain install
      - name: Build the test as the runner's user
        run: cargo test --locked -p js-agent --test mac_first_install --no-run
      - name: Install the package for the first time, as root
        env:
          CARGO_TARGET_AARCH64_APPLE_DARWIN_RUNNER: sudo --preserve-env=JS_FIRST_INSTALL_PKG
        run: JS_FIRST_INSTALL_PKG="$PWD/dist/js-agent-$VERSION-macos-arm64.pkg" cargo test --locked -p js-agent --test mac_first_install -- --ignored --nocapture --test-threads=1
