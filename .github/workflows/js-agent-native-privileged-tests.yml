# Builds the js-agent native-runtime privileged integration test binary (`--test
# native_privileged`) for aarch64-apple-darwin and uploads it, WITHOUT running it. These
# tests (crates/js-agent/tests/native_privileged.rs, all `#[ignore]`) open the agent's account
# pool on the Mac, run programs as its accounts through the agent's supervisor (the js-agent
# binary shipped beside the test binary) under the Seatbelt profile, and retire the accounts,
# which needs root and changes the machine: an operator runs them once on a provisioned Mac that
# has no other use. Download the artifact, check SHA256SUMS, copy both binaries into one
# directory, chmod +x them (the artifact zip drops the mode) and, as root, run
#   JS_NATIVE_PRIV_ROOT=<a new root-owned 0755 directory every user can search down to> \
#     ./native_privileged --ignored --test-threads=1 --nocapture
# (libtest flags come first.) The pool's slots are the uids 4300 to 4309.
# `cargo xtask mac-root-tests` builds and runs it, with the other Mac root tests, on a Mac.
# The binary also holds the real-VM test of the VM runtime (tests/native_privileged/vm.rs), which
# needs `js-vmm` (signed) and `vm-store/base` (a base image) in that directory; it boots one VM.
#
# Manual runs only. It publishes nothing: the binary is a workflow artifact for seven days.
name: js-agent-native-privileged-tests

on:
  # No inputs: it builds exactly the commit it is dispatched on.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TARGET: aarch64-apple-darwin
  # The oldest macOS the binaries must run on; a newer image must not raise it.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: rustup target add "$TARGET"
      - name: Build the test binary without running it
        run: cargo test -p js-agent --test native_privileged --no-run --locked --target "$TARGET" --message-format=json > build.json
      - name: Stage the test binary and the js-agent it starts, with their sums
        run: cargo xtask mac-test-artifact --test native_privileged --target "$TARGET" --build-json build.json --out dist --commit "$GITHUB_SHA" --summary "$GITHUB_STEP_SUMMARY" --github-env "$GITHUB_ENV"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-agent-native-privileged-tests-${{ env.SHORT }}
          path: |
            dist/native_privileged
            dist/js-agent
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
