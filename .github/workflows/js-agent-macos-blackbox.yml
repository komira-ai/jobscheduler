# The black-box tests of the js-agent macOS package (docs/release.md, "The Mac package's black-box
# tests"), each on a hosted Apple silicon runner of its own, as root: the program
# `js-mac-package-blackbox` of crates/js-mac-first-install (tests/bin/mac_package_blackbox.rs)
# installs the package the way hostkeeper's daemon does, with flags of the farm's Mac shape
# (tests/mac_package_blackbox/farm-mac-flags), beside a stand-in of tierstore's mount, account and
# directories, joins it to a lease server of this repository in its own process, and drives the
# agent only from outside: its launchd job, the lease server and the jobs it runs.
#
# - `first-install` is J2: the package's first install; a session within 60 s of the agent's start
#   and a job that ends 0.
# - `update` is J4 then J3 on one Mac: the package of the newest release below it that has one is
#   installed first; with tierstore's mount missing the update is refused at prepare (deferred
#   `host_setup_missing`) with no restart, the old agent keeping its session and its running job
#   ending 0; with the mount served again the update succeeds, the new agent in a session within
#   120 s of the order's start, and a job ends 0.
#
# The packages are the published bytes: `cargo xtask release macos-pkg` downloads them from the
# package repository and holds each to its SHA256SUMS (crates/xtask/src/release/macos_pkg.rs). A
# manual run on a branch may instead test the unsigned package of a js-agent-macos-pkg.yml run
# (`gh workflow run js-agent-macos-blackbox.yml --ref <branch> -f version=X -f package-run=<id>`),
# whose signature check the program answers as the first-install test does; the package it
# updates from is still the release's.
#
# What a hosted Mac cannot show: whether a farm Mac's hostkeeper lists the release's signer (here
# the signer list names the leaf the Mac's own `pkgutil --check-signature` reports), tierstore
# itself (its mount is a disk image, its socket is never served), the farm's lease server and
# network, a user's own launchd session, and the farm's hardware.
#
# It is called, never started by a pull request: by release.yml's `blackbox-macos` on a push to
# main, after `pkg-upload` has put the release's signed package in the package repository, and by
# hand. Nothing waits for it yet. The program is built as the runner's user and run as root
# through sudo; every step is one command, and no command expands an expression.
name: js-agent-macos-blackbox

on:
  workflow_call:
    inputs:
      version:
        description: The package version, MAJOR.MINOR.PATCH
        required: true
        type: string
      package-run:
        description: Test the unsigned package of this js-agent-macos-pkg.yml run instead of the published one
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: The package version, MAJOR.MINOR.PATCH
        required: true
        type: string
      package-run:
        description: Test the unsigned package of this js-agent-macos-pkg.yml run instead of the published one
        required: false
        type: string
        default: ""

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  VERSION: ${{ inputs.version }}
  PACKAGE_RUN: ${{ inputs.package-run || '' }}

jobs:
  first-install:
    name: js-agent-macos-blackbox-first-install
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Download the published package, held to its SHA256SUMS
        if: ${{ env.PACKAGE_RUN == '' }}
        run: cargo xtask release macos-pkg --version "$VERSION" --out dist --output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ env.PACKAGE_RUN != '' }}
        with:
          name: js-agent-macos-pkg-unsigned
          path: dist
          run-id: ${{ env.PACKAGE_RUN }}
          github-token: ${{ github.token }}
      - name: The run's package is the one that was summed
        if: ${{ env.PACKAGE_RUN != '' }}
        working-directory: dist
        run: /usr/bin/shasum -a 256 --check SHA256SUMS
      - name: Build the program as the runner's user
        run: cargo build --locked -p js-mac-first-install --bin js-mac-package-blackbox
      - name: "J2: the first install, as root"
        if: ${{ env.PACKAGE_RUN == '' }}
        run: sudo target/debug/js-mac-package-blackbox first-install --scratch "$RUNNER_TEMP/blackbox" --pkg "$PWD/dist/js-agent-$VERSION-macos-arm64.pkg" --version "$VERSION"
      - name: "J2: the first install of the run's unsigned package, as root"
        if: ${{ env.PACKAGE_RUN != '' }}
        run: sudo target/debug/js-mac-package-blackbox first-install --scratch "$RUNNER_TEMP/blackbox" --pkg "$PWD/dist/js-agent-$VERSION-macos-arm64.pkg" --version "$VERSION" --unsigned

  update:
    name: js-agent-macos-blackbox-update
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      # Every tag: the release below the version is found among them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - name: Download the published package, held to its SHA256SUMS
        if: ${{ env.PACKAGE_RUN == '' }}
        run: cargo xtask release macos-pkg --version "$VERSION" --out dist --output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ env.PACKAGE_RUN != '' }}
        with:
          name: js-agent-macos-pkg-unsigned
          path: dist
          run-id: ${{ env.PACKAGE_RUN }}
          github-token: ${{ github.token }}
      - name: The run's package is the one that was summed
        if: ${{ env.PACKAGE_RUN != '' }}
        working-directory: dist
        run: /usr/bin/shasum -a 256 --check SHA256SUMS
      - name: List the repository's release tags
        run: git tag --list 'v*' --merged HEAD > "$RUNNER_TEMP/tags"
      - name: Download the package of the newest release below it that has one
        id: previous
        run: cargo xtask release macos-pkg --below "$VERSION" --tags "$RUNNER_TEMP/tags" --out previous --output "$GITHUB_OUTPUT"
      - name: Build the program as the runner's user
        run: cargo build --locked -p js-mac-first-install --bin js-mac-package-blackbox
      - name: "J4 then J3: the update with tierstore's mount missing, then served, as root"
        if: ${{ env.PACKAGE_RUN == '' }}
        env:
          PREVIOUS: ${{ steps.previous.outputs.version }}
        run: sudo target/debug/js-mac-package-blackbox update --scratch "$RUNNER_TEMP/blackbox" --pkg "$PWD/dist/js-agent-$VERSION-macos-arm64.pkg" --version "$VERSION" --previous-pkg "$PWD/previous/js-agent-$PREVIOUS-macos-arm64.pkg" --previous-version "$PREVIOUS"
      - name: "J4 then J3: the update to the run's unsigned package, as root"
        if: ${{ env.PACKAGE_RUN != '' }}
        env:
          PREVIOUS: ${{ steps.previous.outputs.version }}
        run: sudo target/debug/js-mac-package-blackbox update --scratch "$RUNNER_TEMP/blackbox" --pkg "$PWD/dist/js-agent-$VERSION-macos-arm64.pkg" --version "$VERSION" --unsigned --previous-pkg "$PWD/previous/js-agent-$PREVIOUS-macos-arm64.pkg" --previous-version "$PREVIOUS"
