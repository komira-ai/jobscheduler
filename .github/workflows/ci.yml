# CI for pull requests and main. GitHub-hosted runners only, actions pinned to commit
# SHAs, and no permission beyond reading the repository.
#
# The Cargo cache (registry, git checkouts and target) is keyed on the runner, the job,
# Cargo.lock and rust-toolchain.toml. Every job restores it; only a push to main saves
# it, and only when the exact key missed, so a pull request never writes the cache.
#
# The `lint` job also builds and tests the jobscheduler.dev website (site/): TypeScript
# compiled by tsc, a build program that prerenders the pages, and node:test tests over the
# built tree (golden output, links, the Content-Security-Policy rules, the pinned theme, a
# public-repo scan, and the statements of the pages held to the code and documents they rest
# on). Those steps run on a push to main, and on a pull request that changes a path listed
# in site/ci-paths (the site, and the files its statements are held to; the claims test reads
# them), or whose diff cannot be computed. The Node version is exactly the one in
# site/.node-version. The network is touched by `npm ci` alone, with install scripts off.
# The site steps build and test; they hold no cloud access and put nothing anywhere.
#
# Every pull request runs the `macos` job on GitHub's hosted macos-15 runner (the workspace's
# tests on Apple silicon, then the release's macOS build), and js-agent-macos-pkg.yml builds the
# macOS package for it; both are to be required checks of main
# (tools/held/required-checks/require_macos_checks.sh). No macOS job that runs on a pull
# request names a secret or holds a write permission, and a newer push to a pull request cancels
# its older macOS runs (crates/xtask/tests/pr_macos_jobs holds every workflow to that).
name: ci

on:
  pull_request:
    # No `labeled` type: a label-only run would show skipped checks under the names of the
    # real run's checks and could hide a red run.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions: {}

# One run per workflow and pull request: a new push to a PR cancels that PR's queued or
# running run (macOS runners are scarce). A push to main gets a group of its own (the run
# id), so it is never cancelled and never replaced while pending: GitHub keeps only one
# pending run per group, and the release runs only after a main run succeeds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Incremental artifacts only bloat a cached target directory.
  CARGO_INCREMENTAL: 0

jobs:
  # Lint also carries the site steps: it is the shorter job (it runs no tests, so the Rust
  # tests in `test` are not delayed), and the decision is made in a step of the job itself,
  # with the history the diff needs, rather than waiting on the `changes` job, which would
  # hold back fmt and clippy.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # This builds the live conformance targets of the three machine providers, which no other
      # job builds and nothing in CI runs; they spend money only when a person runs them.
      - run: cargo clippy --locked -p js-provider-ec2 -p js-provider-gce -p js-provider-lambdalabs --features js-provider-ec2/live,js-provider-gce/live,js-provider-lambdalabs/live --all-targets -- -D warnings
      # The decoders' cargo-fuzz packages are packages of their own, outside the workspace,
      # so the steps above do not build them: these check that each still compiles against
      # its crate. No fuzzing runs here; a campaign is `cargo +nightly fuzz run <target>`.
      - run: cargo check --locked --manifest-path crates/js-agent-wire/fuzz/Cargo.toml --target-dir target/fuzz-check
      - run: cargo check --locked --manifest-path crates/js-api-gateway/fuzz/Cargo.toml --target-dir target/fuzz-check
      - run: cargo check --locked --manifest-path crates/js-jobs/fuzz/Cargo.toml --target-dir target/fuzz-check
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      # Whether the site steps run: always on a push to main; on a pull request when a
      # changed file matches site/ci-paths (a directory prefix ending in '/', or an exact
      # file). Fail closed: a diff or a list that cannot be read runs them. The decision is
      # crates/xtask/src/site_changed.rs.
      - id: site
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: cargo xtask site-changed --event "$EVENT" --base "$BASE" --paths site/ci-paths --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.site.outputs.run == 'true' }}
        with:
          node-version-file: site/.node-version
      - if: ${{ steps.site.outputs.run == 'true' }}
        working-directory: site
        run: npm ci --ignore-scripts --no-audit --no-fund
      - if: ${{ steps.site.outputs.run == 'true' }}
        working-directory: site
        run: npm run typecheck
      - if: ${{ steps.site.outputs.run == 'true' }}
        working-directory: site
        run: npm test
      - if: ${{ steps.site.outputs.run == 'true' }}
        working-directory: site
        run: npm run build

  # js-state's Postgres tests run here too (a test that needs the server fails, and does
  # not skip, when KBF_TEST_POSTGRES_URL is unset), against a service container pinned by
  # digest.
  #
  # So do the live-log tests against an S3-compatible store with STS (js_testkit::s3): the
  # store client and the STS minter (js-logstore's s3_compat), the agent's uploader
  # (js-agent's live_logs::s3_compat and crun_stand_in's s3_compat) and GetLogs over what the
  # uploader put (js-lease-server's logs_round_trip). They are #[ignore]d, so the workspace
  # run skips them; the step after it runs them, and only them, with --ignored. The store is
  # MinIO as Bitnami packages it: it starts from its environment alone (a service container
  # takes no command), creates the bucket, and checks the region of every signature against
  # its own. Its root password is a throwaway for this container, which lives only for this
  # job; its port on the runner is whichever Docker gave, read from the job's context. GitHub
  # waits for the health check (the store's own liveness endpoint) before the first step, and
  # fails the job when it has not passed after 30 tries.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
        env:
          POSTGRES_PASSWORD: js-ci-throwaway
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
      s3:
        image: docker.io/bitnamilegacy/minio@sha256:a340369228a43597f0540c3f5f7b76ed3324bb38c1d0ecf272f96fc7bf193753
        env:
          MINIO_ROOT_USER: jsciroot
          MINIO_ROOT_PASSWORD: js-ci-throwaway
          MINIO_SITE_REGION: js-test-1
          MINIO_DEFAULT_BUCKETS: js-live-logs
        ports:
          - 9000
        options: --health-cmd "curl -fsS http://127.0.0.1:9000/minio/health/live" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      KBF_TEST_POSTGRES_URL: postgres://postgres:js-ci-throwaway@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      # --no-fail-fast: a red run names every failing test in every crate, not only those of
      # the first test binary that fails, so the tests commit of a pull request shows each
      # of its reds.
      - run: cargo test --workspace --locked --no-fail-fast
      # `--tests` builds what the run above built, so nothing is compiled again; the filters
      # pick the live-log tests against the store out of every test binary.
      - name: Live logs against the S3-compatible store
        if: ${{ !cancelled() }}
        env:
          JS_TEST_S3_URL: http://jsciroot:js-ci-throwaway@127.0.0.1:${{ job.services.s3.ports['9000'] }}/js-live-logs
          JS_TEST_S3_REGION: js-test-1
        run: 'cargo test --workspace --locked --no-fail-fast --tests -- --ignored s3_compat:: logs_round_trip::'
      # The v1 job path over the real server binary, an agent and `js` on loopback, on a
      # SQLite and a Postgres store (js-lease-server's v1_acceptance). The workspace run
      # above runs it too; this step names it, so a break of the path between the binaries
      # is a red step of its own. Nothing is compiled again.
      - name: v1 acceptance over the server binary, an agent and js
        if: ${{ !cancelled() }}
        run: cargo test --locked -p js-lease-server --test v1_acceptance
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The workspace builds and passes its tests on Apple silicon, on every pull request and every
  # push to main, but for the three crates that are Linux code and are not built for macOS:
  # js-contain (the crun runtime, cgroups), js-host-step (the Linux host steps) and js-mdm
  # (which applies its rendering to a Linux host through js-host-step; the rendering,
  # js-mdm-core, is tested here). Tests that
  # need Linux (pidfds, /proc, crun) are cfg-gated, not removed; the coverage and the Postgres
  # tests stay on Linux. js-mac-pool's Seatbelt profile builder also runs its generated profile
  # under the real `sandbox-exec` here (tests/runner.rs), and xtask's macOS package tests build
  # a package with Apple's pkgbuild.
  #
  # On a pull request the job then makes, from the pull request's commit, what the release's
  # macOS leg makes after a merge (release.yml, `build` for aarch64-apple-darwin): the release
  # build of each binary of that leg, its archive directory (`release stage`) and the
  # hostkeeper package of js-agent for macos-arm64 (`release hostkeeper-package`), with the
  # leg's checks (each binary's minos is at most the pinned macOS and its --version prints
  # the version). The version is the workspace's, not stamped, and nothing is uploaded. A push
  # to main skips those steps: the release's own leg makes the same files from that commit.
  # crates/xtask/tests/pr_macos_jobs pins that the step builds the leg's binaries.
  macos:
    runs-on: macos-15
    # Pushes to main share one group with cancel-in-progress false: one run executes, one
    # waits, and a newer waiting run replaces an older one, so the hosted macOS pool never
    # holds a backlog of main runs (the newest main commit's result covers the older ones;
    # main's run is the fix-forward backstop). A pull request gets a group of its own per run,
    # and the workflow's group above cancels it when the pull request is pushed again.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('ci-macos-{0}', github.run_id) || 'ci-macos-main' }}
      cancel-in-progress: false
    # The workspace's tests take about an hour on the hosted runner (the first full run: the
    # build 10 minutes, the tests 47 minutes before one test hung).
    timeout-minutes: 120
    env:
      # The oldest macOS the binaries must run on; a newer image must not raise it
      # (the step after the build reads each binary's minos and fails above this).
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      # The tests' host, prepared as the Linux jobs prepare theirs. A second loopback address:
      # Linux routes all of 127.0.0.0/8 to the loopback interface, macOS answers on 127.0.0.1
      # alone, and the lease server's tests put a second listener on 127.0.0.2. And a Postgres
      # server for the tests that need one (macOS runners have no service containers), from
      # Homebrew as the Linux jobs take theirs from the distribution: a data directory of this
      # job, local connections trusted and the socket in the job's temporary directory, as the
      # `test` job's service container; its URL is the one that job sets. A test that needs
      # the server fails, and does not skip, when it is not there.
      - name: Add the loopback address 127.0.0.2
        run: sudo ifconfig lo0 alias 127.0.0.2 up
      - name: Install Postgres from Homebrew
        run: brew install --quiet postgresql@17
      # crates/xtask/src/postgres_for_tests.rs: initdb, start and wait, then the URL in
      # GITHUB_ENV for the steps after this one.
      - name: Start a Postgres server for the tests that need one
        run: cargo xtask postgres-for-tests --bin-dir /opt/homebrew/opt/postgresql@17/bin --data-dir "$RUNNER_TEMP/pg" --socket-dir "$RUNNER_TEMP" --github-env "$GITHUB_ENV"
      - run: cargo build --workspace --locked --exclude js-contain --exclude js-host-step --exclude js-mdm
      - name: Check the minimum macOS of the built binaries
        run: |
          set -euo pipefail
          checked=0
          for f in target/debug/*; do
            [ -f "$f" ] && [ -x "$f" ] || continue
            file "$f" | grep -q 'Mach-O 64-bit executable arm64' || continue
            minos="$(otool -l "$f" | awk '/LC_BUILD_VERSION/ {b=1} b && $1 == "minos" {print $2; exit}')"
            echo "$f minos $minos"
            if [ "$(printf '%s\n%s\n' "$minos" "$MACOSX_DEPLOYMENT_TARGET" | sort -V | tail -n 1)" != "$MACOSX_DEPLOYMENT_TARGET" ]; then
              echo "::error::$f needs macOS $minos, above the pinned $MACOSX_DEPLOYMENT_TARGET"
              exit 1
            fi
            checked=$((checked + 1))
          done
          [ "$checked" -gt 0 ] || { echo "::error::no Mach-O binary found to check"; exit 1; }
      # --no-fail-fast: a red run names every failing test, as in the Linux `test` job.
      - run: cargo test --workspace --locked --no-fail-fast --exclude js-contain --exclude js-host-step --exclude js-mdm
      - name: Add the release's macOS target
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: rustup target add aarch64-apple-darwin
      # crates/xtask/src/release/macos_leg.rs: for each binary, the release build, `release
      # stage`, its minos against the pinned macOS and its --version; then the hostkeeper
      # package of js-agent.
      - name: Build, stage and package the release's macOS binaries
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          TARGET: aarch64-apple-darwin
          BUILDS: js-cli:js js-agent:js-agent js-bundle-cli:js-bundle js-mac-session:js-mac-session js-mac-provision:js-mac-provision
        run: cargo xtask release macos-leg --target "$TARGET" --builds "$BUILDS" --min-macos "$MACOSX_DEPLOYMENT_TARGET" --out "$RUNNER_TEMP/release-leg"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # js-state's Postgres backend against a real server: its conformance suite, the schema
  # and boot tests, js-jobs's job store suite on it (tests/postgres_jobs.rs), js-usage's
  # tail counter scenarios and history store on it (tests/postgres_tail.rs,
  # tests/postgres_history.rs), the simulation cell's store family and store tests over it
  # (js-sim-cell's tests/store.rs and tests/server.rs; the cell's other families run in the
  # `test` job), and clippy with the features on. The server is a service container
  # pinned by digest; its password is a throwaway for this container, which lives only for
  # this job. The tests read the server's URL from KBF_TEST_POSTGRES_URL (the name the code
  # has; a rename is a later change to the code). The in-memory fake and its deliberately
  # broken variants (tests/fake_conformance.rs) run in the `test` job, which needs no server.
  state-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
        env:
          POSTGRES_PASSWORD: js-ci-throwaway
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      KBF_TEST_POSTGRES_URL: postgres://postgres:js-ci-throwaway@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: cargo clippy -p js-state -p js-jobs -p js-usage -p js-sim-cell --features js-state/postgres,js-jobs/postgres,js-usage/postgres,js-sim-cell/postgres --all-targets --locked -- -D warnings
      # The write-rate measurement (tests/postgres_write_rate.rs) is read by a person, not a gate.
      - run: cargo test -p js-state -p js-jobs -p js-usage --features js-state/postgres,js-jobs/postgres,js-usage/postgres --locked -- --include-ignored --skip the_write_rate_of_one_two_and_three_frontends
      - run: cargo test -p js-sim-cell --features js-sim-cell/postgres --locked --test store --test server
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The sandbox a job gets, proven by a job: js-agent's container create path against a
  # real rootful Podman (the distro's, the version the hosts run), with the job's own
  # view of its seccomp filter, capabilities, user namespace, network, root, /tmp and
  # scratch mount read from inside the running container
  # (crates/js-agent/tests/live_podman.rs, ignored in every other job). The host is
  # prepared here and only read by the test: a subordinate id range for a user name that
  # has no account, and the image, pulled by digest because the agent pulls nothing. The
  # job stands alone, so a failure here blocks no other job.
  live-podman:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      JS_LIVE_IMAGE: docker.io/library/busybox@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      JS_LIVE_SUBUID_USER: js-live-map
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Install Podman from the distribution
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman
          podman --version
      # One line per file, for a user name no account has: ids 300000 to 365535, above every
      # id of the runner's passwd and group files and of its own ranges.
      - name: Prepare the subordinate id range
        run: |
          echo "$JS_LIVE_SUBUID_USER:300000:65536" | sudo tee -a /etc/subuid
          echo "$JS_LIVE_SUBUID_USER:300000:65536" | sudo tee -a /etc/subgid
      - name: Pull the image by digest
        run: sudo podman pull "$JS_LIVE_IMAGE"
      - name: Build the test as the runner user
        run: cargo test -p js-agent --test live_podman --locked --no-run
      # Root runs the test (the agent refuses to map jobs otherwise), with the runner's
      # toolchain and home.
      - name: Run one job in Podman and assert its sandbox
        run: sudo -E env "PATH=$PATH" "HOME=$HOME" cargo test -p js-agent --test live_podman --locked -- --ignored --nocapture
      - name: Podman state after a failure
        if: ${{ failure() }}
        run: |
          sudo podman ps -a
          sudo podman logs --latest || true
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The privilege model of the agent on the rootless crun runtime, settled by the kernel
  # (crates/js-agent/tests/privilege, ignored in every other job; the design is
  # docs/design/agent-privilege.md). The tests start this very binary again as an ordinary
  # user holding exactly the capabilities a test names and read what it can do: the init
  # namespace read, the watched directories, the XFS project quota, the directory layout
  # and the state directory. The quota tests need a prjquota XFS volume: a loop image made
  # and mounted here and only read by the tests. The job stands alone, so a failure here
  # blocks no other job.
  agent-privilege:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      JS_PRIV_XFS_ROOT: /mnt/js-priv-xfs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Make and mount a project-quota XFS volume on a loop device
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xfsprogs nftables
          truncate -s 512M "$RUNNER_TEMP/js-priv-xfs.img"
          sudo mkfs.xfs -q "$RUNNER_TEMP/js-priv-xfs.img"
          sudo mkdir -p "$JS_PRIV_XFS_ROOT"
          sudo mount -o loop,prjquota "$RUNNER_TEMP/js-priv-xfs.img" "$JS_PRIV_XFS_ROOT"
          findmnt "$JS_PRIV_XFS_ROOT"
      # Option B, against a real crun: a root daemon starts every container as a dedicated
      # job user. The user has a subordinate id range (made here if useradd did not).
      - name: Install crun, uidmap and busybox and make the job user
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends crun uidmap busybox-static apparmor
          sudo useradd --create-home --shell /usr/sbin/nologin js-job
          grep -q '^js-job:' /etc/subuid || echo 'js-job:300000:65536' | sudo tee -a /etc/subuid
          grep -q '^js-job:' /etc/subgid || echo 'js-job:300000:65536' | sudo tee -a /etc/subgid
          echo "JS_B_CRUN=$(command -v crun)" >> "$GITHUB_ENV"
          echo "JS_B_BUSYBOX=$(command -v busybox)" >> "$GITHUB_ENV"
          echo "JS_B_UID=$(id -u js-job)" >> "$GITHUB_ENV"
          echo "JS_B_GID=$(id -g js-job)" >> "$GITHUB_ENV"
          crun --version | head -1
      # The AppArmor user-namespace restriction stays ON for the whole job: it is the
      # runner's default and the farm's likely policy, and the job user's crun is an
      # unprivileged process it applies to. The facts are printed, and root_daemon.rs
      # asserts the two sides of the control (the distribution's /usr/bin/crun, which its
      # profile lets create the namespace, runs the container; a copy of the same binary
      # at another path is refused it).
      - name: Record the AppArmor facts the container tests depend on
        run: |
          echo "apparmor_restrict_unprivileged_userns = $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"
          ls -l /etc/apparmor.d | grep -i crun || echo "no crun file in /etc/apparmor.d"
          sudo aa-status 2>&1 | grep -i crun || echo "no crun profile loaded"
          getcap "$(command -v crun)" || true
          cat /etc/apparmor.d/crun 2>/dev/null || true
      - name: Build the tests as the runner user
        run: |
          cargo test -p js-agent --test privilege --locked --no-run
          cargo test -p js-contain --test root_daemon --locked --no-run
          cargo test -p js-agent --test pull_root --locked --no-run
      # Root runs the tests (they start the unprivileged children themselves), with the
      # runner's toolchain and home.
      - name: Run the privilege tests as root
        run: sudo -E env "PATH=$PATH" "HOME=$HOME" cargo test -p js-agent --test privilege --locked -- --ignored --nocapture --test-threads=1
      - name: Run js-contain's Oci under a root daemon, as the job user, with the AppArmor restriction on
        run: sudo -E env "PATH=$PATH" "HOME=$HOME" cargo test -p js-contain --test root_daemon --locked -- --ignored --nocapture --test-threads=1 --skip counter_run
      # `js-agent image-pull` as root: the image from an in-process registry, unpacked by the
      # agent's own binary in a helper container run as the job user, published read-only.
      - name: Run js-agent image-pull as root against the real crun
        run: sudo -E env "PATH=$PATH" "HOME=$HOME" cargo test -p js-agent --test pull_root --locked -- --ignored --nocapture --test-threads=1
      # The counter-run of the copy control: with the restriction off the same copy of crun
      # starts the container, so the sysctl is the only difference from the refusal above.
      # The sysctl is put back to 1 whatever the result.
      - name: Counter-run the copy control with the AppArmor restriction off
        run: |
          set -euo pipefail
          restore() { sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1; }
          trap restore EXIT
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo -E env "PATH=$PATH" "HOME=$HOME" cargo test -p js-contain --test root_daemon --locked -- --ignored --nocapture --test-threads=1 counter_run
      - name: The restriction is back on
        run: test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # The container runtime against a real `crun`, in a `Delegate=yes` system unit each, with
  # every step one command (`cargo xtask crun-tests`, crates/xtask/src/crun_tests.rs; the
  # tests are crates/js-contain/tests/crun and crates/js-contain/tests/crun_root, `#[ignore]`d
  # in every other job).
  #
  # `crun-rootless` runs the tests as an ordinary user: the image unpack and a job over the
  # unpacked root, with the runner user's own subordinate ids.
  #
  # `crun-root` runs them as the agent runs on a node: a ROOT process that starts every
  # container as a dedicated non-root job user (`js-job`, which `useradd` gives a range of
  # subordinate ids), and reads from inside each container the ids it runs as, its
  # capabilities, the seccomp filter, the read-only root, `/tmp`, the network namespace, the
  # OOM group and the exec-root overlay's options; that an out-of-memory kill is the lease's
  # own, that a kill leaves no process or cgroup, and that one job at its process limit does
  # not stop another from forking. The AppArmor restriction on user namespaces stays at the
  # runner's default (on): the distribution's `/usr/bin/crun` profile lets the job user's
  # `crun` make one. A hosted runner's kernel and AppArmor policy are not a node's, so a
  # node's own canary stays the gate. The jobs stand alone: a failure here blocks no other.
  crun-rootless:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: sudo apt-get update
      - run: sudo apt-get install -y --no-install-recommends crun uidmap
      - run: cargo xtask crun-tests
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  crun-root:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: sudo apt-get update
      - run: sudo apt-get install -y --no-install-recommends crun uidmap busybox-static apparmor
      - run: sudo useradd --create-home --shell /usr/sbin/nologin js-job
      - run: cargo xtask crun-tests --job-user js-job
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # Egress of jobs under privilege option B (crates/js-agent/tests/egress, ignored in every
  # other job; the design is docs/design/agent-egress.md): the agent's firewall, its veth and
  # routes, and real containers made by js-contain's `Oci` as the job user with the AppArmor
  # user-namespace restriction left on. A second network namespace stands for another host
  # behind the runner's routing, so the allowed path is forwarded and masqueraded, never local.
  # Docker is stopped and its forward policy opened first: the runner's Docker would drop
  # forwarded packets in its own chain, which has nothing to do with what is under test.
  # The job stands alone, so a failure here blocks no other job.
  agent-egress:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: Install crun, uidmap, busybox and the network tools, and make the job user
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends crun uidmap busybox-static apparmor nftables iproute2 util-linux
          sudo useradd --create-home --shell /usr/sbin/nologin js-job
          grep -q '^js-job:' /etc/subuid || echo 'js-job:300000:65536' | sudo tee -a /etc/subuid
          grep -q '^js-job:' /etc/subgid || echo 'js-job:300000:65536' | sudo tee -a /etc/subgid
          echo "JS_B_CRUN=$(command -v crun)" >> "$GITHUB_ENV"
          echo "JS_B_BUSYBOX=$(command -v busybox)" >> "$GITHUB_ENV"
          echo "JS_B_UID=$(id -u js-job)" >> "$GITHUB_ENV"
          echo "JS_B_GID=$(id -g js-job)" >> "$GITHUB_ENV"
          crun --version | head -1
          nft --version
          busybox --list | tr '\n' ' '
      - name: Take Docker's firewall out of the way and record the host facts
        run: |
          sudo systemctl stop docker.socket docker.service containerd.service || true
          sudo iptables -P FORWARD ACCEPT || true
          sudo ip6tables -P FORWARD ACCEPT || true
          uname -r
          echo "apparmor_restrict_unprivileged_userns = $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"
          sudo nft list ruleset | head -60 || true
          sudo iptables -S | head -20 || true
      - name: Build the tests as the runner user
        run: cargo test -p js-agent --test egress --locked --no-run
      - name: Run the egress tests as root
        run: sudo -E env "PATH=$PATH" "HOME=$HOME" cargo test -p js-agent --test egress --locked -- --ignored --nocapture --test-threads=1
      - name: The restriction is still on
        run: test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # Licences, advisories, bans and sources, as deny.toml configures them. cargo-deny is
  # the release binary, checked against its SHA-256 before use.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DENY_VERSION: 0.20.2
      DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Install cargo-deny (pinned version and checksum)
        run: cargo xtask fetch --url "https://github.com/EmbarkStudios/cargo-deny/releases/download/$DENY_VERSION/cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl.tar.gz" --sha256 "$DENY_SHA256" --out "$HOME/.cargo/bin/cargo-deny" --extract tar.gz --member "cargo-deny-$DENY_VERSION-x86_64-unknown-linux-musl/cargo-deny"
      - run: cargo deny --version
      # The arguments cargo-deny-action passed by default.
      - run: cargo deny --log-level warn --manifest-path ./Cargo.toml --all-features check

  # Line and branch coverage per crate, and the ratchet in `coverage-baseline`
  # (crates/js-coverage): a crate may miss no more lines or branches than its line in
  # that file records, and the file starts at 0 for every crate. Branch coverage
  # (`--branch`, rustc's `-Zcoverage-options=branch`) is unstable, so this job alone
  # builds with a pinned nightly; every other job stays on the toolchain in
  # rust-toolchain.toml. The nightly may warn where stable does not, so `-D warnings` is
  # off here (clippy enforces it). cargo-llvm-cov is the release binary, checked against
  # its SHA-256 before use.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    services:
      postgres:
        image: postgres@sha256:2a0d0fe14825b0939f78a8cad5cd4e6aa68bf94d0e5dd96e24b6d23af4315545
        env:
          POSTGRES_PASSWORD: js-ci-throwaway
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      RUSTFLAGS: ""
      KBF_TEST_POSTGRES_URL: postgres://postgres:js-ci-throwaway@127.0.0.1:5432/postgres
      COVERAGE_TOOLCHAIN: nightly-2026-10-01
      LLVM_COV_VERSION: 0.9.1
      LLVM_COV_SHA256: b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every branch's history, so a pull request can read the base branch's
          # coverage-baseline with git (origin/<base>).
          fetch-depth: 0
      - run: rustup toolchain install "$COVERAGE_TOOLCHAIN" --profile minimal --component llvm-tools-preview
      # xtask builds with the coverage nightly, the one toolchain this job installs.
      - name: Install cargo-llvm-cov (pinned version and checksum)
        run: cargo "+$COVERAGE_TOOLCHAIN" xtask fetch --url "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v$LLVM_COV_VERSION/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz" --sha256 "$LLVM_COV_SHA256" --out "$HOME/.cargo/bin/cargo-llvm-cov" --extract tar.gz --member cargo-llvm-cov
      - run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov --version
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      # `-skip-functions` leaves the per-function records (FN, FNDA) out of the lcov
      # export. With branch coverage on, llvm-cov's lcov exporter can segfault while
      # writing them for async service methods. Lines and branches, all the ratchet
      # reads, are unaffected.
      # The restored cache may come from another branch (the newest entry by prefix),
      # and its instrumented test binaries stay in target/llvm-cov-target even where
      # this branch has no such crate: cargo-llvm-cov reads every binary there, so the
      # lcov file then names sources this tree lacks and the ratchet refuses it.
      # Delete the workspace crates' build output (crates/*/ and xtask are the only
      # workspace members; their directories there are named like the crates, with a
      # hash below) and the loose test binaries; cargo rebuilds what this tree has and
      # the dependencies stay cached.
      - name: Drop test binaries left by another branch
        run: |
          root=target/llvm-cov-target/coverage
          for d in "$root"/build/js-* "$root"/build/xtask; do
            [ -e "$d" ] && find "$d" -mindepth 1 -maxdepth 1 -exec rm -r {} +
          done
          if [ -d "$root/deps" ]; then
            find "$root/deps" -maxdepth 1 -type f ! -name '*.*' -delete
          fi
      - run: mkdir -p target/coverage
      # `--profile coverage` (Cargo.toml): unoptimised code, whatever the `test` profile
      # optimises for the test job; its output is under target/llvm-cov-target/coverage.
      # The coverage profile must stay unoptimised: it inherits `dev`, so a
      # `[profile.dev.package.*]` override in Cargo.toml would leak into it and inline
      # away lines the report then counts as missed (crates/xtask/tests/profile_overrides.rs
      # fails on any package override outside `test`).
      # The tests and the report are two steps, so the lcov is written (and uploaded
      # below) even when a test fails.
      - name: Run the workspace tests under coverage
        run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov --workspace --locked --no-fail-fast --profile coverage --branch --no-report
      - name: Write the lcov report
        if: ${{ !cancelled() }}
        env:
          LLVM_COV_FLAGS: -skip-functions
        run: cargo "+$COVERAGE_TOOLCHAIN" llvm-cov report --profile coverage --branch --lcov --output-path target/coverage/lcov.info
      # For each crate that misses more than its line in coverage-baseline, the step
      # prints (and puts in the job summary) the file:line of each uncovered line and
      # branch, up to 50 of each. When every failure is coverage that improved, it
      # prints the `js-coverage tighten` command that downloads this run's `coverage`
      # artifact and lowers coverage-baseline; --artifact must name the upload below.
      - name: Per-crate table and ratchet
        run: cargo "+$COVERAGE_TOOLCHAIN" run -p js-coverage --locked -- --lcov target/coverage/lcov.info --root "$GITHUB_WORKSPACE" --baseline coverage-baseline --write-baseline target/coverage/coverage-baseline.measured --summary-file "$GITHUB_STEP_SUMMARY" --run-id "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --artifact coverage
      # A pull request may not raise any count above the base branch's file, and a new
      # crate enters at zero (the table above only compares with this change's own
      # file). A push to main has no base. A base branch that exists but has no file yet
      # (it predates this gate) is an empty baseline: every crate is new and enters at
      # zero. A base ref that cannot be read fails the step.
      - name: Compare with the base branch
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git rev-parse --verify --quiet "origin/$BASE_REF^{commit}" > /dev/null
          if git cat-file -e "origin/$BASE_REF:coverage-baseline" 2> /dev/null; then
            git show "origin/$BASE_REF:coverage-baseline" > target/coverage/base-baseline
          else
            : > target/coverage/base-baseline
          fi
          cargo "+$COVERAGE_TOOLCHAIN" run -q -p js-coverage --locked -- against-base --base target/coverage/base-baseline --head coverage-baseline
      # The lcov the ratchet read, for finding a miss without a local coverage run,
      # and the measured baseline `tighten` reads. Kept a week: long enough to act on a
      # failure.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: |
            target/coverage/lcov.info
            target/coverage/coverage-baseline.measured
          if-no-files-found: error
          retention-days: 7
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
