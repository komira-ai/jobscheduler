# Builds the js-mac-pool privileged integration test binaries (`--test privileged` and
# `--test trace_base_set`) for aarch64-apple-darwin and uploads them, WITHOUT running them.
# The privileged tests (crates/js-mac-pool/tests/privileged.rs, all `#[ignore]`) run the allow-list self-test as an unprivileged pool
# user against root-owned canaries, and need root and a second user, which a hosted runner
# is not for: an operator runs them once on a provisioned Mac that has Xcode installed.
# Download the artifact, check SHA256SUMS, copy the binary over, chmod +x it (the artifact
# zip drops the mode) and, as root, run
#   JS_MAC_POOL_PRIV_ROOT=<root-owned 0755 directory on the data volume> \
#     JS_MAC_POOL_PRIV_UID=<uid> JS_MAC_POOL_PRIV_GID=<gid> \
#     ./privileged --ignored --test-threads=1
# (libtest flags come first.) `trace_base_set` (crates/js-mac-pool/tests/trace_base_set.rs)
# is run the same way with the test filter `trace` after the flags; it prints a table of the
# read base set of the Mac's macOS version and writes it under the work root.
#
# Manual runs only. It publishes nothing: the binary is a workflow artifact for seven days.
name: js-mac-pool-privileged-tests

on:
  # No inputs: it builds exactly the commit it is dispatched on.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TARGET: aarch64-apple-darwin
  # The oldest macOS the binaries must run on; a newer image must not raise it.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: rustup target add "$TARGET"
      - name: Build the test binary without running it
        run: |
          set -euo pipefail
          cargo test -p js-mac-pool --test privileged --test trace_base_set --no-run --locked --target "$TARGET" --message-format=json > build.json
      - name: Pick the binary and check what it is
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          short="${commit:0:12}"
          mkdir dist
          for name in privileged trace_base_set; do
            # The test executable of the integration test `$name`: a compiler-artifact
            # message with profile.test and that target's name and kind, never a guess by file name.
            exe="$(jq -r --arg name "$name" 'select(.reason == "compiler-artifact" and .profile.test == true and .target.name == $name and (.target.kind | index("test")) != null and .executable != null) | .executable' build.json)"
            if [ "$(printf '%s\n' "$exe" | grep -c .)" != 1 ]; then
              echo "::error::expected exactly one $name test executable, got: $exe"
              exit 1
            fi
            cp "$exe" "dist/$name"
            description="$(file "dist/$name")"
            echo "$description"
            case "$description" in
              *"Mach-O 64-bit executable arm64"*) ;;
              *)
                echo "::error::dist/$name is not an arm64 Mach-O executable"
                exit 1
                ;;
            esac
          done
          (cd dist && shasum -a 256 privileged trace_base_set > SHA256SUMS)
          {
            echo "### js-mac-pool privileged test binaries"
            echo
            echo "- commit: \`$commit\`"
            echo "- target: \`$TARGET\`"
            sed 's/^\([0-9a-f]*\)  \(.*\)$/- \2 sha256: `\1`/' dist/SHA256SUMS
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SHORT=$short" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: js-mac-pool-privileged-tests-${{ env.SHORT }}
          path: |
            dist/privileged
            dist/trace_base_set
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
