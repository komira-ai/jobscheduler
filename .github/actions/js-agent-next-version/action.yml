# The version after a package's: MAJOR.MINOR.(PATCH+1). The one place it is computed: the package
# workflow builds the update package at it (js-agent-macos-pkg.yml's `build-update`) and the
# first-install workflow tells the test which version it is (js-agent-macos-first-install.yml), so
# the two cannot name different versions. The version is checked as MAJOR.MINOR.PATCH first.
#
# No command expands an expression: the step reads its environment.
# crates/xtask/tests/macos_pkg_workflow.rs pins these rules.
name: js-agent-next-version
description: The patch version after a MAJOR.MINOR.PATCH version

inputs:
  version:
    description: The version, MAJOR.MINOR.PATCH
    required: true

outputs:
  version:
    description: The next patch version, MAJOR.MINOR.PATCH
    value: ${{ steps.next.outputs.version }}

runs:
  using: composite
  steps:
    - name: The next patch version
      id: next
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo "::error::the version must be MAJOR.MINOR.PATCH"
          exit 1
        fi
        echo "version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))" >> "$GITHUB_OUTPUT"
