# cargo-deny configuration. Run: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licences only. Anything not listed, including every copyleft licence
# (GPL, LGPL, AGPL, MPL, EPL, CDDL, EUPL, OSL), is refused.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # The Mozilla root set bundled by webpki-roots (the public roots js-client trusts when
    # `--ca-cert` is absent). It is a permissive data licence; nothing else here uses it.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[licenses.private]
# Workspace crates are not published; their licence is the workspace's Apache-2.0.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# This repository never depends on the one its crates were lifted out of (kbf depends on
# these crates, by git revision; docs/layering.md). cargo-deny matches exact names only, so
# kbf's crates are listed; `cargo test -p xtask --test layering` refuses every `kbf-*`
# name in a manifest, so a crate kbf adds later is caught there. Refresh this list with the
# crates under kbf's `crates/` when they change.
deny = [
    { crate = "kbf-alert" },
    { crate = "kbf-auth" },
    { crate = "kbf-baseline" },
    { crate = "kbf-bench" },
    { crate = "kbf-ca" },
    { crate = "kbf-caps" },
    { crate = "kbf-cas-conformance" },
    { crate = "kbf-cli" },
    { crate = "kbf-coordinator" },
    { crate = "kbf-coverage" },
    { crate = "kbf-daemon-test" },
    { crate = "kbf-daemon" },
    { crate = "kbf-deploy" },
    { crate = "kbf-driver-container" },
    { crate = "kbf-driver-native" },
    { crate = "kbf-driver-vm" },
    { crate = "kbf-enroll-registry" },
    { crate = "kbf-enroll" },
    { crate = "kbf-estimator-replay" },
    { crate = "kbf-estimator" },
    { crate = "kbf-farm-test" },
    { crate = "kbf-front" },
    { crate = "kbf-gate" },
