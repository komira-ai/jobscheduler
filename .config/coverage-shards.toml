# The plan of the coverage shards of .github/workflows/ci.yml, read by `cargo xtask
# coverage-shard --plan .config/coverage-shards.toml --shard <k> --of <shards> -- <command>...`.
#
# The numbers are seconds one test took under coverage, measured on ci run 45933829163: the
# duration each test printed in the log of its coverage shard. A test that took more than 100
# seconds is named below, with its seconds. Every other test is a light test; `light-seconds` is
# the sum of the seconds of all of them.
#
# The verb deals the work out by longest processing time first. The items are the named tests
# (weight: their seconds) and `slices` equal slices of the light tests (weight: `light-seconds`
# divided by `slices` each); heaviest first, each goes to the shard with the least load so far,
# the lowest shard number on a tie. A shard runs the named tests it was given with one
# `-E` filterset, then each light slice it was given with `-E 'not (<every named test>)'` and
# `--partition slice:<j>/<slices>`.
#
# Every test runs in exactly one shard, by construction. A named test matches the filterset of
# the one shard it is given, and no other: every other shard's light runs exclude it. Every other
# test, including a test this plan names under a name it no longer has, is in the complement of
# the named tests, which nextest cuts into `slices` slices: it is in exactly one slice, and
# every slice is given to exactly one shard. A named test that is renamed or removed must leave
# this file in the same change: `cargo test -p xtask --test coverage_shard` fails while an entry
# names a test its binary's source does not have.
#
# To refresh the plan, read the durations of a green coverage run's shard logs (each test's
# line `PASS [ <seconds>s ] <binary-id> <test>`), name the tests above 100 seconds with their
# seconds, and set `light-seconds` to the sum of the seconds of all the others. `shards` is the
# length of the `shard` matrix of the `coverage-shard` job; `slices` is at least `shards`, and a
# multiple of it keeps the slices even.
shards = 12
slices = 48
light-seconds = 4983

