<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="State machine of a lease: Pending, Held, Releasing and Removed, with the trigger and action on every transition.">
<title>Lease lifecycle</title>
<defs><marker id="lease-lifecycle-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B0B0A"/></marker><marker id="lease-lifecycle-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FD4F1D"/></marker><marker id="lease-lifecycle-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs>
<style>
.box{fill:#FFFFFF;stroke:#0B0B0A;stroke-width:1.4}
.box-b{fill:#E8EEF4;stroke:#0B0B0A;stroke-width:1.4}
.box-o{fill:#FFFAF5;stroke:#FD4F1D;stroke-width:1.4}
.box-a{fill:#FD4F1D;stroke:#FD4F1D;stroke-width:1.4}
.box-t{fill:none;stroke:#FD4F1D;stroke-width:2}
.box-p{fill:none;stroke:#5A5A57;stroke-width:1.6;stroke-dasharray:7 5}
.box-g{fill:#F0F0EE;stroke:#5A5A57;stroke-width:1.4}
.box-gd{fill:#F0F0EE;stroke:#5A5A57;stroke-width:1.4;stroke-dasharray:6 4}
.box-r{fill:#FDECEA;stroke:#C0392B;stroke-width:1.4}
.box-rd{fill:#FFFFFF;stroke:#C0392B;stroke-width:1.4;stroke-dasharray:6 4}
.box-n{fill:#E6F4EA;stroke:#2E7D32;stroke-width:1.4}
.ln{stroke:#0B0B0A;fill:none;stroke-width:1.4}
.ln-d{stroke:#0B0B0A;fill:none;stroke-width:1.4;stroke-dasharray:6 4}
.ln-o{stroke:#FD4F1D;fill:none;stroke-width:1.6}
.ln-r{stroke:#C0392B;fill:none;stroke-width:1.5}
.ln-rd{stroke:#C0392B;fill:none;stroke-width:1.5;stroke-dasharray:6 4}
text{fill:#1E1E1D;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px}
.b{font-weight:600}
.t-m{fill:#5A5A57;font-size:12px}
.t-r{fill:#C0392B;font-size:12px}
.t-w{fill:#FFFFFF;font-weight:600}
.lbl{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<rect x="0" y="0" width="1200" height="500" fill="#FFFFFF"/>
<text x="20" y="28" class="b" text-anchor="start" font-size="16">A lease: Pending, Held, Releasing, Removed</text>
<circle cx="40" cy="235" r="8" fill="#0B0B0A"/>
<rect x="230" y="210" width="140" height="50" rx="5" class="box-o"/>
<text x="300.0" y="239.0" class="b" text-anchor="middle">Pending</text>
<rect x="540" y="210" width="140" height="50" rx="5" class="box-o"/>
<text x="610.0" y="239.0" class="b" text-anchor="middle">Held</text>
<rect x="850" y="210" width="140" height="50" rx="5" class="box-o"/>
<text x="920.0" y="239.0" class="b" text-anchor="middle">Releasing</text>
<circle cx="1150" cy="235" r="20" class="box-b"/><circle cx="1150" cy="235" r="15" class="box-b"/>
<text x="1150" y="282" class="b" text-anchor="middle">Removed</text>
<path d="M48,235 L230,235" class="ln" marker-end="url(#lease-lifecycle-ak)"/>
<path d="M370,235 L540,235" class="ln" marker-end="url(#lease-lifecycle-ak)"/>
<path d="M680,235 L850,235" class="ln" marker-end="url(#lease-lifecycle-ak)"/>
<path d="M990,235 L1130,235" class="ln" marker-end="url(#lease-lifecycle-ak)"/>
<text x="139" y="208" class="t-m lbl" text-anchor="middle">acquire / write record,</text>
<text x="139" y="222" class="t-m lbl" text-anchor="middle">then call provider</text>
<text x="455" y="208" class="t-m lbl" text-anchor="middle">provider started, or</text>
<text x="455" y="222" class="t-m lbl" text-anchor="middle">tick Resolve sees present</text>
<text x="765" y="194" class="t-m lbl" text-anchor="middle">DELETE, or tick Expire</text>
<text x="765" y="208" class="t-m lbl" text-anchor="middle">(ttl or wall);</text>
<text x="765" y="222" class="t-m lbl" text-anchor="middle">save, then stop</text>
<text x="1060" y="208" class="t-m lbl" text-anchor="middle">stop reads back</text>
<text x="1060" y="222" class="t-m lbl" text-anchor="middle">absent / 200 freed</text>
<path d="M290,210 L290,110 L1150,110 L1150,215" class="ln" marker-end="url(#lease-lifecycle-ak)"/>
<text x="720" y="103" class="t-m lbl" text-anchor="middle">provider refused, or Resolve sees absent</text>
<path d="M330,210 L330,165 L900,165 L900,210" class="ln" marker-end="url(#lease-lifecycle-ak)"/>
<text x="615" y="158" class="t-m lbl" text-anchor="middle">tick Expire at prepare_timeout (observed first)</text>
<path d="M260,260 L260,300 L340,300 L340,260" class="ln" marker-end="url(#lease-lifecycle-ak)"/>
<path d="M570,260 L570,300 L650,300 L650,260" class="ln" marker-end="url(#lease-lifecycle-ak)"/>
<path d="M880,260 L880,300 L960,300 L960,260" class="ln" marker-end="url(#lease-lifecycle-ak)"/>
<text x="300" y="322" class="t-m lbl" text-anchor="middle">provider unknown / keep;</text>
<text x="300" y="336" class="t-m lbl" text-anchor="middle">whole-node: agent not ready yet</text>
<text x="610" y="322" class="t-m lbl" text-anchor="middle">renew (not after expiry,</text>
<text x="610" y="336" class="t-m lbl" text-anchor="middle">never past wall end)</text>
<text x="920" y="322" class="t-m lbl" text-anchor="middle">stop unknown: 202,</text>
<text x="920" y="336" class="t-m lbl" text-anchor="middle">tick Retry</text>
<rect x="135" y="370" width="330" height="52" rx="5" class="box-p"/>
<text x="300.0" y="391.5" class="t-m" text-anchor="middle">whole-node: pending until agent reports ready;</text>
<text x="300.0" y="408.5" class="t-m" text-anchor="middle">ttl and wall start then</text>
<text x="600" y="470" class="b" text-anchor="middle">Only Absent frees. Unknown never does.</text>
</svg>
