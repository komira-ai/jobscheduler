<text x="880" y="235" class="b" text-anchor="middle">js-agent</text>
<text x="880" y="253" class="t-m" text-anchor="middle">Linux, Docker/Podman</text>
<rect x="845" y="273" width="90" height="28" rx="5" class="box"/>
<text x="890.0" y="291.0" text-anchor="middle">job</text>
