<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" role="img" aria-label="Components of jobscheduler: generated clients on the left call a protobuf service API; the scheduler core with one placement engine, queue, lease and run lifecycle and usage history keeps its state in Postgres; on the right each pool has ordered compute providers, namely js-agent hosts (the default provider), static hosts and elastic providers, and every machine runs js-agent and runs jobs as OCI images.">
<title>jobscheduler components</title>
<defs><marker id="components-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B0B0A"/></marker><marker id="components-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FD4F1D"/></marker><marker id="components-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs>
<style>
.box{fill:#FFFFFF;stroke:#0B0B0A;stroke-width:1.4}
.box-b{fill:#E8EEF4;stroke:#0B0B0A;stroke-width:1.4}
.box-o{fill:#FFFAF5;stroke:#FD4F1D;stroke-width:1.4}
.box-a{fill:#FD4F1D;stroke:#FD4F1D;stroke-width:1.4}
.box-t{fill:none;stroke:#FD4F1D;stroke-width:2}
.box-p{fill:none;stroke:#5A5A57;stroke-width:1.6;stroke-dasharray:7 5}
.box-g{fill:#F0F0EE;stroke:#5A5A57;stroke-width:1.4}
.box-gd{fill:#F0F0EE;stroke:#5A5A57;stroke-width:1.4;stroke-dasharray:6 4}
.box-r{fill:#FDECEA;stroke:#C0392B;stroke-width:1.4}
.box-rd{fill:#FFFFFF;stroke:#C0392B;stroke-width:1.4;stroke-dasharray:6 4}
.box-bd{fill:#FFFFFF;stroke:#0B0B0A;stroke-width:1.4;stroke-dasharray:6 4}
.box-od{fill:#FFFAF5;stroke:#FD4F1D;stroke-width:1.4;stroke-dasharray:6 4}
.box-bld{fill:#E8EEF4;stroke:#0B0B0A;stroke-width:1.4;stroke-dasharray:6 4}
.box-n{fill:#E6F4EA;stroke:#2E7D32;stroke-width:1.4}
.ln{stroke:#0B0B0A;fill:none;stroke-width:1.4}
.ln-d{stroke:#0B0B0A;fill:none;stroke-width:1.4;stroke-dasharray:6 4}
.ln-o{stroke:#FD4F1D;fill:none;stroke-width:1.6}
.ln-r{stroke:#C0392B;fill:none;stroke-width:1.5}
.ln-rd{stroke:#C0392B;fill:none;stroke-width:1.5;stroke-dasharray:6 4}
text{fill:#1E1E1D;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px}
.b{font-weight:600}
.t-m{fill:#5A5A57;font-size:12px}
.t-r{fill:#C0392B;font-size:12px}
.t-w{fill:#FFFFFF;font-weight:600}
.lbl{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<rect x="0" y="0" width="1400" height="800" fill="#FFFFFF"/>
<text x="20" y="28" class="b" text-anchor="start" font-size="16">jobscheduler: clients, one scheduler core, ordered compute providers</text>
<text x="20" y="58" class="b" text-anchor="start">Clients</text>
<text x="235" y="58" class="b" text-anchor="start">Service API</text>
<text x="470" y="58" class="b" text-anchor="start">Scheduler core (one service)</text>
<text x="960" y="58" class="b" text-anchor="start">Compute providers of a pool, in priority order</text>
<rect x="20" y="96" width="170" height="64" rx="5" class="box-bd"/>
<text x="105.0" y="124" class="b" text-anchor="middle">Generated CLI</text>
<text x="105.0" y="140" class="t-m" text-anchor="middle">planned</text>
<rect x="20" y="184" width="170" height="76" rx="5" class="box-bd"/>
<text x="105.0" y="209" class="b" text-anchor="middle">Generated client library</text>
<text x="105.0" y="226" class="t-m" text-anchor="middle">any program calls it</text>
<text x="105.0" y="243" class="t-m" text-anchor="middle">planned</text>
<rect x="20" y="284" width="170" height="118" rx="5" class="box-gd"/>
<text x="105.0" y="313" class="b" text-anchor="middle">Today</text>
<text x="105.0" y="330" class="t-m" text-anchor="middle">hand-written js-cli and</text>
<text x="105.0" y="347" class="t-m" text-anchor="middle">js-client over HTTP/JSON</text>
<text x="105.0" y="364" class="t-m" text-anchor="middle">(built); the generated</text>
<text x="105.0" y="381" class="t-m" text-anchor="middle">pair replaces them</text>
<text x="105" y="430" class="t-m" text-anchor="middle">both generated from the</text>
<text x="105" y="446" class="t-m" text-anchor="middle">service definition</text>
<rect x="235" y="96" width="190" height="164" rx="5" class="box-bld"/>
<text x="330.0" y="148" class="b" text-anchor="middle">Service API</text>
<text x="330.0" y="165" class="t-m" text-anchor="middle">protobuf service definition</text>
<text x="330.0" y="182" class="t-m" text-anchor="middle">(planned)</text>
<text x="330.0" y="199" class="t-m" text-anchor="middle">HTTP/JSON routes (built)</text>
<text x="330.0" y="216" class="t-m" text-anchor="middle">generated gateway if kept</text>
<path d="M190,128 L235,128" class="ln" marker-end="url(#components-ak)"/>
<path d="M190,222 L235,222" class="ln" marker-end="url(#components-ak)"/>
<text x="212" y="118" class="t-m lbl" text-anchor="middle">calls</text>
<rect x="470" y="70" width="430" height="580" rx="5" class="box-t"/>
<path d="M425,168 L490,168" class="ln" marker-end="url(#components-ak)"/>
<text x="458" y="160" class="t-m lbl" text-anchor="middle">requests</text>
<rect x="490" y="96" width="390" height="140" rx="5" class="box-o"/>
<text x="685.0" y="136" class="b" text-anchor="middle">Placement engine: js-sched (partly built)</text>
<text x="685.0" y="153" class="t-m" text-anchor="middle">load placement, CPU slack setting, memory percent</text>
<text x="685.0" y="170" class="t-m" text-anchor="middle">tail placement for whole-node requests</text>
<text x="685.0" y="187" class="t-m" text-anchor="middle">walks the pool's providers in priority order (planned)</text>
<text x="685.0" y="204" class="t-m" text-anchor="middle">estimates from usage history</text>
<rect x="490" y="248" width="390" height="52" rx="5" class="box-o"/>
<text x="685.0" y="270" class="b" text-anchor="middle">Queue and reservations (partly built)</text>
<text x="685.0" y="286" class="t-m" text-anchor="middle">in js-registry today; moves into js-sched</text>
<rect x="490" y="312" width="390" height="52" rx="5" class="box-o"/>
<text x="685.0" y="334" class="b" text-anchor="middle">Lease and run lifecycle (built)</text>
<text x="685.0" y="350" class="t-m" text-anchor="middle">js-lease, commit before start, tick loop</text>
<rect x="490" y="376" width="390" height="52" rx="5" class="box-o"/>
<text x="685.0" y="398" class="b" text-anchor="middle">Usage history (partly built)</text>
<text x="685.0" y="414" class="t-m" text-anchor="middle">js-usage: per-minute usage, cost curves, P90 wall times</text>
<text x="685.0" y="426" class="t-m" text-anchor="middle" font-size="10">ended-lease record planned, step 3</text>
<rect x="490" y="440" width="390" height="52" rx="5" class="box-o"/>
<text x="685.0" y="462" class="b" text-anchor="middle">Scaler: caps, brake, records (built)</text>
<text x="685.0" y="478" class="t-m" text-anchor="middle">js-scaler: acquire driver for elastic providers, not a fleet manager</text>
<rect x="490" y="520" width="390" height="110" rx="5" class="box-od"/>
<path d="M510,542 v54 a20,6 0 0 0 40,0 v-54" fill="#E8EEF4" stroke="#0B0B0A" stroke-width="1.2"/><ellipse cx="530" cy="542" rx="20" ry="6" fill="#E8EEF4" stroke="#0B0B0A" stroke-width="1.2"/>
<text x="720" y="546" class="b" text-anchor="middle">Postgres (partly built)</text>
<text x="720" y="568" class="t-m" text-anchor="middle">leases, runs, hosts, usage history</text>
<text x="720" y="585" class="t-m" text-anchor="middle">js-state has the backend; the server still</text>
<text x="720" y="602" class="t-m" text-anchor="middle">keeps a lease file and a SQLite usage file</text>
<path d="M720,492 L720,520" class="ln" marker-end="url(#components-ak)"/>
<text x="780" y="510" class="t-m lbl" text-anchor="middle">commit</text>
<rect x="950" y="72" width="440" height="640" rx="5" class="box-p"/>
<rect x="960" y="88" width="420" height="262" rx="5" class="box-o"/>
<text x="1170" y="110" class="b" text-anchor="middle">1  js-agent hosts: the default provider (partly built)</text>
<text x="1170" y="128" class="t-m" text-anchor="middle">host book (js-registry) is its state; hosts register themselves; no acquire</text>
<rect x="972" y="142" width="198" height="196" rx="5" class="box-b"/>
<text x="1071" y="164" class="b" text-anchor="middle">Linux host</text>
<text x="1071" y="182" class="t-m" text-anchor="middle">js-agent + crun</text>
<text x="1071" y="199" class="t-m" text-anchor="middle">crun starts the OCI image</text>
<text x="1071" y="216" class="t-m" text-anchor="middle">no container daemon</text>
<rect x="1021" y="240" width="100" height="44" rx="5" class="box"/>
<text x="1071" y="267" class="b" text-anchor="middle">job</text>
<text x="1071" y="306" class="t-m" text-anchor="middle">job = OCI image</text>
<rect x="986" y="311" width="170" height="12" rx="3" class="box-bd" fill-opacity="0"/>
<text x="1071" y="321" class="t-m" text-anchor="middle" font-size="10">agent ceiling on network (planned)</text>
<rect x="1178" y="142" width="198" height="196" rx="5" class="box-b"/>
<text x="1277" y="164" class="b" text-anchor="middle">macOS host</text>
<text x="1277" y="182" class="t-m" text-anchor="middle">js-agent + native run</text>
<text x="1277" y="199" class="t-m" text-anchor="middle">OCI bundle under sandbox,</text>
<text x="1277" y="216" class="t-m" text-anchor="middle">throwaway user, pf</text>
<rect x="1227" y="240" width="100" height="44" rx="5" class="box-bd"/>
<text x="1277" y="267" class="b" text-anchor="middle">job</text>
<text x="1277" y="300" class="t-m" text-anchor="middle">today: native body</text>
<text x="1277" y="316" class="t-m" text-anchor="middle">planned: job = OCI image</text>
<rect x="1192" y="322" width="170" height="12" rx="3" class="box-bd" fill-opacity="0"/>
<text x="1277" y="332" class="t-m" text-anchor="middle" font-size="10">agent ceiling on network (planned)</text>
<rect x="960" y="364" width="420" height="64" rx="5" class="box-o"/>
<text x="1170.0" y="392" class="b" text-anchor="middle">2  static hosts (partly built)</text>
<text x="1170.0" y="408" class="t-m" text-anchor="middle">operator-listed hosts that also run js-agent</text>
<rect x="960" y="442" width="420" height="198" rx="5" class="box-o"/>
<text x="1170" y="464" class="b" text-anchor="middle">3  elastic providers: acquire and release machines</text>
<rect x="972" y="478" width="198" height="50" rx="5" class="box"/>
<text x="1071" y="500" class="b" text-anchor="middle">Lambda Labs</text>
<text x="1071" y="517" class="t-m" text-anchor="middle">partly built</text>
<rect x="1178" y="478" width="198" height="50" rx="5" class="box-bd"/>
<text x="1277" y="500" class="b" text-anchor="middle">Kubernetes</text>
<text x="1277" y="517" class="t-m" text-anchor="middle">planned</text>
<rect x="972" y="540" width="198" height="50" rx="5" class="box-bd"/>
<text x="1071" y="562" class="b" text-anchor="middle">AWS</text>
<text x="1071" y="579" class="t-m" text-anchor="middle">planned</text>
<rect x="1178" y="540" width="198" height="50" rx="5" class="box-bd"/>
<text x="1277" y="562" class="b" text-anchor="middle">GCP</text>
<text x="1277" y="579" class="t-m" text-anchor="middle">planned</text>
<text x="1170" y="610" class="t-m" text-anchor="middle">every launched machine runs js-agent,</text>
<text x="1170" y="626" class="t-m" text-anchor="middle">says hello and joins the pool as a host</text>
<path d="M880,170 L960,170" class="ln" marker-end="url(#components-ak)" marker-start="url(#components-ak)"/>
<text x="920" y="120" class="t-m lbl" text-anchor="middle">hello,</text>
<text x="920" y="134" class="t-m lbl" text-anchor="middle">heartbeat,</text>
<text x="920" y="148" class="t-m lbl" text-anchor="middle">commands</text>
<text x="1170" y="672" class="t-m" text-anchor="middle">the ordered list per pool is planned; today: static pool,</text>
<text x="1170" y="688" class="t-m" text-anchor="middle">then registered hosts, one elastic pool</text>
<path d="M880,466 L960,466" class="ln" marker-end="url(#components-ak)"/>
<text x="920" y="458" class="t-m lbl" text-anchor="middle">acquire,</text>
<text x="920" y="490" class="t-m lbl" text-anchor="middle">release</text>
<path d="M880,400 L960,400" class="ln" marker-end="url(#components-ak)" marker-start="url(#components-ak)"/>
<rect x="1000" y="740" width="170" height="44" rx="5" class="box-g"/>
<text x="1085" y="767" class="b" text-anchor="middle">Image registry</text>
<rect x="1210" y="740" width="170" height="44" rx="5" class="box-g"/>
<text x="1295" y="767" class="b" text-anchor="middle">Object store</text>
<path d="M1085,712 L1085,740" class="ln" marker-end="url(#components-ak)"/>
<text x="1075" y="733" class="t-m lbl" text-anchor="end">digest-verified pull</text>
<path d="M1295,712 L1295,740" class="ln-d" marker-end="url(#components-ak)"/>
<text x="1285" y="733" class="t-m lbl" text-anchor="end">one presigned PUT</text>

<path d="M30,745 L80,745" class="ln" marker-end="url(#components-ak)"/>
<text x="90" y="749" class="t-m" text-anchor="start">message path</text>
<rect x="30" y="764" width="50" height="16" rx="3" class="box-bd"/>
<text x="90" y="777" class="t-m" text-anchor="start">dashed outline: planned</text>
<text x="250" y="749" class="t-m" text-anchor="start">The scheduler never reaches the object store:</text>
<text x="250" y="766" class="t-m" text-anchor="start">a job reaches it only through the URL its client minted.</text>
</svg>
