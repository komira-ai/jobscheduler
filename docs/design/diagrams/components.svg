<rect x="0" y="0" width="1300" height="720" fill="#FFFFFF"/>
<ellipse cx="325" cy="190" rx="10" ry="4" fill="#E8EEF4" stroke="#0B0B0A" stroke-width="1.2"/>
<text x="20" y="28" class="b" text-anchor="start" font-size="16">One lease server process: clients, hosts and outside services</text>
<text x="20" y="58" class="b" text-anchor="start">Clients</text>
<text x="250" y="58" class="b" text-anchor="start">Lease server (one process, one mutex)</text>
<text x="780" y="58" class="b" text-anchor="start">Hosts</text>
<text x="1140" y="58" class="b" text-anchor="start">Outside</text>
<rect x="250" y="70" width="380" height="570" rx="5" class="box-t"/>
<rect x="20" y="96" width="150" height="44" rx="5" class="box-b"/>
