<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="A lease goes requested, placed, active, then ended as released, expired or lost. A run goes queued, then started or failed to start, then exited with a result, stopped, or lost. A run lives only inside an active lease; when the lease ends its runs stop.">
<title>Leases and runs</title>
<defs><marker id="lease-and-run-ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B0B0A"/></marker><marker id="lease-and-run-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FD4F1D"/></marker><marker id="lease-and-run-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs>
<style>
.box{fill:#FFFFFF;stroke:#0B0B0A;stroke-width:1.4}
.box-b{fill:#E8EEF4;stroke:#0B0B0A;stroke-width:1.4}
.box-o{fill:#FFFAF5;stroke:#FD4F1D;stroke-width:1.4}
.box-a{fill:#FD4F1D;stroke:#FD4F1D;stroke-width:1.4}
.box-t{fill:none;stroke:#FD4F1D;stroke-width:2}
.box-p{fill:none;stroke:#5A5A57;stroke-width:1.6;stroke-dasharray:7 5}
.box-g{fill:#F0F0EE;stroke:#5A5A57;stroke-width:1.4}
.box-gd{fill:#F0F0EE;stroke:#5A5A57;stroke-width:1.4;stroke-dasharray:6 4}
.box-r{fill:#FDECEA;stroke:#C0392B;stroke-width:1.4}
.box-rd{fill:#FFFFFF;stroke:#C0392B;stroke-width:1.4;stroke-dasharray:6 4}
.box-bd{fill:#FFFFFF;stroke:#0B0B0A;stroke-width:1.4;stroke-dasharray:6 4}
.box-od{fill:#FFFAF5;stroke:#FD4F1D;stroke-width:1.4;stroke-dasharray:6 4}
.box-bld{fill:#E8EEF4;stroke:#0B0B0A;stroke-width:1.4;stroke-dasharray:6 4}
.box-n{fill:#E6F4EA;stroke:#2E7D32;stroke-width:1.4}
.ln{stroke:#0B0B0A;fill:none;stroke-width:1.4}
.ln-d{stroke:#0B0B0A;fill:none;stroke-width:1.4;stroke-dasharray:6 4}
.ln-o{stroke:#FD4F1D;fill:none;stroke-width:1.6}
.ln-r{stroke:#C0392B;fill:none;stroke-width:1.5}
.ln-rd{stroke:#C0392B;fill:none;stroke-width:1.5;stroke-dasharray:6 4}
text{fill:#1E1E1D;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px}
.b{font-weight:600}
.t-m{fill:#5A5A57;font-size:12px}
.t-r{fill:#C0392B;font-size:12px}
.t-w{fill:#FFFFFF;font-weight:600}
.lbl{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
</style>
<rect x="0" y="0" width="1200" height="520" fill="#FFFFFF"/>
<text x="20" y="28" class="b" text-anchor="start" font-size="16">A lease and the runs inside it</text>
<text x="20" y="66" class="b" text-anchor="start">LEASE: a client hold on capacity of one shape, or a whole host, on one host, kept alive by renewal</text>
<rect x="20" y="100" width="170" height="60" rx="5" class="box-o"/>
<text x="105.0" y="126.0" class="b" text-anchor="middle">Requested</text>
<text x="105.0" y="143.0" class="t-m" text-anchor="middle">queued until placed</text>
<rect x="250" y="100" width="170" height="60" rx="5" class="box-o"/>
<text x="335.0" y="126.0" class="b" text-anchor="middle">Placed</text>
<text x="335.0" y="143.0" class="t-m" text-anchor="middle">a host is booked</text>
<rect x="480" y="100" width="170" height="60" rx="5" class="box-o"/>
<text x="565.0" y="126.0" class="b" text-anchor="middle">Active</text>
<text x="565.0" y="143.0" class="t-m" text-anchor="middle">usable; renewed</text>
<rect x="780" y="50" width="240" height="40" rx="5" class="box-b"/>
<text x="900.0" y="74.5" class="b" text-anchor="middle">Released: the client asked</text>
<rect x="780" y="110" width="240" height="40" rx="5" class="box-b"/>
<text x="900.0" y="134.5" class="b" text-anchor="middle">Expired: ttl or wall time ran out</text>
<rect x="780" y="170" width="240" height="40" rx="5" class="box-b"/>
<text x="900.0" y="194.5" class="b" text-anchor="middle">Lost: the host is gone for good</text>
<path d="M190,130 L250,130" class="ln" marker-end="url(#lease-and-run-ak)"/>
<path d="M420,130 L480,130" class="ln" marker-end="url(#lease-and-run-ak)"/>
<path d="M650,115 L780,70" class="ln" marker-end="url(#lease-and-run-ak)"/>
<path d="M650,130 L780,130" class="ln" marker-end="url(#lease-and-run-ak)"/>
<path d="M650,145 L780,190" class="ln" marker-end="url(#lease-and-run-ak)"/>
<text x="1100" y="120" class="b" text-anchor="start">Ended</text>
<text x="1100" y="138" class="t-m" text-anchor="start">booking freed once</text>
<text x="1100" y="154" class="t-m" text-anchor="start">the host confirms</text>
<path d="M530,160 L530,184 L600,184 L600,160" class="ln" marker-end="url(#lease-and-run-ak)"/>
<text x="565" y="202" class="t-m" text-anchor="middle">renew</text>
<text x="335" y="202" class="t-m" text-anchor="middle">whole host: active only once the agent reports it ready</text>
<text x="20" y="278" class="b" text-anchor="start">RUN: one execution of a job (an OCI image and a command) inside a lease</text>
<rect x="480" y="330" width="170" height="60" rx="5" class="box-o"/>
<text x="565.0" y="356.0" class="b" text-anchor="middle">Queued</text>
<text x="565.0" y="373.0" class="t-m" text-anchor="middle">accepted, not started</text>
<rect x="720" y="330" width="150" height="60" rx="5" class="box-o"/>
<text x="795.0" y="356.0" class="b" text-anchor="middle">Started</text>
<text x="795.0" y="373.0" class="t-m" text-anchor="middle">running on the host</text>
<rect x="930" y="290" width="240" height="40" rx="5" class="box-b"/>
<text x="1050.0" y="314.5" class="b" text-anchor="middle">Exited: result and exit code</text>
<rect x="930" y="340" width="240" height="40" rx="5" class="box-b"/>
<text x="1050.0" y="364.5" class="b" text-anchor="middle">Stopped: asked, or lease ended</text>
<rect x="930" y="390" width="240" height="40" rx="5" class="box-b"/>
<text x="1050.0" y="414.5" class="b" text-anchor="middle">Lost: host gone, no result</text>
<rect x="720" y="424" width="150" height="50" rx="5" class="box-r"/>
<text x="795.0" y="446.0" class="b" text-anchor="middle">Failed to start</text>
<text x="795.0" y="463.0" class="t-m" text-anchor="middle">agent refused; nothing ran</text>
<path d="M620,390 L620,449 L720,449" class="ln" marker-end="url(#lease-and-run-ak)"/>
<path d="M650,360 L720,360" class="ln" marker-end="url(#lease-and-run-ak)"/>
<path d="M870,345 L930,310" class="ln" marker-end="url(#lease-and-run-ak)"/>
<path d="M870,360 L930,360" class="ln" marker-end="url(#lease-and-run-ak)"/>
<path d="M870,375 L930,410" class="ln" marker-end="url(#lease-and-run-ak)"/>
<path d="M565,220 L565,326" class="ln-o" marker-end="url(#lease-and-run-ao)"/>
<text x="580" y="255" class="t-m" text-anchor="start">a lease holds 0 to n runs;</text>
<text x="580" y="272" class="t-m" text-anchor="start">runs never outlive their lease</text>
<text x="20" y="350" class="t-m" text-anchor="start">A client that wants one job submits it:</text>
<text x="20" y="367" class="t-m" text-anchor="start">the service takes a lease of the job's shape,</text>
<text x="20" y="384" class="t-m" text-anchor="start">starts one run, releases the lease on exit.</text>
<text x="20" y="401" class="t-m" text-anchor="start">A client that wants warm capacity keeps the lease</text>
<text x="20" y="418" class="t-m" text-anchor="start">and starts many short runs.</text>
</svg>
