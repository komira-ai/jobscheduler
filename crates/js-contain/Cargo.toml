[package]
name = "js-contain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The tests' stand-in `crun` (tests/bin/fake_crun.rs). Not shipped.
[[bin]]
name = "js-fake-crun"
path = "tests/bin/fake_crun.rs"
test = false

[dependencies]
async-trait.workspace = true
js-types = { path = "../js-types" }
oci-spec.workspace = true
runc.workspace = true
rustix = { workspace = true, features = ["fs", "process", "thread"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "process", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
hex.workspace = true
# The egress spike tests (tests/egress_spike): unshare, ioctl and open for the probe that runs
# inside the container.
libc.workspace = true
sha2.workspace = true
# gettid, for the test that finds the child of its own thread.
rustix = { workspace = true, features = ["thread"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
