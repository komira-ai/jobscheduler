[package]
name = "js-registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
js-agent-wire = { path = "../js-agent-wire" }
js-caps = { path = "../js-caps" }
js-elastic = { path = "../js-elastic" }
js-lease = { path = "../js-lease" }
js-provider = { path = "../js-provider" }
js-types = { path = "../js-types" }
js-usage = { path = "../js-usage" }
js-whole = { path = "../js-whole" }
getrandom.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true

[dev-dependencies]
# tests/capacity.rs runs the registered set of the machine-provider conformance suite
# against `StaticCapacity`.
js-elastic = { path = "../js-elastic", features = ["conformance"] }
js-pool-static = { path = "../js-pool-static" }
# The tests place with js-sched's engine, the placer the server gives the registry
# (tests/support); a test reads how often the engine was rebuilt through `test-support`.
js-sched = { path = "../js-sched" }
js-sched-placer = { path = "../js-sched-placer", features = ["test-support"] }
js-sim = { path = "../js-sim" }
# tests/tail_store.rs keeps the tail counters, and tests/history.rs writes the records of
# ended leases, in the in-memory fake state store and in a SQLite file in a scratch directory.
js-state = { path = "../js-state", features = ["test-support"] }
js-testkit = { path = "../js-testkit" }
serde_json.workspace = true

[lints]
workspace = true
