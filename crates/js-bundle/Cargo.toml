[package]
name = "js-bundle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hex.workspace = true
js-types = { path = "../js-types" }
ruzstd.workspace = true
rustix = { workspace = true, features = ["fs"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[package.metadata.buildrules]
# The farm lane's `//:ci` (docs/farm.md) checks the format of, builds and lints this package but
# does not run its tests: tests/pack.rs binds a Unix socket below TMPDIR, which on the farm is too
# deep for a socket's path (komira-ai/buildrules#170). They run in ci.yml alone.

[package.metadata.buildrules.actions]
ci = ["fmt", "lint"]
