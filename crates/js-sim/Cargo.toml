[package]
name = "js-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
js-types = { path = "../js-types" }
rand_chacha.workspace = true
sha2.workspace = true

[dev-dependencies]
js-testkit = { path = "../js-testkit" }

[lints]
workspace = true

[package.metadata.buildrules]
# The farm lane's `//:ci` (docs/farm.md) checks the format of, builds and lints this package but
# does not run its tests: its determinism and toy_counter targets holds `#[ignore]`d tests, and
# buildrules' test gate refuses a test target with an ignored test (golden regeneration). They run
# in ci.yml alone.

[package.metadata.buildrules.actions]
ci = ["fmt", "lint"]
