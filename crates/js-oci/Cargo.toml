[package]
name = "js-oci"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The one registry client of this repository: verified pulls of OCI artifacts by digest,
# over hyper and rustls (no HTTP client crate, so a daemon links nothing it does not use).
[dependencies]
async-trait.workspace = true
bytes.workspace = true
hex.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
libc.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "rt", "time"] }
tokio-rustls.workspace = true

[dev-dependencies]
js-testkit = { path = "../js-testkit" }
rcgen.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
