[package]
name = "js-supervise"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The core of a per-run supervisor, shared by its arms (on Linux, js-contain's crun arm): the
# exit record, the handshake with its ready word, the supervisor's process identity, the handle
# that reads how a run ended, and the signal mask of the supervise mode. It starts no process:
# the caller starts the supervisor and hands the child over.

[dependencies]
nix = { workspace = true, features = ["signal"] }
rustix = { workspace = true, features = ["fs", "process"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }

# proc_pidinfo and sysctl(KERN_PROCARGS2), the process identity on macOS (src/macos.rs), which
# neither rustix nor nix wraps.
[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[dev-dependencies]
# TestDir, the scratch directory each test owns.
js-testkit = { path = "../js-testkit" }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true

[package.metadata.buildrules]
# The farm lane's `//:ci` (docs/farm.md) checks the format of, builds and lints this package but
# does not run its tests: they start stand-in supervisors (`sh`, `cat`, `true`) by name and expect
# an absolute PATH, as the js-contain tests they came from did, and a farm test's PATH names
# buildrules' busybox directory alone. They run in ci.yml alone.

[package.metadata.buildrules.actions]
ci = ["fmt", "lint"]
