[package]
name = "js-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "js"
path = "src/main.rs"

[dependencies]
js-client = { path = "../js-client", features = ["jobs"] }
# The job service's descriptor set, which the job commands build requests and print answers by.
js-proto = { path = "../js-proto" }
clap.workspace = true
getrandom.workspace = true
prost.workspace = true
prost-reflect = { workspace = true, features = ["serde", "text-format"] }
serde_json.workspace = true
thiserror.workspace = true
# `macros` and `sync`: `job run` waits and follows at once, and reads the signals as it waits.
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync"] }
tonic.workspace = true

[dev-dependencies]
http-body-util.workspace = true
hyper.workspace = true
js-conformance = { path = "../js-conformance" }
js-testkit = { path = "../js-testkit" }
# `signals`: the test sends the process the signal its handlers are installed for.
rustix = { workspace = true, features = ["process"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
tonic = { workspace = true, features = ["transport"] }

[lints]
workspace = true

[package.metadata.buildrules]
# The farm lane's `//:ci` (docs/farm.md) checks the format of this package but does not build it:
# it depends on js-contain, directly or through a dev-dependency, and its build compiles `js-init`
# (crates/js-contain/build.rs), which must be a static executable, and buildrules' linker links it
# dynamically and succeeds (komira-ai/buildrules#173), which `build.rs` refuses. So the farm checks
# this package's format only; it is built, linted and tested in ci.yml.

[package.metadata.buildrules.actions]
ci = ["fmt"]
