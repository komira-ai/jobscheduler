[package]
name = "js-cpu-replay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `js-cpu-replay`: replays the job service's recorded jobs against rules for packing CPU on a
# host (docs/design/cpu-packing.md). `convert` turns an export of job records into an
# anonymised trace; `run` replays a trace and prints the report.
[[bin]]
name = "js-cpu-replay"
path = "src/main.rs"

[dependencies]
# The job store, which reads an export's job rows (`JobStore::get_job`), and the record it
# reads.
js-jobs = { path = "../js-jobs" }
# The placer's cold sizes (`DEFAULT_COLD_CPU_MILLIS`, `DEFAULT_COLD_MEMORY_BYTES`) and the keys
# it sizes a job by (`JobSizes::key_of`, `fallback_key_of`, `client_key_of`).
js-sched-placer = { path = "../js-sched-placer" }
# The estimator the placer books a job's CPU and memory with.
js-sizing = { path = "../js-sizing" }
# The scratch SQLite store the job rows are read through.
js-state = { path = "../js-state" }
base64.workspace = true
clap.workspace = true
flate2.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The host ids and resources of the jobs the rows' tests run through a job store.
js-types = { path = "../js-types" }

[lints]
workspace = true

[package.metadata.buildrules]
# Every step of the farm lane's `//:ci` (docs/farm.md): the workspace's policy.
