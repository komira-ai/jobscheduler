[package]
name = "js-elastic-fake"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Only the contract it implements and its id types: no network crate, no async runtime, no cloud SDK
# (tests/no_cloud_reach.rs fails on any of them anywhere in the workspace).
[dependencies]
js-elastic = { path = "../js-elastic" }
# `ProviderId`, the name the fake answers `id` with.
js-types = { path = "../js-types" }

[dev-dependencies]
# The provider contract's conformance suite (tests/conformance.rs).
js-elastic = { path = "../js-elastic", features = ["conformance"] }

[lints]
workspace = true

[package.metadata.buildrules]
# The farm lane's `//:ci` (docs/farm.md) checks the format of, builds and lints this package but
# does not run its tests: tests/no_cloud_reach.rs reads every manifest and source file of the
# repository, which an action does not have. They run in ci.yml alone.

[package.metadata.buildrules.actions]
ci = ["fmt", "lint"]
