[package]
name = "js-blackbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The black-box tests of the released js-agent and js-server: the released .deb installed from the
# apt suite `testing` and started under systemd with flags of the farm's shape, and the released
# js-server image loaded into Docker and started as the control host starts it, driven only from
# outside (their listeners, the job service's API, the files the package installs and the jobs the
# agent runs). The library is what the tests judge by: the pass conditions as numbers, the wait
# that measures them on an injected clock, the readers of the job service's answers, and the
# farm's flag shapes (farm/) with what fills them in. Its own tests (tests/judge.rs) run
# everywhere. The black-box test (tests/released.rs) is a program with modes and no libtest
# harness: run with no mode (as `cargo test` and cargo-nextest run it) it holds no test; its
# wrapper, `released rig`, runs as root on a disposable GitHub-hosted runner by
# .github/workflows/js-blackbox.yml, which release.yml calls after `check-apt`.

[[test]]
name = "released"
path = "tests/released.rs"
harness = false

[dependencies]
# The monotonic clock the wait reads.
js-types = { path = "../js-types" }
serde_json.workspace = true

[dev-dependencies]
# The system's monotonic clock, given to the wait by the black-box test.
js-system-clock = { path = "../js-system-clock" }

# Everything the black-box test uses besides that is for Linux alone; none of it is built for
# macOS, where the test does not exist.
[target.'cfg(target_os = "linux")'.dev-dependencies]
# The modes of the program and their flags.
clap.workspace = true
# The job service's client (the HTTP gateway and the host list), over the server's TLS.
js-client = { path = "../js-client" }
# The scratch directory, and the registry the job image is pulled from, on the loopback.
js-testkit = { path = "../js-testkit", features = ["oci-registry"] }
# The job image's layer, a gzipped tar.
flate2.workspace = true
# The test CA, the server's certificate and the host's certificate.
rcgen.workspace = true
rustix.workspace = true
sha2.workspace = true
hex.workspace = true
tar.workspace = true
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread"] }

[lints]
workspace = true

[package.metadata.buildrules]
# The farm lane's `//:ci` (docs/farm.md) checks the format of, builds and lints this package but
# does not run its tests: the black-box test installs released packages as root on a disposable
# runner, which no build-farm action can. ci.yml runs tests/judge.rs with the workspace, and its
# coverage job measures the library.

[package.metadata.buildrules.actions]
ci = ["fmt", "lint"]
