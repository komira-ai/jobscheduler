[package]
name = "js-mac-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Runs on a hosted macOS runner and records what a native (sandbox-exec) runtime relies on.
# The report types and the child modes build and are tested everywhere; the probes
# themselves are macOS only.
[[bin]]
name = "js-mac-probe"
path = "src/main.rs"

[dependencies]
clap.workspace = true
libc.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
js-testkit = { path = "../js-testkit" }

[lints]
workspace = true

[package.metadata.buildrules]
# The farm lane's `//:ci` (docs/farm.md) checks the format of, builds and lints this package but
# does not run its tests: src/child.rs's tests expect an absolute PATH, and a farm test's PATH
# names buildrules' busybox directory alone. They run in ci.yml alone.

[package.metadata.buildrules.actions]
ci = ["fmt", "lint"]
