[package]
name = "js-mdm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `js-mdm`: applies js-mdm-core's rendered output to a Linux host (fetch, install, tls,
# verify). The pure rendering is js-mdm-core; the steps that touch the host are js-host-step.
[[bin]]
name = "js-mdm"
path = "src/main.rs"

[dependencies]
base64.workspace = true
clap.workspace = true
flate2.workspace = true
getrandom = { workspace = true, features = ["std"] }
hex.workspace = true
js-host-step = { path = "../js-host-step" }
js-mdm-core = { path = "../js-mdm-core" }
rustls.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
ureq.workspace = true

[dev-dependencies]
js-testkit = { path = "../js-testkit" }

[lints]
workspace = true
