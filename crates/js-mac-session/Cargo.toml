[package]
name = "js-mac-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The `posix_spawn` attributes and error numbers of `disclaim`.
libc.workspace = true

[dev-dependencies]
# The programs the unit tests start: js-testkit's act verbs, through links to the test
# binary, and its scratch directories.
js-testkit = { path = "../js-testkit" }
rustix = { workspace = true, features = ["process"] }

[lints]
workspace = true

[package.metadata.buildrules]
# The farm lane's `//:ci` (docs/farm.md) checks the format of, builds and lints this package but
# does not run its tests: they start `/bin/sh`, `/bin/echo` and `/usr/bin/true` by absolute path and run a link
# to the test binary beside it, none of which the farm's sandbox has been shown to hold. They run
# in ci.yml alone.

[package.metadata.buildrules.actions]
ci = ["fmt", "lint"]
