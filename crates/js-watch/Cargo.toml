[package]
name = "js-watch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "js-watch"
path = "src/main.rs"

[dependencies]
js-alert = { path = "../js-alert" }
js-elastic = { path = "../js-elastic" }
js-provider-lambdalabs = { path = "../js-provider-lambdalabs" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq.workspace = true

[dev-dependencies]
js-testkit = { path = "../js-testkit" }

[lints]
workspace = true

[package.metadata.buildrules]
# The farm lane's `//:ci` (docs/farm.md) checks the format of, builds and lints this package but
# does not run its tests: tests/read_only.rs reads other members' sources and walks all of crates/,
# which an action does not have. They run in ci.yml alone.

[package.metadata.buildrules.actions]
ci = ["fmt", "lint"]
