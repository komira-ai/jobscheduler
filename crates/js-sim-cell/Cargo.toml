[package]
name = "js-sim-cell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The real agent lifecycle, which a real agent node runs (src/agent/real.rs).
js-agent = { path = "../js-agent" }
js-agent-wire = { path = "../js-agent-wire" }
js-conformance = { path = "../js-conformance" }
# The job and allocation tables' types, and the scripted id source (feature `test-support`)
# the cell's server mints its ids from, so a seed replays (src/server/ids.rs).
js-jobs = { path = "../js-jobs", features = ["test-support"] }
js-lease = { path = "../js-lease" }
# The server in process, with no listener (src/in_process.rs of that crate).
js-lease-server = { path = "../js-lease-server", features = ["in-process"] }
js-registry = { path = "../js-registry" }
js-sim = { path = "../js-sim" }
# The clock the job store stamps its rows with, read from the cell's (src/server/ids.rs).
js-state = { path = "../js-state" }
js-testkit = { path = "../js-testkit" }
js-types = { path = "../js-types" }
# Requests and bodies for the server's routers (`axum::http`, `axum::body`).
axum.workspace = true
# `ValueEnum`, through which the server's `--placement` values are listed and spelled.
clap.workspace = true
serde_json.workspace = true
# The current-thread runtime each request and tick of the server runs on.
tokio = { workspace = true, features = ["rt"] }
# `oneshot`, to call a router as a service.
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
