[package]
name = "js-sim-cell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The real agent lifecycle, which a real agent node runs (src/agent/real.rs).
js-agent = { path = "../js-agent" }
js-agent-wire = { path = "../js-agent-wire" }
js-conformance = { path = "../js-conformance" }
# The provider trait the recording wrapper implements, and its call and answer types
# (src/elastic/cloud.rs).
js-elastic = { path = "../js-elastic" }
# The in-memory cloud an elastic pool launches its machines on (src/elastic/).
js-elastic-fake = { path = "../js-elastic-fake" }
# The job and allocation tables' types, and the scripted id source (feature `test-support`)
# the cell's server mints its ids from, so a seed replays (src/server/ids.rs).
js-jobs = { path = "../js-jobs", features = ["test-support"] }
js-lease = { path = "../js-lease" }
# The server in process, with no listener (src/in_process.rs of that crate).
js-lease-server = { path = "../js-lease-server", features = ["in-process"] }
js-registry = { path = "../js-registry" }
js-sim = { path = "../js-sim" }
# The clock the job store stamps its rows with, read from the cell's (src/server/ids.rs), and
# the SQLite store the cell reads while its server is down (src/server/store.rs).
js-state = { path = "../js-state" }
js-testkit = { path = "../js-testkit" }
js-types = { path = "../js-types" }
# Requests and bodies for the server's routers (`axum::http`, `axum::body`).
axum.workspace = true
# `ValueEnum`, through which the server's `--placement` values are listed and spelled.
clap.workspace = true
serde_json.workspace = true
# The table the server hands a provider kind (src/elastic/config.rs).
toml.workspace = true
# The current-thread runtime each request and tick of the server runs on.
tokio = { workspace = true, features = ["rt"] }
# `oneshot`, to call a router as a service.
tower = { workspace = true, features = ["util"] }

# The sweep: the smoke family over the seeds its flags name, one shard of a nightly sweep
# (src/sweep.rs). It reads its own flags, which libtest would refuse, so it has no harness;
# run with none, as a plain `cargo test` runs it, it sweeps nothing.
[[test]]
name = "sweep"
path = "tests/sweep.rs"
harness = false

[features]
# The Postgres store of the cell's server (`Store::Postgres`, src/server/store.rs): a database
# of its own on the test server for each server node, made by `js_state::postgres::test_database`
# (feature `test-database`, which brings js-state's `postgres` and js-testkit's `postgres`).
# The server's own Postgres store is always built (js-lease-server). Off by default, as
# js-jobs's `postgres` feature is: the `state-postgres` CI job turns it on, and the tests it
# adds need the server `KBF_TEST_POSTGRES_URL` names and fail, never skip, without it.
postgres = ["js-state/test-database", "js-testkit/postgres"]

[lints]
workspace = true
