[package]
name = "js-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The lifecycle's `Runtime` and `Clock`, which the in-memory runtime (`agent::memory`)
# implements so the real lifecycle runs in one process.
js-agent = { path = "../js-agent" }
js-caps = { path = "../js-caps" }
js-types = { path = "../js-types" }
js-sched = { path = "../js-sched" }
# The in-memory store the reference core runs on (`core` module); test-only by nature, like
# this crate.
js-state = { path = "../js-state", features = ["test-support"] }
# The job-service suite (`jobs`): the generated service and client, the channel that joins
# them over an in-memory stream, and the reference service.
js-proto = { path = "../js-proto" }
hyper-util = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["io-util", "rt"] }
tonic = { workspace = true, features = ["transport"] }

[dev-dependencies]
js-agent-wire = { path = "../js-agent-wire" }
js-registry = { path = "../js-registry" }
# The production placer every registry here is built with.
js-sched-placer = { path = "../js-sched-placer" }
js-testkit = { path = "../js-testkit" }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
