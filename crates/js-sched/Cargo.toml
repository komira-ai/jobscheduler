[package]
name = "js-sched"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# What a test reads of the scheduler beyond its interface: how many platform matches its
# placement rounds made. The crate's own unit tests have it through `cfg(test)`; a crate
# whose tests read it turns it on in its own `[dev-dependencies]` entry.
test-support = []

[dependencies]
js-agent-wire = { path = "../js-agent-wire" }
js-caps = { path = "../js-caps" }
js-elastic = { path = "../js-elastic" }
js-sizing = { path = "../js-sizing" }
js-types = { path = "../js-types" }
js-whole = { path = "../js-whole" }
thiserror.workspace = true

[dev-dependencies]
js-sim = { path = "../js-sim" }
# The x2 replay's round trip (tests/sim_x_replay/x2_store_tests.rs): an export written from
# a usage store over the in-memory fake store reads back as the replay's input.
js-state = { path = "../js-state", features = ["test-support"] }
js-usage = { path = "../js-usage" }

[lints]
workspace = true

[package.metadata.buildrules]
# The farm lane's `//:ci` (docs/farm.md) checks the format of, builds and lints this package but
# does not run its tests: five of its test targets hold `#[ignore]`d tests, and buildrules' test
# gate refuses a test target with an ignored test (golden regeneration, seed replay, long runs).
# They run in ci.yml alone.

[package.metadata.buildrules.actions]
ci = ["fmt", "lint"]
