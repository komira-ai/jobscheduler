[package]
name = "js-sched"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# What a test reads of the scheduler beyond its interface: how many platform matches its
# placement rounds made. The crate's own unit tests have it through `cfg(test)`; a crate
# whose tests read it turns it on in its own `[dev-dependencies]` entry.
test-support = []

[dependencies]
js-agent-wire = { path = "../js-agent-wire" }
js-caps = { path = "../js-caps" }
js-elastic = { path = "../js-elastic" }
js-sizing = { path = "../js-sizing" }
js-types = { path = "../js-types" }
js-whole = { path = "../js-whole" }
thiserror.workspace = true

[dev-dependencies]
js-sim = { path = "../js-sim" }

[lints]
workspace = true
