[package]
name = "js-isolation-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Runs AS a native job on a Mac pool host and says what a job can write, read, reach and
# leave behind (docs/runbooks/mac-isolation-probe.md). The probes are written against an
# injected host, so they build and are tested everywhere; only the glue that hands them the
# real host is macOS only.
[[bin]]
name = "js-isolation-probe"
path = "src/main.rs"

[dependencies]
clap.workspace = true
libc.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
js-testkit = { path = "../js-testkit" }

[lints]
workspace = true

[package.metadata.buildrules]
# The farm lane's `//:ci` (docs/farm.md) checks the format of, builds and lints this package but
# does not run its tests: src/net.rs's tests bind a Unix socket below TMPDIR, which on the farm is
# too deep for a socket's path (komira-ai/buildrules#170). They run in ci.yml alone.

[package.metadata.buildrules.actions]
ci = ["fmt", "lint"]
