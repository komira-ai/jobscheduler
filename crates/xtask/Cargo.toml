[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# `cargo xtask` runs this bin, not the test fake.
default-run = "xtask"

# `xtask-fake`, the program this crate's tests run in place of `cargo` and of `sudo`
# (see its docs). Never run by CI itself.
[[bin]]
name = "xtask-fake"
path = "src/bin/xtask-fake.rs"
test = false

[dependencies]
clap.workspace = true
flate2.workspace = true
hex.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
# The runner user's uid and gid, and `uname -m`, for `crun-tests`.
rustix = { workspace = true, features = ["process", "system"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
toml.workspace = true
ureq.workspace = true

[dev-dependencies]
# The paths the elastic boot payload gives its agent, the flags the agent's command line
# accepts and the server addresses the client refuses (tests/js_agent_package.rs).
js-agent = { path = "../js-agent" }
js-client = { path = "../js-client" }
js-elastic = { path = "../js-elastic" }
rcgen.workspace = true

[lints]
workspace = true
