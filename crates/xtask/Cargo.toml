[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# `cargo xtask` runs this bin, not the test fake.
default-run = "xtask"

# `xtask-fake`, the program this crate's tests run in place of `cargo` and of `sudo`
# (see its docs). Never run by CI itself.
[[bin]]
name = "xtask-fake"
path = "src/bin/xtask-fake.rs"
test = false

# `host-shim`, the program the tests of `packaging/js-agent/crun_host_setup.sh` run in place of the
# host's `systemctl`, `mount`, `useradd` and the rest (see its docs). Never run by CI itself.
[[bin]]
name = "host-shim"
path = "src/bin/host-shim.rs"
test = false

[dependencies]
clap.workspace = true
flate2.workspace = true
# `mac-farm`: its uploads, at most a few at a time, and the messages of a streamed upload.
futures-util.workspace = true
hex.workspace = true
# `channels check-apt` runs the agent's own start check of the job user on the installed system.
js-agent = { path = "../js-agent" }
# `gen-job-surface` renders the route table of docs/http-gateway.md from the gateway's routes,
# and its served paragraph from the calls the lease server serves.
js-api-gateway = { path = "../js-api-gateway" }
# `agent-handover-check` runs the check of this crate (docs/runbooks/agent-handover-check.md).
js-handover-check = { path = "../js-handover-check" }
# `release smoke-bundle`: the smoke bundle packed and pushed with `js-bundle`'s own commands,
# pulled back with the agent's registry client and extracted with the agent's extractor.
js-bundle = { path = "../js-bundle" }
js-bundle-cli = { path = "../js-bundle-cli" }
js-oci = { path = "../js-oci" }
js-lease-server = { path = "../js-lease-server" }
# `gen-job-surface` reads the job service's descriptor set: the one js-proto builds, decoded
# with prost into prost-types' descriptor messages.
js-proto = { path = "../js-proto" }
prost.workspace = true
prost-types.workspace = true
# `mac-farm`'s REAPI client: the channel to the farm (TLS with the system's roots when `--tls true`)
# and the generated clients of the Remote Execution API (build.rs).
tonic = { workspace = true, features = ["transport", "tls-ring", "tls-native-roots"] }
tonic-prost.workspace = true
# The scratch directory and the guarded server child of `site-demo`.
js-testkit = { path = "../js-testkit" }
# `fetch --extract tar.xz` (and the xz archives its tests make).
lzma-rs.workspace = true
# The package's `md5sums` file (`release deb`).
md-5.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
# The runner user's uid and gid, and `uname -m`, for `crun-tests`.
rustix = { workspace = true, features = ["process", "system"] }
# The zstd file `fetch --extract zst` installs (buck2).
ruzstd.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The spawn-site check (src/spawn_sites.rs) parses the source of the agent and of js-mac-session (the spawner);
# proc-macro2's `span-locations` gives it the line of each place it reports.
proc-macro2.workspace = true
# `clone-impls`: tests/job_surface.rs copies the expressions of a rendered table.
syn = { workspace = true, features = ["clone-impls"] }
tar.workspace = true
thiserror.workspace = true
# The runtime `release smoke-bundle check` pulls on.
tokio = { workspace = true, features = ["net", "rt", "time"] }
toml.workspace = true
ureq.workspace = true

[build-dependencies]
# The vendored Remote Execution API protos (proto/third_party), compiled for `mac-farm`.
protox.workspace = true
tonic-prost-build.workspace = true

[dev-dependencies]
# The fake farm of tests/mac_farm.rs serves its three services from one server (tonic's router).
tonic = { workspace = true, features = ["router"] }
# The registry in this process the smoke bundle is published to and pulled from
# (tests/smoke_bundle.rs).
js-testkit = { path = "../js-testkit", features = ["oci-registry"] }
# The named pipe the stand-in test copies from (tests/stand_in_busy.rs).
rustix = { workspace = true, features = ["fs"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The server addresses the client refuses (tests/js_agent_package.rs). js-agent, which the tests
# also read, is a dependency above.
js-client = { path = "../js-client" }
# The interpreter that builds the job commands from a generated table, run on the tables the
# generator renders for the test definition (tests/job_surface.rs).
js-cli = { path = "../js-cli" }
js-elastic = { path = "../js-elastic" }
# The hook's step bounds, which the lease server's declaration must keep (tests/js_lease_server_declaration.rs).
js-update-hook = { path = "../js-update-hook" }
# The plists the package carries must be flags the programs accept (tests/macos_pkg.rs).
js-mac-provision = { path = "../js-mac-provision" }
# The test definition of tests/job_surface.rs, compiled as js-proto's build script compiles
# the job service.
protox.workspace = true
rcgen.workspace = true
# The YAML parser the workflow lint of the apt jobs (tests/apt_workflow) reads each workflow with.
saphyr-parser.workspace = true

[lints]
workspace = true

[package.metadata.buildrules]
# The farm lane's `//:ci` (docs/farm.md) checks the format of this package but does not build it:
# it depends on js-contain, directly or through a dev-dependency, and its build compiles `js-init`
# (crates/js-contain/build.rs), which must be a static executable, and buildrules' linker links it
# dynamically and succeeds (komira-ai/buildrules#173), which `build.rs` refuses. So the farm checks
# this package's format only; it is built, linted and tested in ci.yml.

[package.metadata.buildrules.actions]
ci = ["fmt"]
