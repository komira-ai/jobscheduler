[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# `cargo xtask` runs this bin, not the test fake.
default-run = "xtask"

# `xtask-fake`, the program this crate's tests run in place of `cargo` and of `sudo`
# (see its docs). Never run by CI itself.
[[bin]]
name = "xtask-fake"
path = "src/bin/xtask-fake.rs"
test = false

# `host-shim`, the program the tests of `packaging/js-agent/crun_host_setup.sh` run in place of the
# host's `systemctl`, `mount`, `useradd` and the rest (see its docs). Never run by CI itself.
[[bin]]
name = "host-shim"
path = "src/bin/host-shim.rs"
test = false

[dependencies]
clap.workspace = true
flate2.workspace = true
hex.workspace = true
# `gen-job-surface` renders the route table of docs/http-gateway.md from the gateway's routes,
# and its served paragraph from the calls the lease server serves.
js-api-gateway = { path = "../js-api-gateway" }
js-lease-server = { path = "../js-lease-server" }
# `gen-job-surface` reads the job service's descriptor set: the one js-proto builds, decoded
# with prost into prost-types' descriptor messages.
js-proto = { path = "../js-proto" }
prost.workspace = true
prost-types.workspace = true
# The scratch directory and the guarded server child of `site-demo`.
js-testkit = { path = "../js-testkit" }
# The package's `md5sums` file (`release deb`).
md-5.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
# The runner user's uid and gid, and `uname -m`, for `crun-tests`.
rustix = { workspace = true, features = ["process", "system"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The spawn-site check (src/spawn_sites.rs) parses the agent's and the helper's source;
# proc-macro2's `span-locations` gives it the line of each place it reports.
proc-macro2.workspace = true
# `clone-impls`: tests/job_surface.rs copies the expressions of a rendered table.
syn = { workspace = true, features = ["clone-impls"] }
tar.workspace = true
thiserror.workspace = true
toml.workspace = true
ureq.workspace = true

[dev-dependencies]
# The paths the elastic boot payload gives its agent, the flags the agent's command line
# accepts and the server addresses the client refuses (tests/js_agent_package.rs).
js-agent = { path = "../js-agent" }
js-client = { path = "../js-client" }
# The interpreter that builds the job commands from a generated table, run on the tables the
# generator renders for the test definition (tests/job_surface.rs).
js-cli = { path = "../js-cli" }
js-elastic = { path = "../js-elastic" }
# The hook's step bounds, which the lease server's declaration must keep (tests/js_lease_server_declaration.rs).
js-update-hook = { path = "../js-update-hook" }
# The plists the package carries must be flags the programs accept (tests/macos_pkg.rs).
js-mac-provision = { path = "../js-mac-provision" }
js-mac-session = { path = "../js-mac-session" }
# The test definition of tests/job_surface.rs, compiled as js-proto's build script compiles
# the job service.
protox.workspace = true
rcgen.workspace = true
# The YAML parser the workflow lint of the apt jobs (tests/apt_workflow) reads each workflow with.
saphyr-parser.workspace = true

[lints]
workspace = true
