[package]
name = "js-caps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
js-types = { path = "../js-types" }
thiserror.workspace = true

[lints]
workspace = true

[package.metadata.buildrules]
# The farm lane's `//:ci` (docs/farm.md) checks the format of, builds and lints this package but
# does not run its tests: tests/accel.rs scans the sources of every member of the workspace, which
# an action does not have. They run in ci.yml alone.

[package.metadata.buildrules.actions]
ci = ["fmt", "lint"]
