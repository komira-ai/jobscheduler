[package]
name = "js-mac-provision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The host step that limits the egress of a Mac pool's users with a pf anchor. The rules
# and the logic around `pfctl` build and are tested everywhere; only `pfctl` itself needs
# a Mac and root.
[[bin]]
name = "js-mac-provision"
path = "src/main.rs"

[dependencies]
clap.workspace = true
# The one way the agent's code starts a program (`disclaim::Program`): `pfctl`
# is started with its privacy (TCC) responsibility disclaimed on macOS.
js-mac-session = { path = "../js-mac-session" }
# `geteuid`: `install --flags-file` trusts a flags file of root or of the user running it, as the
# agent does.
rustix.workspace = true
thiserror.workspace = true

[dev-dependencies]
js-testkit = { path = "../js-testkit" }

[lints]
workspace = true

[package.metadata.buildrules]
# The farm lane's `//:ci` (docs/farm.md) checks the format of, builds and lints this package but
# does not run its tests: tests/pf_as_root.rs holds `#[ignore]`d tests, and buildrules' test gate
# refuses a test target with an ignored test (it needs root). They run in ci.yml alone.

[package.metadata.buildrules.actions]
ci = ["fmt", "lint"]
