[package]
name = "js-mac-provision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The host step that limits the egress of a Mac pool's users with a pf anchor. The rules
# and the logic around `pfctl` build and are tested everywhere; only `pfctl` itself needs
# a Mac and root.
[[bin]]
name = "js-mac-provision"
path = "src/main.rs"

[dependencies]
clap.workspace = true
# The one way the agent's code starts a program (`disclaim::Program`): `pfctl` and
# `launchctl` are started with their privacy (TCC) responsibility disclaimed on macOS.
js-mac-session = { path = "../js-mac-session" }
thiserror.workspace = true

[dev-dependencies]
js-testkit = { path = "../js-testkit" }

[lints]
workspace = true
