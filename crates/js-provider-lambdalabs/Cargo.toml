[package]
name = "js-provider-lambdalabs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
js-elastic = { path = "../js-elastic" }
js-types = { path = "../js-types" }
rustix = { workspace = true, features = ["fs", "process"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
toml.workspace = true
tracing.workspace = true
ureq.workspace = true

[dev-dependencies]
# The example installs its signal handlers with `libc::signal` (rustix has no form of it);
# libc is already a workspace dependency, so Cargo.lock gains no package.
libc.workspace = true
# Test certificates for the https round trip.
rcgen.workspace = true
# `ureq` writes its own diagnostics through `log`; the test that keeps the API key out of
# every log line installs a `log` sink to read them.
log.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
