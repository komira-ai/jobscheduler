[package]
name = "js-provider-lambdalabs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
js-elastic = { path = "../js-elastic" }
js-types = { path = "../js-types" }
rustix = { workspace = true, features = ["fs", "process"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["rt"] }
toml.workspace = true
tracing.workspace = true
ureq.workspace = true

[dev-dependencies]
# The provider contract's conformance suite (tests/offline/conformance.rs).
js-elastic = { path = "../js-elastic", features = ["conformance"] }
# The example installs its signal handlers with `libc::signal` (rustix has no form of it);
# libc is already a workspace dependency, so Cargo.lock gains no package.
libc.workspace = true
# `mkfifo` for the named pipe of the key tests (tests/offline/key.rs): rustix has `mknodat` on
# Linux only, and the tests run on macOS too.
nix = { workspace = true, features = ["fs"] }
# Test certificates for the https round trip.
rcgen.workspace = true
# `ureq` writes its own diagnostics through `log`; the test that keeps the API key out of
# every log line installs a `log` sink to read them.
log.workspace = true
tracing-subscriber.workspace = true
# The catalog runs its blocking API call on tokio's blocking pool; the tests drive it on a
# multi-thread runtime.
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
# The test that pins what `RootCerts::WebPki` stands for.
webpki-roots.workspace = true

[features]
# Only builds the live conformance target (`tests/live.rs`). It enables no code in the
# library: the target is run by hand against the real cloud (docs/runbooks/live-conformance.md)
# and is never part of a default build or test run.
live = []

[[test]]
name = "live"
path = "tests/live.rs"
harness = false
required-features = ["live"]

[lints]
workspace = true
