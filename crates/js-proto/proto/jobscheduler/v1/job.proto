// The job: what a client submits, the record the service keeps of it, its result, and why
// a submit is refused. The evolution rule of every file of this package is in the header of
// service.proto.

syntax = "proto3";

package jobscheduler.v1;

// How a host runs a job (the `exec` term of the capability vocabulary, design section 3.8).
enum ExecMode {
  // Not given: the job may run in either mode.
  EXEC_MODE_UNSPECIFIED = 0;
  // In a container, through the host's container runtime.
  EXEC_MODE_CONTAINER = 1;
  // Natively, under a sandbox-exec profile (macOS).
  EXEC_MODE_SANDBOX_EXEC = 2;
}

// What a job may reach over the network (design section 5.8). A host refuses at start a
// job that asks for more than its agent allows; it never runs a job with less than it
// asked for. Nothing enforces the level yet.
enum NetworkLevel {
  // Not given: read as none, the default.
  NETWORK_LEVEL_UNSPECIFIED = 0;
  // No route out. A Linux job has loopback only, in its own network namespace.
  NETWORK_LEVEL_NONE = 1;
  // Only the endpoints and DNS resolvers the host's agent is configured with. The list is
  // the operator's; a job picks the level and cannot add endpoints.
  NETWORK_LEVEL_ALLOW_LIST = 2;
  // Any address except what the agent always denies: the link-local range where clouds
  // serve instance metadata, IPv6, and spoofed source addresses.
  NETWORK_LEVEL_OPEN = 3;
}

// How a job is confined on its host.
enum Isolation {
  // Not given: contained, the default.
  ISOLATION_UNSPECIFIED = 0;
  // In a container, or in the native runtime's sandbox.
  ISOLATION_CONTAINED = 1;
  // On the machine itself. The job is admitted only when a host reports that it runs host
  // jobs, else it is refused as having no capable host. The host is tainted for good when
  // the job is placed on it, and takes no other job.
  ISOLATION_HOST = 2;
}

// The resources a job needs of its host. A host is capable when it has at least each of
// them.
message Needs {
  // CPU, in thousandths of a core.
  uint64 cpu_millis = 1;
  // Memory, in bytes.
  uint64 memory_bytes = 2;
  // Scratch disk, in bytes. Absent: none is asked for.
  optional uint64 disk_bytes = 3;
  // The number of GPUs. 0: none. A job that sets only gpus and gpu_class, and no
  // Constraints.accelerator, keeps the meaning it has always had: the class is read through
  // the alias table of design section 3.8, so a full spelling pins its variant and a family
  // name such as nvidia-a100 matches every variant of it.
  uint32 gpus = 4;
  // The GPU class, in the spelling the agent reports: the lower-case model name with its
  // words joined by dashes, such as nvidia-a100-sxm4-80gb. Empty: any class. It is resolved
  // through the alias table like Accelerator.model.
  string gpu_class = 5;
  // The job needs the whole host: it is placed only on a host that holds no other job, and
  // a host is drained for it (design section 5.4). The other needs still bound which hosts
  // are capable.
  bool whole_host = 6;
}

// What a job requires of its host beside resources, in the vocabulary of design section
// 3.8 as it exists today. Each field the job leaves empty matches any host.
message Constraints {
  // The operating system: linux or macos. Empty: any.
  string os = 1;
  // The CPU architecture: x86_64 or arm64. aarch64 is accepted and stored as arm64 (design
  // section 3.8). Empty: any.
  string arch = 2;
  // The mode the host runs jobs in. Unspecified: either.
  ExecMode exec = 3;
  // The least instruction-set level, in request syntax such as x86-64-v3 or armv8.2-a. A
  // host is capable when it reports that level or a higher one of the same architecture.
  // Empty: any.
  string isa_level = 4;
  // The accelerator the job needs, beyond what Needs.gpus and Needs.gpu_class say. Absent:
  // none.
  Accelerator accelerator = 5;
  // How the job is confined. Unspecified: contained.
  Isolation isolation = 6;
}

// One host port forwarded to a port of the job (design section 5.8). New traffic toward a
// job is refused except through its declared ports. A host port is a resource of the host:
// two jobs cannot hold the same one on one host. Nothing enforces the forward yet.
message PortForward {
  // The port on the host, 1 to 65535.
  uint32 host_port = 1;
  // The port inside the job, 1 to 65535.
  uint32 container_port = 2;
}

// One file the host writes for the job before it starts, readable by the job at
// /run/js-files/NAME on a read-only mount.
message JobFile {
  // The file name: letters, digits, dot, underscore and dash, starting with a letter or a
  // digit, unique among the job's files.
  string name = 1;
  // The contents, UTF-8 text such as a URL or a token. They are secret: no response of
  // the service carries them, so this field is empty in every job a read returns.
  string contents = 2;
}

// One read-only layer of a job's root file system (docs/design/job-rootfs.md, section 2).
message Layer {
  // Where the layer comes from: exactly one. A layer with none, or with a source this
  // server does not know, is refused.
  oneof source {
    // An absolute path of a directory on the host, in normal form: no empty, `.` or `..`
    // part and no `/` at its end; at most 4096 bytes, with no control character. The host's
    // operator lists the prefixes a job may name; a path outside them fails to start. Read
    // through the job's id mapping: a file owned by an id outside it reads as owned by
    // 65534, so it needs read (and, to run it, execute) permission for others.
    string host_path = 1;
    // An image from a registry the host allows, pinned by digest: NAME[:TAG]@sha256:HEX. Its
    // own layers are flattened into one tree (whiteouts applied), which is the layer; its
    // configuration (entrypoint, command, environment) is not used.
    string image = 2;
  }
}

// How a mount's tree appears in the job.
enum MountMode {
  // Read as read-only in a request. The server stores and answers the explicit value, so a
  // job it returns never holds this; a reader that meets it, or a value it does not know,
  // treats the mount as one it cannot read.
  MOUNT_MODE_UNSPECIFIED = 0;
  // The job cannot write the tree, nor anything mounted below it in the source.
  MOUNT_MODE_READ_ONLY = 1;
  // The job's writes reach the source. For a host path, the host's operator lists the
  // prefixes a job may mount read-write.
  MOUNT_MODE_READ_WRITE = 2;
  // The job may change the tree; its changes are its own, kept in the job's scratch, and
  // never reach the source.
  MOUNT_MODE_COPY_ON_WRITE = 3;
}

// Whether mounts made on one side of a mount appear on the other.
enum MountPropagation {
  // Read as private in a request; never in a job the server returns, as for MountMode.
  MOUNT_PROPAGATION_UNSPECIFIED = 0;
  // Neither side sees the other's later mounts: the job sees what was mounted below the
  // source when its start was prepared, and nothing the host mounts or unmounts after.
  MOUNT_PROPAGATION_PRIVATE = 1;
}

// A tree at a path in the job's file system.
message Mount {
  // Where the tree comes from: exactly one. Numbers 1 to 9 are kept for sources. A mount
  // with none, or with a source this server does not know, is refused.
  oneof source {
    // An absolute path of a directory on the host, held to the rules of Layer.host_path.
    string host_path = 1;
  }
  // Where it appears: an absolute path in the job's file system in normal form, not "/",
  // ASCII, with no `:`, `,` or `\`, at most 4096 bytes, and not in a place the runtime keeps
  // for itself (/proc, /dev, /sys, /run/js-files, /scratch, /root, /tmp, /var/tmp, /run, or
  // below one). No two mounts of a job have the same target, compared in lower case; one may
  // lie below another.
  string target = 10;
  // How the job may change the tree. Unspecified: read-only.
  MountMode mode = 11;
  // A relative path in the source whose directory is mounted instead of the source's root,
  // in normal form, at most 4096 bytes, with no control character. It is resolved beneath
  // the source: a link in it may not lead out of the source. Empty: the source's root.
  string sub_path = 12;
  // No file in the mount may be executed or mapped executable (noexec); an interpreter can
  // still read one. False: as the files' modes allow. Set-id bits and device files are
  // ignored in every mount, whatever this says.
  bool no_exec = 13;
  // Unspecified: private.
  MountPropagation propagation = 14;
}

// The transport of a host port.
enum PortProtocol {
  // Read as TCP in a request; never in a job the server returns, as for MountMode.
  PORT_PROTOCOL_UNSPECIFIED = 0;
  // A TCP connection to the host port, through a listener at the job's port.
  PORT_PROTOCOL_TCP = 1;
}

// A port on the host's loopback (127.0.0.1) that the job reaches at a port of its own
// loopback. Not a PortForward, which is the other direction.
message HostPort {
  // The port on the host's loopback: 1 to 65535. The host's operator lists the ports a job
  // may name.
  uint32 host_port = 1;
  // The port on the job's loopback at which it reaches host_port: 1 to 65535. Absent: the
  // same number as host_port; a job the server returns always holds it. No two host ports of
  // one protocol have the same job port, and none is the container_port of one of the job's
  // ports. A job port other than host_port runs the job in a container.
  optional uint32 container_port = 2;
  // Unspecified: TCP.
  PortProtocol protocol = 3;
}

// A job as the client submits it: one OCI image run to completion (design section 3.2).
message JobSpec {
  // The job's id: 1 to 63 bytes of letters, digits, dot, underscore and dash (design
  // section 5.3; the service checks it). Submitting the same id with the same job (every
  // field but the priority) answers from the job already made; the same id with a
  // different job is refused job-id-conflict. Empty: the service mints one, so a submit
  // without an id that is repeated after a lost answer makes a second job.
  string job_id = 1;
  // The image, pinned by digest: NAME@sha256:HEX, with an optional tag after the name. The
  // service rejects an image without a digest. Empty only when layers is not: the root is
  // then the layers alone.
  string image = 2;
  // The program to run. Empty: the image's default. How it combines with the image's own
  // entrypoint and command is set by the server that implements SubmitJob. With an empty
  // image, the absolute path of the program in the job's root.
  string command = 3;
  // The arguments the program is started with, in order.
  repeated string args = 4;
  // The environment of the job, by variable name.
  map<string, string> env = 5;
  // The resources the job needs.
  Needs needs = 10;
  // The constraints on the host beside resources.
  Constraints constraints = 11;
  // The most seconds the job may run, counted from running. The service refuses a job
  // without one (absent or 0, wall-time-not-positive) and one above its ceiling
  // (wall-time-above-ceiling).
  optional uint64 wall_limit_seconds = 20;
  // What the job may reach over the network. Unspecified: none.
  NetworkLevel network = 30;
  // The host ports forwarded to the job. Empty: none, and no inbound path to the job.
  repeated PortForward ports = 31;
  // Ports on the host's loopback the job may connect to, each at a port of its own
  // loopback, whatever its network level: at most 16. Empty: none. A job with host ports,
  // layers or mounts runs only on a host that reports it can give them, and never with host
  // isolation.
  repeated HostPort host_ports = 32;
  // The files the host writes for the job before it starts.
  repeated JobFile files = 40;
  // The job's priority among queued jobs. 0 when not given. A resubmit that differs from
  // the job already made only in its priority is the same job (design section 5.3).
  int32 priority = 50;
  // The client's labels, by key. A listing can filter by them.
  map<string, string> labels = 51;
  // The read-only layers of the job's root, base first, stacked on image (or in place of it,
  // when image is empty): at most 16. A later layer's file hides an earlier one's. With
  // layers, the root is writable and the writes are the job's own, and the job runs in a
  // container. Empty: the root is image alone, read-only, as before.
  repeated Layer layers = 60;
  // Trees at paths in the job's file system: at most 64. Empty: none.
  repeated Mount mounts = 61;
}

// The states of a job (design section 3.2). Queued, placed, starting and running are live;
// the others are ended and do not change again.
enum JobState {
  // No state: a server never sends it, and a reader reads a state it does not know (one a
  // newer server added) as this value.
  JOB_STATE_UNSPECIFIED = 0;
  // Recorded and waiting for placement. It books nothing.
  JOB_STATE_QUEUED = 1;
  // A host was chosen and the job's resources there are booked. A whole-host job stays
  // placed until its host is quiet and ready.
  JOB_STATE_PLACED = 2;
  // The host's agent has the start and is fetching the image and making the container.
  JOB_STATE_STARTING = 3;
  // The container is running. The wall limit is counted from here.
  JOB_STATE_RUNNING = 4;
  // Ended with exit code 0.
  JOB_STATE_SUCCEEDED = 5;
  // Ended with a nonzero exit code, or stopped at the wall limit or for memory; the result
  // says which.
  JOB_STATE_FAILED = 6;
  // Ended because the client cancelled it.
  JOB_STATE_CANCELLED = 7;
  // The job's container is gone and no result exists: the provider says the host is
  // absent, or the host came back and does not list the job.
  JOB_STATE_LOST = 8;
  // The job did not get to run; the job's start failure says why.
  JOB_STATE_FAILED_TO_START = 9;
}

// Why a job failed to start (design section 3.2).
enum StartFailureCode {
  // The job did not fail to start.
  START_FAILURE_CODE_UNSPECIFIED = 0;
  // No capacity came within the pool's maximum queue wait.
  START_FAILURE_CODE_NO_CAPACITY = 1;
  // The start did not complete within the pool's start timeout, counted from placement.
  START_FAILURE_CODE_START_TIMEOUT = 2;
  // The whole-host prepare failed as many times as the pool allows.
  START_FAILURE_CODE_EXCLUSIVE_NOT_READY = 3;
  // The host's agent refused the start, for example because the host is tainted or the
  // image fetch failed; the start failure detail holds the agent's own code.
  START_FAILURE_CODE_AGENT_REFUSED = 4;
  // An input the job named could not be read on its host: a host path of a layer or mount
  // that is missing, is not a directory, cannot be read, or did not answer in time. The
  // host's state, not the job's: another host or a later try may succeed. The start failure
  // detail holds the agent's code.
  START_FAILURE_CODE_INPUT_UNAVAILABLE = 5;
}

// The times of a job, in milliseconds since the Unix epoch. A time the job has not reached
// is absent.
message JobTimes {
  // When the job was recorded as queued.
  uint64 queued_at_ms = 1;
  // When the job was placed.
  optional uint64 placed_at_ms = 2;
  // When the job started running.
  optional uint64 started_at_ms = 3;
  // When the job ended.
  optional uint64 ended_at_ms = 4;
}

// Why a queued job is where it is (docs/design/queue-status.md). The service writes only
// these values; a later release may append one, and a reader that meets a value it does not
// know reads it as unspecified.
enum QueueStatusCode {
  // Nothing has been recorded of the job yet, or a reader met a value it does not know.
  QUEUE_STATUS_CODE_UNSPECIFIED = 0;
  // No open host has room for the job now; the detail says whether any open host could run
  // it at all.
  QUEUE_STATUS_CODE_WAITING_FOR_CAPACITY = 1;
  // The job books a whole host and none is free; the detail names the host being emptied for
  // it, when one is.
  QUEUE_STATUS_CODE_WAITING_FOR_WHOLE_HOST = 2;
  // A machine for the job was refused for quota: its instance type is passed over in that
  // region for a while.
  QUEUE_STATUS_CODE_QUOTA_BACKOFF = 3;
  // A machine for the job was refused for capacity: the next zone, offer or provider is asked.
  QUEUE_STATUS_CODE_FAILING_OVER = 4;
  // The job was placed on a host.
  QUEUE_STATUS_CODE_PLACED = 5;
  // A machine was launched for the job, and the job waits for it to join.
  QUEUE_STATUS_CODE_WAITING_FOR_MACHINE = 6;
}

// Why a job is where it is in the queue, and since when.
message QueueStatus {
  // The reason. A program acts on this only.
  QueueStatusCode code = 1;
  // Text for a person saying more.
  string detail = 2;
  // When the code last changed, in milliseconds since the Unix epoch. A change of the detail
  // alone leaves it as it was.
  uint64 since_ms = 3;
}

// What one event of a job's history says happened. A later release may append a value; a
// reader that meets one it does not know reads it as unspecified.
enum JobEventKind {
  // Not a kind: what a value this reader does not know reads as.
  JOB_EVENT_KIND_UNSPECIFIED = 0;
  // The job began to wait for room.
  JOB_EVENT_KIND_WAITING_FOR_CAPACITY = 1;
  // The job began to wait for a whole host.
  JOB_EVENT_KIND_WAITING_FOR_WHOLE_HOST = 2;
  // A machine for the job was refused for quota.
  JOB_EVENT_KIND_QUOTA_BACKOFF = 3;
  // A machine for the job was refused for capacity.
  JOB_EVENT_KIND_FAILING_OVER = 4;
  // The job was placed on a host; the event names the host.
  JOB_EVENT_KIND_PLACED = 5;
  // A failed whole-host prepare sent the placed job back to the queue; the event names the
  // host.
  JOB_EVENT_KIND_REQUEUED = 6;
  // A machine was launched for the job.
  JOB_EVENT_KIND_WAITING_FOR_MACHINE = 7;
}

// One event of a job's history.
message JobEvent {
  // When the service recorded it, in milliseconds since the Unix epoch.
  uint64 at_ms = 1;
  // What happened.
  JobEventKind kind = 2;
  // Text for a person saying more.
  string detail = 3;
  // The host the event names: the one the job was placed on, or sent back from. Absent
  // otherwise.
  optional string host_id = 4;
}

// The record the service keeps of a job.
message Job {
  // The job's id, the client's or the one the service minted.
  string id = 1;
  // The job as submitted. Each file's contents are empty here (JobFile says why).
  JobSpec spec = 2;
  // The job's state.
  JobState state = 3;
  // Why the job failed to start, when its state is failed to start; unspecified otherwise.
  StartFailureCode start_failure = 4;
  // The agent's own code or text for a start failure, when it gave one. Empty otherwise.
  string start_failure_detail = 5;
  // The host the job is placed on, once it is placed. Empty before.
  string host_id = 10;
  // The job's times.
  JobTimes times = 20;
  // Since when the host holding the job has missed its grace, in milliseconds since the
  // Unix epoch (design section 6.3). Absent while the host is heard, or when no host holds
  // the job.
  optional uint64 host_silent_since_ms = 30;
  // The client asked to cancel the job and it has not yet ended. Also kept on a job that
  // ended lost after the cancel was asked for.
  bool cancel_requested = 31;
  // The name of the client whose token submitted the job, as the server's configuration
  // names it (`--client-token NAME=PATH`, a `[[client]]` table, or `default` for
  // `--token-file`). Set by the server, never by the request: a retry of the same job from
  // another client keeps the first. Absent on a job recorded before clients were named.
  optional string client = 32;
  // Why the job is where it is in the queue (docs/design/queue-status.md). Absent while
  // nothing has been recorded, and on a job that ended without being placed; a placed,
  // running or ended job that was placed shows placed.
  QueueStatus queue_status = 33;
  // How many placement attempts the job had: each placement and each machine refused for it.
  uint32 attempts = 34;
  // The job's newest events, oldest first: at most 32.
  repeated JobEvent events = 35;
  // How many older events were dropped to keep the bound, so this plus the events kept is
  // the number the job ever had.
  uint32 dropped_events = 36;
}

// How an ended job ended, as its result says.
enum ResultReason {
  // No reason: the job ended without one (lost, or failed to start), or a reader met a
  // reason it does not know.
  RESULT_REASON_UNSPECIFIED = 0;
  // The job's process exited by itself; the exit code says how.
  RESULT_REASON_EXIT = 1;
  // The job was stopped at its wall limit.
  RESULT_REASON_WALL_LIMIT = 2;
  // The job was stopped because it passed its memory.
  RESULT_REASON_MEMORY = 3;
  // The job was stopped because the client cancelled it.
  RESULT_REASON_CANCELLED = 4;
  // A host path or host port the job named failed while it ran, and the job did not
  // succeed: the failure is the host's, not the job's. The state is failed; the exit code is
  // kept, and input_failure names the failure.
  RESULT_REASON_INPUT_FAILED = 5;
}

// The resources a job used, as the host's agent reported them.
message ResourceUsage {
  // CPU time, in microseconds.
  uint64 cpu_usec = 1;
  // The largest memory the job held at once, in bytes.
  uint64 peak_memory_bytes = 2;
  // The scratch disk the job used, in bytes. Absent: the agent did not measure it.
  optional uint64 disk_bytes = 3;
  // The number of GPUs the job held.
  uint32 gpus = 4;
}

// The result of an ended job.
message JobResult {
  // The state the job ended in.
  JobState state = 1;
  // The job's exit code, when its process exited by itself. Absent otherwise.
  optional int32 exit_code = 2;
  // How the job ended.
  ResultReason reason = 3;
  // The last bytes the job wrote to its standard output: at most 8 KiB (8192 bytes).
  bytes stdout_tail = 4;
  // The last bytes the job wrote to its standard error: at most 8 KiB (8192 bytes).
  bytes stderr_tail = 5;
  // The job wrote more to either stream than its tail holds.
  bool truncated = 6;
  // The job's times.
  JobTimes times = 10;
  // The resources the job used.
  ResourceUsage usage = 11;
  // With RESULT_REASON_INPUT_FAILED: the agent's code, such as input-unreadable or
  // host-port-lost. Absent otherwise.
  optional string input_failure = 12;
}

// Why the service refuses a submit. A refused submit records nothing, so the client may
// change the job and submit it again.
enum RefusalCode {
  // Not a refusal code: a reader reads a code it does not know (one a newer server added)
  // as this value.
  REFUSAL_CODE_UNSPECIFIED = 0;
  // The job id names a job that differs from this one in more than its priority.
  REFUSAL_CODE_JOB_ID_CONFLICT = 1;
  // No host, catalog or platform could ever serve the job (design section 5.6).
  REFUSAL_CODE_NO_CAPABLE_HOST = 2;
  // The job has no wall limit, or one of 0.
  REFUSAL_CODE_WALL_TIME_NOT_POSITIVE = 3;
  // The job's wall limit is above the service's ceiling.
  REFUSAL_CODE_WALL_TIME_ABOVE_CEILING = 4;
}

// A refused submit, carried in the details of the call's gRPC status. Only the faults of
// RefusalCode carry one; any other fault of a job (a bad id, image, file or port) answers
// an error status without a Refusal.
message Refusal {
  // Why the submit is refused.
  RefusalCode code = 1;
  // Text for a person saying more. A program acts on the code only.
  string detail = 2;
}

// What a job needs of an accelerator, in the vocabulary of design section 3.8 (the
// accelerator.* capability keys). Each field left out matches any host. A count above zero
// needs a model, because the GPUs it books need a class. A vendor alone books no GPU.
message Accelerator {
  // The vendor, such as nvidia.
  optional string vendor = 1;
  // The model: a family such as nvidia-a100, or a full spelling such as nvidia-a100-sxm4-80gb.
  optional string model = 2;
  // The least number of devices.
  optional uint32 count = 3;
  // The least memory of each device, in whole GiB.
  optional uint32 memory_per_device_gib = 4;
  // The least interconnect, as kind>=size.
  optional string interconnect = 5;
  // The form factor: sxm or pcie.
  optional string form_factor = 6;
}
