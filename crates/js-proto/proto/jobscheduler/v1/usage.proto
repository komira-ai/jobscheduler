// Usage history: one record for each booking of a job on a host that has ended, with what
// was booked against what was used. A whole-host job placed again after a failed prepare
// has one record for each placement. The evolution rule of every file of this package is in
// the header of service.proto.

syntax = "proto3";

package jobscheduler.v1;

import "jobscheduler/v1/fleet.proto";
import "jobscheduler/v1/job.proto";

// How a whole-host job got its host (design sections 5.4 and 5.5).
enum WholeHostOutcome {
  // The job was not a whole-host job, or a reader met a value it does not know.
  WHOLE_HOST_OUTCOME_UNSPECIFIED = 0;
  // A host was already quiet, so none was drained.
  WHOLE_HOST_OUTCOME_QUIET_HOST = 1;
  // A marked host was drained and committed to the job.
  WHOLE_HOST_OUTCOME_DRAINED = 2;
}

// One ended booking: a job's resources on one host, from placement until the host
// confirmed the job's container gone or its provider said the host is absent.
message UsageRecord {
  // The job the resources were booked for.
  string job_id = 1;
  // The host they were booked on.
  string host_id = 2;
  // How long the job waited from queued to placed, in milliseconds.
  uint64 queue_wait_ms = 3;
  // How long the job ran, from running to its end, in milliseconds. 0 for a job that did
  // not run.
  uint64 run_ms = 4;
  // The job's state when the booking ended: its ended state, or queued for a booking freed
  // by a failed whole-host prepare.
  JobState end_state = 5;
  // How the job ended, as its result says. Unspecified for a job without a result.
  ResultReason ended_reason = 6;
  // When the booking ended, in milliseconds since the Unix epoch. A usage window selects
  // records by it.
  uint64 ended_at_ms = 7;
  // The resources that were booked.
  HostBooking booked = 10;
  // The resources the job used, as the host's agent reported them.
  ResourceUsage used = 11;
  // How a whole-host job got its host.
  WholeHostOutcome whole_host = 20;
  // How many times a mark set for the whole-host job was given up at its deadline before
  // the job got a host.
  uint32 mark_give_ups = 21;
  // The run time placement estimated for the job, in milliseconds. Absent: it had no
  // estimate.
  optional uint64 estimated_run_ms = 22;
  // The job's CPU second by second over its run, as its host's agent reported it. Absent:
  // the agent reported none (an agent from before it, or one that does not record it), or
  // the series it sent was not well formed.
  CpuSeries cpu_series = 23;
  // The attempt of the job the booking was for, from 1. Absent: 1.
  optional uint32 attempt = 24;
  // The job's non-file memory second by second over its run, as its host's agent reported
  // it. Absent: the agent reported none (an agent from before it, or one started without
  // --memory-series), or the series it sent was not well formed. A reader from before the
  // field skips it as unknown.
  MemorySeries memory_series = 25;
}

// A job's CPU over its run: at most 128 points, each the mean CPU of the job over
// granularity_secs seconds of its run, in order from its start. A run starts at one second a
// point; each time it outlasts its points, neighbouring points are combined in pairs by
// their mean and the granularity doubles. The last point covers what is left of the run
// after the others. Kept as the agent reported it.
message CpuSeries {
  // The seconds each point covers: a power of two, 1, 2, 4, 8 and so on.
  uint32 granularity_secs = 1;
  // The mean CPU of each span of the run, in sixteenths of a core: 16 is one core busy for
  // the whole span. At most 128 points; each at most 65535.
  repeated uint32 points = 2;
  // The job's run as its agent measured it, in microseconds.
  uint64 run_usec = 3;
  // The series misses the start of the run: the agent adopted the run after a restart of
  // its own and began to record it then.
  bool partial = 4;
}

// A job's non-file memory over its run: at most 128 points, each the most the job held over
// granularity_secs seconds of its run, in order from its start. Non-file memory is what the
// job's control group held that the kernel cannot drop to make room: its anonymous and kernel
// memory, its shared memory and its tmpfs pages (memory.current less the file pages that are
// not shared memory, from memory.stat), and none of the page cache of the files it read, which
// the kernel can drop. On a Mac it is the physical footprint of the job's processes together.
// The agent samples it about once a second. A run starts at one second a point; each time it
// outlasts its points, neighbouring points are combined in pairs by their maximum and the
// granularity doubles, so the largest point is the most any sample saw. The last point covers
// what is left of the run after the others. Kept as the agent reported it.
message MemorySeries {
  // The seconds each point covers: a power of two, 1, 2, 4, 8 and so on.
  uint32 granularity_secs = 1;
  // The most non-file memory of each span of the run, in MiB (1,048,576 bytes) rounded up.
  // At most 128 points.
  repeated uint32 points = 2;
  // The job's run as its agent measured it, in microseconds.
  uint64 run_usec = 3;
  // The series misses the start of the run: the agent adopted the run after a restart of
  // its own and began to record it then.
  bool partial = 4;
}
