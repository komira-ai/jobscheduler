[package]
name = "js-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "js-agent"
path = "src/main.rs"

# `js-agent update-hook` over the fake ports (tests/update_hook_fakes), for the conformance
# harness. Not shipped.
[[bin]]
name = "js-update-hook-fake"
path = "tests/bin/update_hook_fake.rs"
test = false

# The launch time of a `crun` job with egress mode none and with an allow-list, through the
# agent's own `CrunRuntime` (tests/launch_measure), for the manual workflow
# js-launch-measure.yml. A measurement, not a test. Not shipped.
[[bin]]
name = "js-launch-measure"
path = "tests/bin/launch_measure.rs"
test = false

[dependencies]
js-agent-usage = { path = "../js-agent-usage" }
js-agent-wire = { path = "../js-agent-wire" }
js-bundle = { path = "../js-bundle" }
js-caps = { path = "../js-caps" }
js-client = { path = "../js-client" }
# The live-log store client (src/logs).
js-logstore = { path = "../js-logstore" }
js-mac-pool = { path = "../js-mac-pool" }
js-mac-provision = { path = "../js-mac-provision" }
js-mac-session = { path = "../js-mac-session" }
js-oci = { path = "../js-oci" }
js-treestore = { path = "../js-treestore" }
js-types = { path = "../js-types" }
# The update hook's service-independent parts (src/update_hook).
js-update-hook = { path = "../js-update-hook" }
# The seam of a VM lease's VM (src/vm) and the protocol of `js-vmm lease`, which runs the real
# driver: the agent starts that binary and links nothing of it.
js-vm-lease = { path = "../js-vm-lease" }
async-trait.workspace = true
clap.workspace = true
getrandom.workspace = true
hex.workspace = true
# `TokioIo`, the stream a provider channel's connector hands tonic (src/provider).
hyper-util = { workspace = true, features = ["tokio"] }
# The project-quota calls (`ioctl`, `quotactl`) of src/quota, the supervisor's `wait4`
# (src/mac_supervisor/run.rs) and a Mac's process and host statistics (src/mac_usage/macos.rs,
# src/usage/macos.rs): rustix has no form of them.
libc.workspace = true
# Property lists read as XML: the `version.plist` of an installed Xcode (src/xcode), and what
# `diskutil -plist` prints, which the update hook's host setup of a Mac reads
# (src/update_hook/step/host_setup.rs).
plist.workspace = true
# The messages of the mount providers' protocol, declared in src/provider/wire.rs: the agent
# does not link js-proto, the job service's crate.
prost.workspace = true
# `net` and `thread`: the listeners of a job's host ports, bound in its network namespace
# (src/host_ports).
rustix = { workspace = true, features = ["fs", "net", "process", "thread"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# `fs`: the layer files of the image source (src/image). `net` and `time`: the runtime of
# the `image-pull` verb (src/image/pull.rs). `rt-multi-thread`: the runtime the image
# pulls run on (src/lifecycle/prefetch.rs). `io-util`: the copying of a job's host ports
# (src/host_ports).
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
toml.workspace = true
# `channel`: the lazily connected client of a mount provider's socket (src/provider).
tonic = { workspace = true, features = ["channel"] }
# The protobuf codec of a provider call (src/provider).
tonic-prost.workspace = true
tracing.workspace = true
# The subscriber that writes the agent's warnings to its journal (src/warnings.rs).
tracing-subscriber.workspace = true
# The metadata service of `--identity-source` (src/identity), over plain HTTP.
ureq.workspace = true

# The crun image source and the image config (src/image), and the helper modes this binary
# answers when a helper container runs it (`main`), are Linux code: js-contain drives `crun`
# and is not built for the macOS target.
[target.'cfg(target_os = "linux")'.dependencies]
js-contain = { path = "../js-contain" }

# OpenDirectory's local node, where the accounts of native Mac jobs are made and deleted
# (src/mac_accounts/macos).
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSArray", "NSDictionary", "NSError", "NSString"] }
objc2-open-directory = { workspace = true, features = [
    "CFOpenDirectory",
    "CFOpenDirectoryConstants",
    "ODNode",
    "ODQuery",
    "ODRecord",
    "ODSession",
] }

[dev-dependencies]
# The `js join-token` verb's library entry point mints the join tokens the join round trip
# starts agents with (tests/agent/join_round_trip.rs).
js-cli = { path = "../js-cli" }
js-lease-server = { path = "../js-lease-server" }
# The STS minter the uploader's tests against the S3-compatible test store take their
# credentials from (tests/agent/lifecycle/live_logs.rs, tests/crun_stand_in/s3_compat.rs).
js-logmint = { path = "../js-logmint" }
# The in-memory log store the uploader's tests put to (src/logs, tests/crun_stand_in).
js-logstore = { path = "../js-logstore", features = ["fake"] }
# The providers' verifiers of a signed identity, which the hello of `--identity-source` is
# checked against (tests/agent/identity.rs).
js-provider-ec2 = { path = "../js-provider-ec2" }
js-provider-gce = { path = "../js-provider-gce" }
js-registry = { path = "../js-registry" }
# The job tables the quota tests queue jobs on (tests/agent/jobs/quota_start.rs).
js-jobs = { path = "../js-jobs", features = ["test-support"] }
# The production placer the quota tests give their registry and run a pass of
# (tests/agent/jobs/quota_start.rs).
js-sched-placer = { path = "../js-sched-placer" }
# The in-memory store under those job tables.
js-state = { path = "../js-state", features = ["test-support"] }
# The generated messages of the mount providers' protocol, which the agent's own declarations
# are held to (tests/agent/provider_wire.rs).
js-proto = { path = "../js-proto" }
# `mount-provider`: the fake provider the client's tests ask (tests/agent/provider_client.rs).
js-testkit = { path = "../js-testkit", features = ["mount-provider", "oci-registry"] }
# The recording VM driver the VM runtime's tests drive (tests/agent/vm).
js-vm-lease = { path = "../js-vm-lease", features = ["fake"] }
clap.workspace = true
# `net`: a socket bound and never listening, for a server that is down (update_hook/lease_port).
# `event`: the bounded waits of the stand-in host-port tests (crun_stand_in/host_ports.rs).
rustix = { workspace = true, features = ["event", "net", "process", "thread"] }
tar.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
# hostkeeper's hook contract and its conformance harness (tests/agent/update_hook/conformance.rs).
hostkeeper-hook = { workspace = true, features = ["conformance"] }
# hostkeeper's daemon's step runner: a first install of the package as a native entry, run as the
# daemon runs it (tests/agent/update_hook/hostkeeper_runner.rs).
hostkeeper-steps.workspace = true
# The certificates the host certificate tests mint (tests/agent/update_hook/machine_host_certificate.rs).
rcgen.workspace = true

[lints]
workspace = true

[package.metadata.buildrules]
# The farm lane's `//:ci` (docs/farm.md) checks the format of this package but does not build it:
# it depends on js-contain, directly or through a dev-dependency, and its build compiles `js-init`
# (crates/js-contain/build.rs), which must be a static executable, and buildrules' linker links it
# dynamically and succeeds (komira-ai/buildrules#173), which `build.rs` refuses. So the farm checks
# this package's format only; it is built, linted and tested in ci.yml.

[package.metadata.buildrules.actions]
ci = ["fmt"]
