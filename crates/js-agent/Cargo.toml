[package]
name = "js-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "js-agent"
path = "src/main.rs"

[dependencies]
js-agent-usage = { path = "../js-agent-usage" }
js-agent-wire = { path = "../js-agent-wire" }
js-bundle = { path = "../js-bundle" }
js-caps = { path = "../js-caps" }
js-client = { path = "../js-client" }
js-oci = { path = "../js-oci" }
js-treestore = { path = "../js-treestore" }
js-types = { path = "../js-types" }
async-trait.workspace = true
clap.workspace = true
getrandom.workspace = true
hex.workspace = true
# The project-quota calls (`ioctl`, `quotactl`) of src/quota: rustix has no form of them.
libc.workspace = true
rustix = { workspace = true, features = ["process"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# `fs`: the layer files of the image source (src/image). `rt-multi-thread`: the runtime the
# image pulls run on (src/lifecycle/prefetch.rs).
tokio = { workspace = true, features = ["fs", "rt", "rt-multi-thread", "signal"] }

# The crun image source and the image config (src/image), and the helper modes this binary
# answers when a helper container runs it (`main`), are Linux code: js-contain drives `crun`
# and is not built for the macOS target.
[target.'cfg(target_os = "linux")'.dependencies]
js-contain = { path = "../js-contain" }

[dev-dependencies]
js-lease = { path = "../js-lease" }
js-lease-server = { path = "../js-lease-server" }
js-pool-static = { path = "../js-pool-static" }
js-provider = { path = "../js-provider" }
js-registry = { path = "../js-registry" }
js-testkit = { path = "../js-testkit", features = ["oci-registry"] }
clap.workspace = true
rustix = { workspace = true, features = ["process", "thread"] }
tar.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
