[package]
name = "js-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "js-agent"
path = "src/main.rs"

# `js-agent update-hook` over the fake ports (tests/update_hook_fakes), for the conformance
# harness. Not shipped.
[[bin]]
name = "js-update-hook-fake"
path = "tests/bin/update_hook_fake.rs"
test = false

# The launch time of a `crun` job with egress mode none and with an allow-list, through the
# agent's own `CrunRuntime` (tests/launch_measure), for the manual workflow
# js-launch-measure.yml. A measurement, not a test. Not shipped.
[[bin]]
name = "js-launch-measure"
path = "tests/bin/launch_measure.rs"
test = false

[dependencies]
js-agent-usage = { path = "../js-agent-usage" }
js-agent-wire = { path = "../js-agent-wire" }
js-bundle = { path = "../js-bundle" }
js-caps = { path = "../js-caps" }
js-client = { path = "../js-client" }
# The live-log store client (src/logs).
js-logstore = { path = "../js-logstore" }
js-mac-pool = { path = "../js-mac-pool" }
js-mac-provision = { path = "../js-mac-provision" }
js-mac-session = { path = "../js-mac-session" }
js-oci = { path = "../js-oci" }
js-treestore = { path = "../js-treestore" }
js-types = { path = "../js-types" }
# The update hook's service-independent parts (src/update_hook).
js-update-hook = { path = "../js-update-hook" }
async-trait.workspace = true
clap.workspace = true
getrandom.workspace = true
hex.workspace = true
# The project-quota calls (`ioctl`, `quotactl`) of src/quota: rustix has no form of them.
libc.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# `fs`: the layer files of the image source (src/image). `net` and `time`: the runtime of
# the `image-pull` verb (src/image/pull.rs). `rt-multi-thread`: the runtime the image
# pulls run on (src/lifecycle/prefetch.rs).
tokio = { workspace = true, features = ["fs", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
toml.workspace = true
tracing.workspace = true

# The crun image source and the image config (src/image), and the helper modes this binary
# answers when a helper container runs it (`main`), are Linux code: js-contain drives `crun`
# and is not built for the macOS target.
[target.'cfg(target_os = "linux")'.dependencies]
js-contain = { path = "../js-contain" }

[dev-dependencies]
js-lease = { path = "../js-lease" }
js-lease-server = { path = "../js-lease-server" }
# The STS minter the uploader's tests against the S3-compatible test store take their
# credentials from (tests/agent/lifecycle/live_logs.rs, tests/crun_stand_in/s3_compat.rs).
js-logmint = { path = "../js-logmint" }
# The in-memory log store the uploader's tests put to (src/logs, tests/crun_stand_in).
js-logstore = { path = "../js-logstore", features = ["fake"] }
js-provider = { path = "../js-provider" }
js-registry = { path = "../js-registry" }
js-testkit = { path = "../js-testkit", features = ["oci-registry"] }
clap.workspace = true
# `net`: a socket bound and never listening, for a server that is down (update_hook/lease_port).
rustix = { workspace = true, features = ["net", "process", "thread"] }
tar.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing-subscriber.workspace = true
# The hook contract's conformance harness, run against `js-update-hook-fake`
# (tests/agent/update_hook/conformance.rs).
update-hook.workspace = true

[lints]
workspace = true
