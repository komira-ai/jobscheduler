[package]
name = "js-bundle-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `js-bundle`: packs directories into a darwin bundle in an OCI image-layout directory,
# prints one, verifies one, and pushes one to a registry. The format is the `js-bundle`
# crate's, the layout reader and the registry client are the `js-oci` crate's; this crate is
# the command line around them.
[[bin]]
name = "js-bundle"
path = "src/main.rs"

[dependencies]
clap.workspace = true
js-bundle = { path = "../js-bundle" }
js-oci = { path = "../js-oci" }
rustix = { workspace = true, features = ["fs"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `net` and `time` for `push`, whose registry client connects and bounds every wait.
tokio = { workspace = true, features = ["net", "rt", "time"] }

[dev-dependencies]
# The registry in this process that `push` is run against (tests/push.rs).
js-testkit = { path = "../js-testkit", features = ["oci-registry"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
