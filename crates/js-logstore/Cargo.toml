[package]
name = "js-logstore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The `fake` module: an in-memory object store that checks every request's signature and the
# session policy of the credential it was issued with. Test support: the crate's own tests turn
# it on through the `[dev-dependencies]` entry below, and a crate that talks to the store turns
# it on in its own `[dev-dependencies]` entry for js-logstore.
fake = []

[dependencies]
hmac.workspace = true
# The crypto provider of the TLS client (ureq is built without one).
rustls.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
ureq.workspace = true

[dev-dependencies]
# tests/ see only the features turned on, so the fake store comes in through this entry.
js-logstore = { path = ".", features = ["fake"] }
# The STS minter, and where the S3-compatible test store is, for the client's tests against
# that store (tests/s3_compat, ignored unless CI's test job runs them).
js-logmint = { path = "../js-logmint" }
js-testkit = { path = "../js-testkit" }

[lints]
workspace = true

[package.metadata.buildrules]
# The farm lane's `//:ci` (docs/farm.md) checks the format of, builds and lints this package but
# does not run its tests: tests/logstore holds `#[ignore]`d tests, and buildrules' test gate
# refuses a test target with an ignored test (they need an S3-compatible store). They run in ci.yml
# alone.

[package.metadata.buildrules.actions]
ci = ["fmt", "lint"]
