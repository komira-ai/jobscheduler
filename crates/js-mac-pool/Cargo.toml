[package]
name = "js-mac-pool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The pool of Mac users and what runs as them. Today: the Seatbelt profile builder, a
# pure function from a typed policy to profile text and the `sandbox-exec` argv, the
# allow-list read model with its start-up self-test, and the catalog of host Xcodes.

[dependencies]
js-bundle = { path = "../js-bundle" }
thiserror.workspace = true

[lints]
workspace = true

[package.metadata.buildrules]
# The farm lane's `//:ci` (docs/farm.md) checks the format of, builds and lints this package but
# does not run its tests: its work_root and trace_base_set targets hold `#[ignore]`d tests, and
# buildrules' test gate refuses a test target with an ignored test. They run in ci.yml alone.

[package.metadata.buildrules.actions]
ci = ["fmt", "lint"]
