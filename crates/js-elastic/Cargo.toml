[package]
name = "js-elastic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The `conformance` module: the cases every provider runs against its own rig. Test-only
# and dependency-free; a provider crate enables it in its `[dev-dependencies]` entry for
# js-elastic.
conformance = []

[dependencies]
js-types = { path = "../js-types" }
# The short hash in a host's name (`HostName::derive`).
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
# tests/conformance.rs runs a case of the `conformance` module against a provider that
# breaks its rule (the files in tests/ see only the features turned on).
js-elastic = { path = ".", features = ["conformance"] }

[lints]
workspace = true
