[package]
name = "js-lease-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
js-alert = { path = "../js-alert" }
js-agent-wire = { path = "../js-agent-wire" }
js-api-gateway = { path = "../js-api-gateway" }
js-caps = { path = "../js-caps" }
js-elastic = { path = "../js-elastic" }
js-jobs = { path = "../js-jobs" }
js-lease = { path = "../js-lease" }
js-logmint = { path = "../js-logmint" }
js-logstore = { path = "../js-logstore" }
js-platform = { path = "../js-platform" }
js-pool-static = { path = "../js-pool-static" }
js-proto = { path = "../js-proto" }
js-provider = { path = "../js-provider" }
js-provider-ec2 = { path = "../js-provider-ec2" }
js-provider-lambdalabs = { path = "../js-provider-lambdalabs" }
js-registry = { path = "../js-registry" }
js-scaler = { path = "../js-scaler" }
js-sched = { path = "../js-sched" }
js-sched-placer = { path = "../js-sched-placer" }
js-state = { path = "../js-state" }
js-types = { path = "../js-types" }
js-usage = { path = "../js-usage" }
axum = { workspace = true, features = ["http1", "json", "tokio"] }
clap.workspace = true
# The lease and agent listeners speak HTTP/1.1; the job service's speaks HTTP/1.1 and HTTP/2
# on one port (src/listener.rs, `serve_both`).
hyper = { workspace = true, features = ["http1", "http2", "server"] }
hyper-util = { workspace = true, features = ["http1", "http2", "server", "server-auto", "service", "tokio"] }
rustix = { workspace = true, features = ["fs"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
# A client token of the job service is kept as its SHA-256 digest (src/config/tokens.rs).
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio ={ workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls.workspace = true
# The job service: its generated gRPC server and the bearer layer in front of both of its
# transports (src/job_api).
tonic.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The Tailscale API client (a blocking client, as the Lambda provider's).
ureq.workspace = true
# The validity of the TLS certificate a reload brings (src/tls.rs).
x509-parser.workspace = true

[features]
# The in-process server (src/in_process.rs): the test and simulation seam. In no default
# list, and turned on by no shipped binary; this crate's own tests turn it on below.
in-process = []

[dev-dependencies]
js-agent = { path = "../js-agent" }
# The job-service conformance suite, run against the real service (src/job_api/conformance_tests.rs).
js-conformance = { path = "../js-conformance" }
# The in-process server, for tests/in_process.rs.
js-lease-server = { path = ".", features = ["in-process"] }
# The elastic fake cloud with its own bill (tests/server/elastic_fake_e2e.rs).
js-elastic-fake = { path = "../js-elastic-fake" }
js-provider-fake = { path = "../js-provider-fake" }
# What the server's tests read of the placer: its fallback counters, the engines it built and
# its scheduler (src/sched/*_tests.rs).
js-sched-placer = { path = "../js-sched-placer", features = ["test-support"] }
# The store wrapper that fails a commit (`interfere`), for the heartbeat's failed-commit tests.
js-jobs = { path = "../js-jobs", features = ["test-support"] }
# The fake minter and the fake object store the host credentials of live logs are minted
# from and tried against (src/agent_api_log_tests.rs, src/logs/tests.rs).
js-logmint = { path = "../js-logmint", features = ["fake"] }
js-logstore = { path = "../js-logstore", features = ["fake"] }
js-state = { path = "../js-state", features = ["test-support"] }
js-testkit = { path = "../js-testkit" }
# The test that keeps the secrets out of every log line reads the HTTP client's own
# `log` output.
log.workspace = true
rcgen.workspace = true
# `oneshot` on the router, for the tests that set the peer of a request.
tower = { workspace = true, features = ["util"] }
# The job service's tests: a tonic client over an in-memory stream, a call of any method by
# name, and the method names from js-proto's descriptor set (src/job_api/tests.rs).
prost-types.workspace = true
# The read calls' tests decode the gateway's JSON by the proto3 JSON mapping, to compare it
# with the gRPC answer (src/job_api/read_tests.rs).
prost-reflect = { workspace = true, features = ["serde"] }
tonic = { workspace = true, features = ["transport"] }
tonic-prost.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
